<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Slide — Spectrum Unlocked</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #1f0033;
      color: #fff;
      min-height: 100vh;
    }
    
    .app {
      display: grid;
      grid-template-columns: 1fr 420px;
      grid-template-rows: 60px 1fr;
      height: 100vh;
    }
    
    .header {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #2a004a 0%, #52008C 100%);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .back-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .back-btn:hover { background: rgba(255,255,255,0.2); }
    .header h1 { font-size: 18px; font-weight: 600; }
    .header h1 .day { color: #FDB03E; }
    .header-actions { display: flex; gap: 12px; }
    
    .btn {
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #18A8F1;
      color: #fff;
    }
    .btn-primary:hover { background: #219a52; transform: translateY(-1px); }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }
    
    .preview-area {
      background: #0a0a12;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: auto;
    }
    
    .preview-container {
      background: #2a004a;
      border-radius: 16px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.6);
      overflow: hidden;
    }
    
    .preview-container iframe {
      border: none;
      display: block;
    }
    
    .editor-panel {
      background: #2a004a;
      border-left: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
    }
    
    .panel-header {
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .panel-header h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .panel-header p {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
    }
    
    .slide-nav {
      display: flex;
      gap: 8px;
      padding: 16px 20px;
      background: rgba(0,0,0,0.2);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .slide-nav button {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .slide-nav button:hover:not(:disabled) { 
      background: rgba(255,255,255,0.1); 
      border-color: #FDB03E;
    }
    .slide-nav button:disabled { 
      opacity: 0.3; 
      cursor: not-allowed; 
    }
    .slide-nav .current {
      background: rgba(253, 176, 62, 0.15);
      border-color: #FDB03E;
      color: #FDB03E;
      font-weight: 600;
    }
    
    .fields-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    
    .field-group {
      margin-bottom: 20px;
    }
    .field-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
      margin-bottom: 8px;
    }
    .field-group label .icon {
      font-size: 16px;
    }
    .field-group input,
    .field-group textarea {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 14px 16px;
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      transition: all 0.2s;
    }
    .field-group textarea {
      min-height: 100px;
      resize: vertical;
      line-height: 1.5;
    }
    .field-group input:focus,
    .field-group textarea:focus {
      outline: none;
      border-color: #FDB03E;
      background: rgba(253, 176, 62, 0.05);
    }
    .field-group .hint {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      margin-top: 6px;
    }
    
    .status-bar {
      padding: 16px 20px;
      border-top: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.2);
    }
    .status-bar .status {
      font-size: 13px;
      padding: 12px 16px;
      border-radius: 8px;
      display: none;
    }
    .status-bar .status.success {
      display: block;
      background: rgba(24, 168, 241, 0.15);
      border: 1px solid rgba(24, 168, 241, 0.3);
      color: #18A8F1;
    }
    .status-bar .status.error {
      display: block;
      background: rgba(204, 120, 203, 0.15);
      border: 1px solid rgba(204, 120, 203, 0.3);
      color: #CC78CB;
    }
    .status-bar .status.loading {
      display: block;
      background: rgba(24, 168, 241, 0.15);
      border: 1px solid rgba(24, 168, 241, 0.3);
      color: #18A8F1;
    }
    
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 40px;
      color: rgba(255,255,255,0.5);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
    .empty-state h3 { font-size: 16px; margin-bottom: 8px; color: #fff; }
    .empty-state p { font-size: 13px; line-height: 1.6; }
    
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .loading-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .loading-overlay .content {
      text-align: center;
    }
    .loading-overlay .spinner {
      font-size: 48px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-overlay p {
      margin-top: 16px;
      font-size: 16px;
    }
    
    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: 60px 350px 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="content">
      <div class="spinner">⏳</div>
      <p id="loadingText">Rendering PNG...</p>
    </div>
  </div>

  <div class="app">
    <header class="header">
      <div class="header-left">
        <a href="calendar-60day.html" class="back-btn">← Back</a>
        <h1><span class="day" id="headerTitle">Loading...</span></h1>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary" onclick="resetChanges()">↩️ Reset</button>
        <button class="btn btn-secondary" onclick="renderAllSlides()">📦 Render All Slides</button>
        <button class="btn btn-primary" onclick="saveAndRender()">💾 Save This Slide</button>
      </div>
    </header>
    
    <main class="preview-area">
      <div class="preview-container" id="previewContainer">
        <div class="empty-state">
          <div class="icon">🖼️</div>
          <h3>Loading preview...</h3>
        </div>
      </div>
    </main>
    
    <aside class="editor-panel">
      <div class="panel-header">
        <h2>✏️ Edit Text</h2>
        <p>Changes update the preview live</p>
      </div>
      
      <div class="slide-nav" id="slideNav">
        <!-- Populated by JS -->
      </div>
      
      <div class="fields-area" id="fieldsArea">
        <div class="empty-state">
          <div class="icon">📝</div>
          <h3>No slide loaded</h3>
          <p>Open this editor from the calendar by clicking the Edit button on any slide.</p>
        </div>
      </div>
      
      <div class="status-bar">
        <div class="status" id="statusMessage"></div>
      </div>
    </aside>
  </div>

  <script>
    // State
    let currentDay = null;
    let currentSlide = null;
    let currentFolder = null;
    let totalSlides = 0;
    let originalHTML = '';
    let currentHTML = '';
    let textMappings = []; // Maps field IDs to text positions in HTML
    
    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      currentDay = parseInt(params.get('day'));
      currentSlide = parseInt(params.get('slide')) || 1;
      currentFolder = params.get('folder');
      totalSlides = parseInt(params.get('slides')) || 6;
      
      if (currentDay && currentFolder) {
        document.getElementById('headerTitle').textContent = `Day ${currentDay} — Slide ${currentSlide}`;
        buildSlideNav();
        loadSlide();
      }
    });
    
    function buildSlideNav() {
      const nav = document.getElementById('slideNav');
      let html = '';
      for (let i = 1; i <= totalSlides; i++) {
        const isCurrent = i === currentSlide;
        html += `<button onclick="goToSlide(${i})" ${isCurrent ? 'class="current"' : ''}>${i}</button>`;
      }
      nav.innerHTML = html;
    }
    
    function goToSlide(num) {
      currentSlide = num;
      document.getElementById('headerTitle').textContent = `Day ${currentDay} — Slide ${currentSlide}`;
      buildSlideNav();
      loadSlide();
    }
    
    async function loadSlide() {
      showStatus('Loading slide...', 'loading');
      
      const slideNum = currentSlide.toString().padStart(2, '0');
      const folderPath = `content/${currentFolder}/`;
      
      try {
        // Find HTML file for this slide
        const dirResponse = await fetch(folderPath);
        const dirText = await dirResponse.text();
        
        const regex = new RegExp(`slide-${slideNum}-([^"]+)\\.html`);
        const match = regex.exec(dirText);
        
        if (!match) throw new Error('Slide HTML not found');
        
        const htmlFile = `slide-${slideNum}-${match[1]}.html`;
        window.currentFilePath = folderPath + htmlFile;
        window.currentPngPath = folderPath + htmlFile.replace('.html', '.png');
        
        // Load HTML
        const htmlResponse = await fetch(window.currentFilePath);
        originalHTML = await htmlResponse.text();
        currentHTML = originalHTML;
        
        // Display preview
        displayPreview();
        
        // Extract text fields
        extractTextFields();
        
        showStatus('Ready to edit', 'success');
        setTimeout(() => hideStatus(), 2000);
        
      } catch (err) {
        showStatus('Error: ' + err.message, 'error');
      }
    }
    
    function detectSize(html) {
      // Detect size from HTML body style
      const match = html.match(/body\s*\{[^}]*width:\s*(\d+)px;\s*height:\s*(\d+)px/);
      if (match) {
        return { width: parseInt(match[1]), height: parseInt(match[2]) };
      }
      return { width: 1080, height: 1350 }; // Default carousel size
    }
    
    function displayPreview() {
      const container = document.getElementById('previewContainer');
      const size = detectSize(currentHTML);
      window.currentSize = size;
      
      const maxHeight = window.innerHeight - 100;
      const scale = Math.min(maxHeight / size.height, 0.45);
      
      container.innerHTML = `
        <iframe 
          id="previewFrame"
          srcdoc="${escapeHTML(currentHTML)}"
          width="${size.width}"
          height="${size.height}"
          style="transform: scale(${scale}); transform-origin: top left;"
        ></iframe>
      `;
      container.style.width = (size.width * scale) + 'px';
      container.style.height = (size.height * scale) + 'px';
      
      // Show size in header
      const sizeLabel = size.height === 1920 ? '(Story/Reel)' : size.height === 1080 ? '(Square)' : '(Carousel)';
      document.getElementById('headerTitle').textContent = `Day ${currentDay} — Slide ${currentSlide} ${sizeLabel}`;
    }
    
    function escapeHTML(html) {
      return html.replace(/"/g, '&quot;');
    }
    
    function extractTextFields() {
      const parser = new DOMParser();
      const doc = parser.parseFromString(currentHTML, 'text/html');
      
      textMappings = [];
      const fieldsArea = document.getElementById('fieldsArea');
      let fieldsHTML = '';
      
      // Define what to extract with friendly labels
      const extractors = [
        { selector: '.badge', label: 'Badge', icon: '🏷️' },
        { selector: '.myth-badge', label: 'Badge', icon: '🏷️' },
        { selector: '.truth-badge', label: 'Badge', icon: '🏷️' },
        { selector: '.main-title', label: 'Main Title', icon: '📰' },
        { selector: '.title', label: 'Title', icon: '📰' },
        { selector: '.myth-text', label: 'Myth Text', icon: '❌' },
        { selector: '.truth-text', label: 'Truth/Body', icon: '✅' },
        { selector: '.subtitle', label: 'Subtitle', icon: '📝' },
        { selector: '.hook', label: 'Hook', icon: '🪝' },
        { selector: '.text', label: 'Body Text', icon: '📄' },
        { selector: '.question', label: 'Question', icon: '❓' },
        { selector: '.cta-text', label: 'Call to Action', icon: '📢' },
        { selector: '.follow-text', label: 'Follow Text', icon: '👆' },
      ];
      
      let fieldIndex = 0;
      const seenTexts = new Set();
      
      extractors.forEach(({ selector, label, icon }) => {
        doc.querySelectorAll(selector).forEach((el, i) => {
          // Get direct text content (not nested elements)
          let text = '';
          el.childNodes.forEach(node => {
            if (node.nodeType === Node.TEXT_NODE) {
              text += node.textContent;
            } else if (node.nodeType === Node.ELEMENT_NODE) {
              text += node.textContent;
            }
          });
          text = text.trim();
          
          // Skip empty, duplicates, or handle (@)
          if (!text || text.length < 2 || text.startsWith('@') || seenTexts.has(text)) return;
          seenTexts.add(text);
          
          const id = `field_${fieldIndex}`;
          const displayLabel = label;
          
          textMappings.push({
            id,
            originalText: text,
            selector
          });
          
          const isLong = text.length > 80;
          fieldsHTML += `
            <div class="field-group">
              <label><span class="icon">${icon}</span> ${displayLabel}</label>
              ${isLong 
                ? `<textarea id="${id}" oninput="updatePreview()">${text}</textarea>`
                : `<input type="text" id="${id}" value="${text.replace(/"/g, '&quot;')}" oninput="updatePreview()">`
              }
            </div>
          `;
          fieldIndex++;
        });
      });
      
      if (fieldIndex === 0) {
        fieldsHTML = `
          <div class="empty-state">
            <div class="icon">🤷</div>
            <h3>No editable text found</h3>
            <p>This slide may use a different structure.</p>
          </div>
        `;
      }
      
      fieldsArea.innerHTML = fieldsHTML;
    }
    
    function updatePreview() {
      currentHTML = originalHTML;
      
      textMappings.forEach(({ id, originalText }) => {
        const input = document.getElementById(id);
        if (input && input.value !== originalText) {
          // Replace text in HTML (careful with special chars)
          const newText = input.value;
          currentHTML = currentHTML.split(originalText).join(newText);
        }
      });
      
      // Update iframe
      const frame = document.getElementById('previewFrame');
      if (frame) {
        frame.srcdoc = escapeHTML(currentHTML);
      }
    }
    
    function resetChanges() {
      currentHTML = originalHTML;
      extractTextFields();
      displayPreview();
      showStatus('Changes reset', 'success');
      setTimeout(() => hideStatus(), 2000);
    }
    
    async function saveAndRender() {
      showLoading('Saving and rendering PNG...');
      
      try {
        // Try local render server first
        const response = await fetch('http://localhost:3456/render', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            html: currentHTML,
            outputPath: window.currentPngPath
          })
        });
        
        if (response.ok) {
          // Also save the HTML
          await fetch('http://localhost:3456/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              html: currentHTML,
              filePath: window.currentFilePath
            })
          });
          
          hideLoading();
          showStatus('✅ Saved! PNG exported to: ' + window.currentPngPath, 'success');
          
          // Update original to match current
          originalHTML = currentHTML;
          
        } else {
          throw new Error('Render failed');
        }
        
      } catch (err) {
        hideLoading();
        
        if (err.message.includes('Failed to fetch')) {
          showStatus('⚠️ Start render server: node render-server.js', 'error');
        } else {
          showStatus('Error: ' + err.message, 'error');
        }
      }
    }
    
    async function renderAllSlides() {
      showLoading('Rendering all slides...');
      
      const folderPath = `content/${currentFolder}/`;
      let rendered = 0;
      let errors = [];
      
      try {
        // Get all HTML files in folder
        const dirResponse = await fetch(folderPath);
        const dirText = await dirResponse.text();
        
        // Find all slide HTML files
        const regex = /slide-\d+-[^"]+\.html/g;
        const htmlFiles = [...new Set(dirText.match(regex) || [])];
        
        for (const htmlFile of htmlFiles) {
          try {
            document.getElementById('loadingText').textContent = `Rendering ${htmlFile}...`;
            
            // Fetch HTML
            const response = await fetch(folderPath + htmlFile);
            const html = await response.text();
            
            // Render via server
            const renderResponse = await fetch('http://localhost:3456/render', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                html: html,
                outputPath: folderPath + htmlFile.replace('.html', '.png')
              })
            });
            
            if (renderResponse.ok) {
              rendered++;
            } else {
              errors.push(htmlFile);
            }
          } catch (e) {
            errors.push(htmlFile);
          }
        }
        
        hideLoading();
        
        if (errors.length === 0) {
          showStatus(`✅ Rendered all ${rendered} slides!`, 'success');
        } else {
          showStatus(`Rendered ${rendered} slides. ${errors.length} failed.`, 'error');
        }
        
      } catch (err) {
        hideLoading();
        if (err.message.includes('Failed to fetch')) {
          showStatus('⚠️ Start render server: node render-server.js', 'error');
        } else {
          showStatus('Error: ' + err.message, 'error');
        }
      }
    }
    
    function showStatus(message, type) {
      const el = document.getElementById('statusMessage');
      el.textContent = message;
      el.className = 'status ' + type;
    }
    
    function hideStatus() {
      document.getElementById('statusMessage').className = 'status';
    }
    
    function showLoading(text) {
      document.getElementById('loadingText').textContent = text;
      document.getElementById('loadingOverlay').classList.add('active');
    }
    
    function hideLoading() {
      document.getElementById('loadingOverlay').classList.remove('active');
    }
  </script>
</body>
</html>
