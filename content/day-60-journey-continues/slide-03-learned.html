<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1350px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.06; }
    .bg-shape-1 { width: 400px; height: 400px; background: #4A90A4; top: -100px; right: -100px; }
    .label { 
      font-size: 16px; 
      text-transform: uppercase; 
      letter-spacing: 4px; 
      opacity: 0.5;
      margin-bottom: 25px;
    }
    .title { 
      font-family: 'Playfair Display', serif;
      font-size: 50px; 
      font-weight: 800; 
      color: #4A90A4;
      margin-bottom: 50px;
    }
    .lessons {
      max-width: 900px;
    }
    .lesson {
      font-size: 30px;
      line-height: 1.5;
      margin-bottom: 30px;
      padding-bottom: 30px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      text-align: left;
    }
    .lesson:last-child {
      border-bottom: none;
    }
    .lesson .emoji {
      font-size: 34px;
      margin-right: 18px;
    }
    .highlight { color: #E8B86D; }
    .highlight-green { color: #27AE60; }
    .highlight-teal { color: #4A90A4; }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .slide-num { font-size: 16px; opacity: 0.4; letter-spacing: 2px; margin-bottom: 8px; }
    .handle { font-size: 18px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  
  <div class="label">Key Takeaways</div>
  
  <div class="title">What We Learned</div>
  
  <div class="lessons">
    <div class="lesson">
      <span class="emoji">🧩</span><span class="highlight">Different</span>, not less. Always.
    </div>
    
    <div class="lesson">
      <span class="emoji">🎭</span>Masking has a <span class="highlight-teal">cost</span>. Authenticity heals.
    </div>
    
    <div class="lesson">
      <span class="emoji">⚖️</span>Accommodations are <span class="highlight-green">rights</span>, not favors.
    </div>
    
    <div class="lesson">
      <span class="emoji">🗣️</span>Your <span class="highlight">voice</span> matters. Use it.
    </div>
    
    <div class="lesson">
      <span class="emoji">✨</span>Autistic joy is <span class="highlight-green">real</span> and worth protecting.
    </div>
  </div>
  
  <div class="footer">
    <div class="slide-num">2 of 6</div>
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
