<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1350px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 500px; height: 500px; background: #E8B86D; top: -150px; right: -150px; }
    .bg-shape-2 { width: 400px; height: 400px; background: #4A90A4; bottom: 50px; left: -150px; }
    .bg-shape-3 { width: 300px; height: 300px; background: #27AE60; top: 300px; right: -80px; }
    .label { 
      font-size: 16px; 
      text-transform: uppercase; 
      letter-spacing: 4px; 
      opacity: 0.5;
      margin-bottom: 30px;
    }
    .title { 
      font-family: 'Playfair Display', serif;
      font-size: 48px; 
      font-weight: 800; 
      color: #E8B86D;
      margin-bottom: 50px;
    }
    .affirmation {
      font-size: 34px;
      line-height: 1.5;
      max-width: 850px;
      margin-bottom: 25px;
      padding: 22px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .affirmation:last-of-type {
      border-bottom: none;
      margin-bottom: 0;
    }
    .affirmation .emoji {
      font-size: 38px;
      margin-right: 15px;
    }
    .highlight { color: #4A90A4; }
    .highlight-gold { color: #E8B86D; }
    .highlight-green { color: #27AE60; }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .slide-num { font-size: 16px; opacity: 0.4; letter-spacing: 2px; margin-bottom: 8px; }
    .handle { font-size: 18px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  <div class="bg-shape bg-shape-3"></div>
  
  <div class="label">Final Affirmations</div>
  
  <div class="title">Remember This</div>
  
  <div class="affirmation">
    <span class="emoji">🌟</span>I am <span class="highlight-gold">worthy</span> exactly as I am
  </div>
  
  <div class="affirmation">
    <span class="emoji">🧠</span>My brain is <span class="highlight">different</span>, not broken
  </div>
  
  <div class="affirmation">
    <span class="emoji">✊</span>I deserve <span class="highlight-green">acceptance</span>, not just tolerance
  </div>
  
  <div class="affirmation">
    <span class="emoji">🌈</span>My existence is a <span class="highlight-gold">gift</span>
  </div>
  
  <div class="affirmation">
    <span class="emoji">🚀</span>The journey <span class="highlight-green">continues</span>
  </div>
  
  <div class="footer">
    <div class="slide-num">5 of 6</div>
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
