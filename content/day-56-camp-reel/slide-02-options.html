<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }
    
    .title {
      font-size: 52px;
      font-weight: 800;
      color: #E8B86D;
      margin-bottom: 50px;
    }
    
    .option {
      background: rgba(74, 144, 164, 0.2);
      border: 2px solid #4A90A4;
      border-radius: 20px;
      padding: 30px 40px;
      margin-bottom: 25px;
      width: 100%;
      max-width: 900px;
      text-align: left;
    }
    
    .option-title {
      font-size: 36px;
      font-weight: 700;
      color: #E8B86D;
      margin-bottom: 10px;
    }
    
    .option-text {
      font-size: 30px;
      line-height: 1.4;
      opacity: 0.9;
    }
    
    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">Camp Options</div>
    <div class="option">
      <div class="option-title">🎯 Specialized Camps</div>
      <div class="option-text">Designed specifically for autistic kids. Trained staff, built-in supports.</div>
    </div>
    <div class="option">
      <div class="option-title">🤝 Inclusive Camps</div>
      <div class="option-text">Mainstream camps with inclusion programs. May offer 1:1 aides.</div>
    </div>
    <div class="option">
      <div class="option-title">🌿 Therapeutic Camps</div>
      <div class="option-text">OT, speech, or social skills focused. Learning while having fun!</div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
