<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }
    
    .category {
      font-size: 28px;
      font-weight: 600;
      color: #4A90A4;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }
    
    .title {
      font-size: 56px;
      font-weight: 800;
      color: #E8B86D;
      margin-bottom: 50px;
    }
    
    .book-list {
      text-align: left;
      font-size: 32px;
      line-height: 2;
      max-width: 900px;
    }
    
    .book {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 10px;
    }
    
    .icon {
      font-size: 32px;
    }
    
    .book-title {
      font-weight: 600;
    }
    
    .author {
      font-size: 26px;
      opacity: 0.7;
    }
    
    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="category">Category 3</div>
    <div class="title">📚 Must-Read Books</div>
    <div class="book-list">
      <div class="book">
        <span class="icon">📖</span>
        <div>
          <span class="book-title">Uniquely Human</span>
          <div class="author">Barry Prizant</div>
        </div>
      </div>
      <div class="book">
        <span class="icon">📖</span>
        <div>
          <span class="book-title">NeuroTribes</span>
          <div class="author">Steve Silberman</div>
        </div>
      </div>
      <div class="book">
        <span class="icon">📖</span>
        <div>
          <span class="book-title">The Reason I Jump</span>
          <div class="author">Naoki Higashida</div>
        </div>
      </div>
      <div class="book">
        <span class="icon">📖</span>
        <div>
          <span class="book-title">Unmasking Autism</span>
          <div class="author">Devon Price</div>
        </div>
      </div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
