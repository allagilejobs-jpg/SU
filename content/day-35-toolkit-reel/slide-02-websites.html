<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }
    
    .category {
      font-size: 28px;
      font-weight: 600;
      color: #4A90A4;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }
    
    .title {
      font-size: 56px;
      font-weight: 800;
      color: #E8B86D;
      margin-bottom: 50px;
    }
    
    .resource-list {
      text-align: left;
      font-size: 34px;
      line-height: 2.2;
      max-width: 900px;
    }
    
    .resource {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    
    .icon {
      font-size: 36px;
    }
    
    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="category">Category 1</div>
    <div class="title">🌐 Trusted Websites</div>
    <div class="resource-list">
      <div class="resource"><span class="icon">✓</span> Autism Speaks (resources, not ideology)</div>
      <div class="resource"><span class="icon">✓</span> ASAN (Autistic Self Advocacy Network)</div>
      <div class="resource"><span class="icon">✓</span> Understood.org</div>
      <div class="resource"><span class="icon">✓</span> Child Mind Institute</div>
      <div class="resource"><span class="icon">✓</span> Wrightslaw (IEP/advocacy)</div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
