<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 40%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 80px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 500px; height: 500px; background: #FDB03E; top: -150px; left: -150px; }
    .bg-shape-2 { width: 400px; height: 400px; background: #18A8F1; bottom: -100px; right: -100px; }
    .quote-mark {
      font-size: 120px;
      color: #FDB03E;
      opacity: 0.3;
      font-family: 'Playfair Display', serif;
      line-height: 1;
      margin-bottom: 20px;
    }
    .quote-text {
      font-family: 'Playfair Display', serif;
      font-size: 52px;
      font-weight: 700;
      font-style: italic;
      line-height: 1.3;
      max-width: 900px;
      margin-bottom: 50px;
    }
    .quote-text .gold { color: #FDB03E; }
    .attribution {
      font-size: 22px;
      opacity: 0.6;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .handle { font-size: 20px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>

  <div class="quote-mark">"</div>

  <div class="quote-text">
    Independence doesn't mean doing it alone. It means having the <span class="gold">right support</span> to do it yourself.
  </div>

  <div class="attribution">— Spectrum Unlocked</div>

  <div class="footer">
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
