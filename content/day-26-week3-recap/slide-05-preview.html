<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1350px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 50%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.06; }
    .bg-shape-1 { width: 400px; height: 400px; background: #FDB03E; bottom: -100px; left: -100px; }
    .label { 
      font-size: 16px; 
      text-transform: uppercase; 
      letter-spacing: 4px; 
      opacity: 0.5;
      margin-bottom: 20px;
      margin-top: 20px;
    }
    .title { 
      font-family: 'Playfair Display', serif;
      font-size: 46px; 
      font-weight: 800; 
      color: #FDB03E;
      margin-bottom: 35px;
    }
    .coming-up {
      max-width: 900px;
    }
    .coming-item {
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(253, 176, 62, 0.1);
      border-radius: 16px;
      padding: 25px 30px;
      margin-bottom: 18px;
      text-align: left;
    }
    .coming-emoji { font-size: 36px; }
    .coming-text { font-size: 22px; font-weight: 600; }
    .coming-text span { color: #18A8F1; }
    .excitement-box {
      background: linear-gradient(135deg, rgba(24, 168, 241, 0.2), rgba(24, 168, 241, 0.1));
      border: 2px solid rgba(24, 168, 241, 0.3);
      border-radius: 20px;
      padding: 30px;
      margin-top: 30px;
    }
    .excitement-text {
      font-size: 24px;
      font-weight: 600;
      color: #18A8F1;
    }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .slide-num { font-size: 16px; opacity: 0.4; letter-spacing: 2px; margin-bottom: 8px; }
    .handle { font-size: 18px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  
  <div class="label">Coming Up</div>
  
  <div class="title">Week 4 Preview 🔮</div>
  
  <div class="coming-up">
    <div class="coming-item">
      <div class="coming-emoji">🧒</div>
      <div class="coming-text">Autism in <span>Teens</span>: Puberty Edition</div>
    </div>
    
    <div class="coming-item">
      <div class="coming-emoji">🌿</div>
      <div class="coming-text">Nature and <span>Sensory</span> Benefits</div>
    </div>
    
    <div class="coming-item">
      <div class="coming-emoji">💛</div>
      <div class="coming-text">Building <span>Friendships</span></div>
    </div>
    
    <div class="coming-item">
      <div class="coming-emoji">🔍</div>
      <div class="coming-text"><span>Late Diagnosis</span>: Adult Edition</div>
    </div>
    
    <div class="coming-item">
      <div class="coming-emoji">👫</div>
      <div class="coming-text">Glass Child: <span>Siblings</span> Revisited</div>
    </div>
    
    <div class="coming-item">
      <div class="coming-emoji">🎉</div>
      <div class="coming-text">End of <span>Autism Acceptance Month</span></div>
    </div>
  </div>
  
  <div class="excitement-box">
    <div class="excitement-text">The best is yet to come! 💙</div>
  </div>
  
  <div class="footer">
    <div class="slide-num">4 of 5</div>
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
