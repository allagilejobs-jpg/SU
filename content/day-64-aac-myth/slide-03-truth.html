<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide { width: 1080px; height: 1350px; background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%); padding: 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Poppins', sans-serif; color: white; text-align: center; position: relative; }
    .slide-num { position: absolute; top: 30px; right: 30px; font-size: 16px; opacity: 0.4; }
    .label { font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; color: #27AE60; margin-bottom: 30px; }
    .truth-box { background: rgba(39, 174, 96, 0.12); border: 3px solid #27AE60; border-radius: 24px; padding: 50px 40px; max-width: 900px; width: 100%; }
    .truth-icon { font-size: 80px; margin-bottom: 20px; }
    .truth-text { font-family: 'Playfair Display', serif; font-size: 44px; font-weight: 800; line-height: 1.3; color: #27AE60; margin-bottom: 25px; }
    .truth-detail { font-size: 24px; line-height: 1.6; opacity: 0.95; }
    .brand { position: absolute; bottom: 30px; font-size: 16px; font-weight: 600; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-num">3 / 5</div>
    <div class="label">✅ The Truth</div>
    <div class="truth-box">
      <div class="truth-icon">💚</div>
      <div class="truth-text">AAC supports ALL communication.</div>
      <div class="truth-detail">Speaking is not the only form of communication. Many people who can talk still benefit from AAC — especially during meltdowns, shutdowns, high-stress moments, or when verbal language becomes unreliable.</div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
