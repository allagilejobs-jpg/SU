<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: white;
    }
    .title { font-size: 48px; font-weight: 800; color: #E8B86D; margin-bottom: 40px; }
    .signs { display: flex; flex-direction: column; gap: 25px; }
    .sign { background: rgba(74,144,164,0.15); padding: 30px; border-radius: 20px; font-size: 34px; display: flex; align-items: center; gap: 20px; }
    .icon { font-size: 45px; }
    .brand { position: absolute; bottom: 40px; left: 60px; font-size: 24px; font-weight: 600; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">Common AuDHD Experiences</div>
    <div class="signs">
      <div class="sign"><span class="icon">🔄</span> Hyperfocus that shifts unpredictably</div>
      <div class="sign"><span class="icon">😤</span> Emotional whiplash - big feelings, fast</div>
      <div class="sign"><span class="icon">🛋️</span> Paralysis paradox - want to do ALL things, frozen</div>
      <div class="sign"><span class="icon">🎭</span> Double masking - hiding both at once</div>
      <div class="sign"><span class="icon">⏰</span> Time blindness PLUS schedule panic</div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
