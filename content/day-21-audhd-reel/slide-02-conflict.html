<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: white;
    }
    .title { font-size: 48px; font-weight: 800; color: #E8B86D; margin-bottom: 50px; text-align: center; }
    .conflict { display: flex; flex-direction: column; gap: 30px; }
    .row { display: flex; align-items: center; gap: 20px; font-size: 34px; }
    .left { flex: 1; background: rgba(74,144,164,0.2); padding: 25px; border-radius: 15px; text-align: center; }
    .vs { font-size: 28px; font-weight: 800; color: #E74C3C; }
    .right { flex: 1; background: rgba(232,184,109,0.2); padding: 25px; border-radius: 15px; text-align: center; }
    .label { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
    .autism { color: #4A90A4; }
    .adhd { color: #E8B86D; }
    .brand { position: absolute; bottom: 40px; left: 60px; font-size: 24px; font-weight: 600; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">The Internal Tug-of-War</div>
    <div class="conflict">
      <div class="row">
        <div class="left"><div class="label autism">🧩 Autism says:</div>"I need routine"</div>
        <div class="vs">VS</div>
        <div class="right"><div class="label adhd">⚡ ADHD says:</div>"I'm bored, need novelty"</div>
      </div>
      <div class="row">
        <div class="left"><div class="label autism">🧩 Autism says:</div>"Plan everything"</div>
        <div class="vs">VS</div>
        <div class="right"><div class="label adhd">⚡ ADHD says:</div>"Plans? What plans?"</div>
      </div>
      <div class="row">
        <div class="left"><div class="label autism">🧩 Autism says:</div>"Finish this task"</div>
        <div class="vs">VS</div>
        <div class="right"><div class="label adhd">⚡ ADHD says:</div>"Ooh, shiny thing!"</div>
      </div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
