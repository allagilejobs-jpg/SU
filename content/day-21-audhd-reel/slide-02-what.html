<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide { width: 1080px; height: 1920px; background: linear-gradient(165deg, #2a004a 0%, #52008C 40%, #3a005f 100%); padding: 80px 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Poppins', sans-serif; color: white; text-align: center; position: relative; }
    .label { font-size: 28px; font-weight: 600; color: #18A8F1; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 40px; }
    .title { font-size: 64px; font-weight: 800; color: #FDB03E; margin-bottom: 50px; line-height: 1.2; }
    .content { font-size: 42px; line-height: 1.6; max-width: 900px; }
    .highlight { color: #FDB03E; font-weight: 700; }
    .stat-box { margin-top: 60px; background: rgba(253, 176, 62, 0.15); border: 3px solid #FDB03E; border-radius: 20px; padding: 30px 50px; font-size: 36px; font-weight: 600; }
    .brand { position: absolute; bottom: 40px; font-size: 24px; font-weight: 600; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">What is AuDHD?</div>
    <div class="title">Autism + ADHD<br>Together</div>
    <div class="content">Two neurotypes in one brain,<br>often <span class="highlight">conflicting</span> with each other</div>
    <div class="stat-box">📊 50-70% of autistic people also have ADHD</div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
