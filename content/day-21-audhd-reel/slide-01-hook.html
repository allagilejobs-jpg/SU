<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
    }
    .emoji { font-size: 120px; margin-bottom: 40px; }
    .main { font-size: 68px; font-weight: 800; line-height: 1.15; margin-bottom: 40px; }
    .main span { color: #E8B86D; }
    .sub { font-size: 40px; opacity: 0.9; max-width: 850px; }
    .swipe { position: absolute; bottom: 120px; font-size: 28px; font-weight: 600; color: #4A90A4; }
    .brand { position: absolute; bottom: 40px; font-size: 24px; font-weight: 600; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="emoji">🧠⚡</div>
    <div class="main"><span>AuDHD:</span><br>When Your Brain Has<br>Two Operating Systems</div>
    <div class="sub">Autism + ADHD fighting for control</div>
    <div class="swipe">Swipe to understand →</div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
