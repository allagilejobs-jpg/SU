<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide { width: 1080px; height: 1920px; background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%); padding: 80px 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Poppins', sans-serif; color: white; text-align: center; position: relative; }
    .vs-label { font-size: 32px; font-weight: 600; color: #4A90A4; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 50px; }
    .box { width: 100%; max-width: 900px; padding: 40px; border-radius: 25px; margin-bottom: 30px; }
    .autism-box { background: rgba(74, 144, 164, 0.2); border: 3px solid #4A90A4; }
    .adhd-box { background: rgba(232, 184, 109, 0.2); border: 3px solid #E8B86D; }
    .box-label { font-size: 28px; font-weight: 700; margin-bottom: 15px; letter-spacing: 2px; }
    .autism-box .box-label { color: #4A90A4; }
    .adhd-box .box-label { color: #E8B86D; }
    .box-text { font-size: 38px; font-weight: 600; line-height: 1.4; }
    .vs { font-size: 60px; font-weight: 800; color: #E8B86D; margin: 20px 0; }
    .result { margin-top: 40px; font-size: 36px; opacity: 0.9; }
    .brand { position: absolute; bottom: 40px; font-size: 24px; font-weight: 600; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="vs-label">The Internal Battle</div>
    <div class="box autism-box"><div class="box-label">AUTISM SAYS:</div><div class="box-text">"I need routine and sameness"</div></div>
    <div class="vs">VS</div>
    <div class="box adhd-box"><div class="box-label">ADHD SAYS:</div><div class="box-text">"I'm bored, let's do something new!"</div></div>
    <div class="result">😵‍💫 Result: Constant internal conflict</div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
