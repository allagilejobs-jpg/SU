<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1350px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 50%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 400px; height: 400px; background: #FDB03E; bottom: -100px; right: -100px; }
    .section-badge {
      background: #18A8F1;
      padding: 10px 25px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }
    .main-title { 
      font-family: 'Playfair Display', serif; 
      font-size: 48px; 
      font-weight: 800; 
      line-height: 1.2; 
      margin-bottom: 40px;
      max-width: 900px;
    }
    .highlight { color: #18A8F1; }
    .highlight-gold { color: #FDB03E; }
    .checklist {
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 40px;
      max-width: 850px;
      text-align: left;
    }
    .checklist-item {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin: 25px 0;
      font-size: 26px;
      line-height: 1.4;
    }
    .checkbox {
      width: 36px;
      height: 36px;
      border: 3px solid #18A8F1;
      border-radius: 8px;
      flex-shrink: 0;
      margin-top: 3px;
    }
    .item-note {
      font-size: 20px;
      opacity: 0.7;
      margin-top: 5px;
    }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .handle { font-size: 20px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  
  <div class="section-badge">In The Meeting</div>
  
  <div class="main-title">
    <span class="highlight">During</span> the IEP
  </div>
  
  <div class="checklist">
    <div class="checklist-item">
      <div class="checkbox"></div>
      <div>Ask them to explain anything you don't understand</div>
    </div>
    <div class="checklist-item">
      <div class="checkbox"></div>
      <div>
        Take notes or record
        <div class="item-note">(Check your state's laws first)</div>
      </div>
    </div>
    <div class="checklist-item">
      <div class="checkbox"></div>
      <div>
        You do NOT have to sign same-day
        <div class="item-note">(Take it home. Review it.)</div>
      </div>
    </div>
  </div>
  
  <div class="footer">
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
