<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }
    
    .title {
      font-size: 56px;
      font-weight: 800;
      color: #27AE60;
      margin-bottom: 60px;
    }
    
    .list {
      text-align: left;
      font-size: 38px;
      line-height: 2.2;
    }
    
    .list-item {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 10px;
    }
    
    .emoji {
      font-size: 40px;
    }
    
    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">Why Nature Helps</div>
    <div class="list">
      <div class="list-item"><span class="emoji">🔇</span> Less artificial noise</div>
      <div class="list-item"><span class="emoji">💡</span> Natural lighting (no fluorescents)</div>
      <div class="list-item"><span class="emoji">🌬️</span> Fresh air regulates the nervous system</div>
      <div class="list-item"><span class="emoji">🏃</span> Space to move freely</div>
      <div class="list-item"><span class="emoji">🧘</span> Calming sensory input</div>
      <div class="list-item"><span class="emoji">🌳</span> No social scripts required</div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
