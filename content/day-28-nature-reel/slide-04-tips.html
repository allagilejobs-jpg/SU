<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }
    
    .title {
      font-size: 52px;
      font-weight: 800;
      color: #E8B86D;
      margin-bottom: 50px;
    }
    
    .tip-list {
      text-align: left;
      font-size: 36px;
      line-height: 2;
      max-width: 900px;
    }
    
    .tip-item {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 15px;
    }
    
    .tip-icon {
      color: #E8B86D;
      font-size: 36px;
    }
    
    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">Making It Work</div>
    <div class="tip-list">
      <div class="tip-item"><span class="tip-icon">✓</span> Go during quiet hours (early AM)</div>
      <div class="tip-item"><span class="tip-icon">✓</span> Bring sensory tools (headphones, sunglasses)</div>
      <div class="tip-item"><span class="tip-icon">✓</span> Start with short trips (15-20 min)</div>
      <div class="tip-item"><span class="tip-icon">✓</span> Let THEM lead the exploration</div>
      <div class="tip-item"><span class="tip-icon">✓</span> No agenda or forced activities</div>
      <div class="tip-item"><span class="tip-icon">✓</span> Have snacks and water ready</div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
