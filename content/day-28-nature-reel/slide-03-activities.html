<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide { width: 1080px; height: 1920px; background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%); padding: 80px 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Poppins', sans-serif; color: white; text-align: center; position: relative; }
    .title { font-size: 52px; font-weight: 800; color: #27AE60; margin-bottom: 50px; }
    .activity-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; max-width: 950px; }
    .activity-box { background: rgba(39, 174, 96, 0.15); border: 2px solid #27AE60; border-radius: 20px; padding: 30px; text-align: center; }
    .activity-emoji { font-size: 50px; margin-bottom: 15px; }
    .activity-text { font-size: 28px; font-weight: 600; line-height: 1.3; }
    .brand { position: absolute; bottom: 40px; font-size: 24px; font-weight: 600; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">Sensory-Friendly Activities</div>
    <div class="activity-grid">
      <div class="activity-box"><div class="activity-emoji">🪨</div><div class="activity-text">Collect rocks, leaves, sticks</div></div>
      <div class="activity-box"><div class="activity-emoji">💧</div><div class="activity-text">Water play at a creek</div></div>
      <div class="activity-box"><div class="activity-emoji">🐛</div><div class="activity-text">Bug watching</div></div>
      <div class="activity-box"><div class="activity-emoji">🌸</div><div class="activity-text">Smell different flowers</div></div>
      <div class="activity-box"><div class="activity-emoji">🥾</div><div class="activity-text">Quiet trail walks</div></div>
      <div class="activity-box"><div class="activity-emoji">🌈</div><div class="activity-text">Cloud watching</div></div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
