<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide { width: 1080px; height: 1350px; background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%); padding: 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Poppins', sans-serif; color: white; text-align: center; position: relative; }
    .slide-num { position: absolute; top: 30px; right: 30px; font-size: 16px; opacity: 0.4; }
    .card { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 50px 40px; max-width: 900px; width: 100%; }
    .card-num { background: #E8B86D; color: #1a1a2e; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; margin: 0 auto 20px; }
    .card-emoji { font-size: 70px; margin-bottom: 20px; }
    .card-title { font-family: 'Playfair Display', serif; font-size: 44px; font-weight: 800; color: #E8B86D; margin-bottom: 15px; }
    .card-desc { font-size: 24px; line-height: 1.6; opacity: 0.95; margin-bottom: 20px; }
    .card-detail { font-size: 20px; opacity: 0.7; line-height: 1.5; }
    .brand { position: absolute; bottom: 30px; font-size: 16px; font-weight: 600; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-num">3 / 5</div>
    <div class="card">
      <div class="card-num">3</div>
      <div class="card-emoji">🎨</div>
      <div class="card-title">Art with Texture</div>
      <div class="card-desc">Finger painting, playdough, kinetic sand, or shaving cream art. Messy play builds tolerance and provides rich tactile input.</div>
      <div class="card-detail">🎯 Great for: Tactile exploration &amp; fine motor skills</div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
