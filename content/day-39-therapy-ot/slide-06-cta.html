<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1350px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.1; }
    .bg-shape-1 { width: 600px; height: 600px; background: #27AE60; top: -200px; right: -200px; }
    .bg-shape-2 { width: 400px; height: 400px; background: #E8B86D; bottom: -100px; left: -150px; }
    .emoji-large { font-size: 100px; margin-bottom: 40px; }
    .main-text { 
      font-family: 'Playfair Display', serif; 
      font-size: 50px; 
      font-weight: 800; 
      line-height: 1.2; 
      margin-bottom: 30px;
      max-width: 850px;
    }
    .highlight { color: #27AE60; }
    .highlight-gold { color: #E8B86D; }
    .sub-text {
      font-size: 26px;
      opacity: 0.85;
      margin-bottom: 50px;
      max-width: 750px;
      line-height: 1.5;
    }
    .cta-buttons {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .cta-btn {
      padding: 22px 50px;
      border-radius: 50px;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .cta-primary {
      background: #27AE60;
      color: #1a1a2e;
    }
    .cta-secondary {
      background: rgba(232, 184, 109, 0.3);
      border: 2px solid #E8B86D;
      color: white;
    }
    .cta-tertiary {
      background: rgba(74, 144, 164, 0.3);
      border: 2px solid #4A90A4;
      color: white;
    }
    .footer { position: absolute; bottom: 40px; }
    .handle { font-size: 22px; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  
  <div class="emoji-large">✋</div>
  
  <div class="main-text">
    OT can be <span class="highlight">life-changing</span>. Ask your <span class="highlight-gold">pediatrician</span> for a referral.
  </div>
  
  <div class="sub-text">
    Next up: Speech Therapy. Save this series for reference!
  </div>
  
  <div class="cta-buttons">
    <div class="cta-btn cta-primary">💾 Save This Guide</div>
    <div class="cta-btn cta-secondary">💬 Comment Your OT Questions</div>
    <div class="cta-btn cta-tertiary">➕ Follow @spectrum_unlocked</div>
  </div>
  
  <div class="footer">
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
