<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 40%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 500px; height: 500px; background: #FDB03E; top: -150px; right: -150px; }
    .bg-shape-2 { width: 350px; height: 350px; background: #18A8F1; bottom: 50px; left: -100px; }
    .emoji { font-size: 100px; margin-bottom: 40px; }
    .main-title {
      font-family: 'Playfair Display', serif;
      font-size: 50px; font-weight: 800;
      line-height: 1.2; margin-bottom: 40px; max-width: 900px;
    }
    .highlight { color: #FDB03E; }
    .highlight-green { color: #18A8F1; }
    .recap-list {
      text-align: left; margin-bottom: 40px; max-width: 800px;
    }
    .recap-item {
      display: flex; align-items: center; gap: 15px;
      font-size: 21px; margin-bottom: 14px; opacity: 0.9;
    }
    .check { color: #18A8F1; font-size: 24px; }
    .cta-box {
      background: linear-gradient(135deg, #FDB03E 0%, #FDB03E 100%);
      color: #2a004a;
      padding: 35px 60px; border-radius: 20px; margin-bottom: 40px;
    }
    .cta-text { font-size: 28px; font-weight: 700; }
    .actions {
      display: flex; gap: 30px; flex-wrap: wrap; justify-content: center;
    }
    .action-item {
      display: flex; align-items: center; gap: 12px;
      font-size: 22px; font-weight: 600; opacity: 0.8;
    }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .handle { font-size: 22px; opacity: 0.6; }
    .follow-text { font-size: 16px; opacity: 0.4; margin-bottom: 8px; letter-spacing: 2px; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>

  <div class="emoji">⚖️</div>

  <div class="main-title">
    <span class="highlight">Screenshot</span> These <span class="highlight-green">Phrases</span>. You'll Need Them.
  </div>

  <div class="recap-list">
    <div class="recap-item"><span class="check">✓</span> "Put that in writing."</div>
    <div class="recap-item"><span class="check">✓</span> "Show me the data."</div>
    <div class="recap-item"><span class="check">✓</span> "I'd like to bring an advocate."</div>
    <div class="recap-item"><span class="check">✓</span> "We don't consent at this time."</div>
  </div>

  <div class="cta-box">
    <div class="cta-text">💾 Save these before your next IEP meeting!</div>
  </div>

  <div class="actions">
    <div class="action-item">💾 Save</div>
    <div class="action-item">📤 Share</div>
    <div class="action-item">➕ Follow</div>
  </div>

  <div class="footer">
    <div class="follow-text">KNOW YOUR RIGHTS, USE YOUR VOICE</div>
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
