<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.06; }
    .bg-shape-1 { width: 400px; height: 400px; background: #E74C3C; top: -100px; left: -100px; }
    .slide-num { position: absolute; top: 40px; right: 50px; font-size: 16px; opacity: 0.4; letter-spacing: 2px; }
    .myth-badge {
      background: #E74C3C;
      padding: 15px 40px; border-radius: 35px;
      font-size: 20px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 4px;
      margin-bottom: 50px;
    }
    .myth-icon { font-size: 100px; margin-bottom: 40px; }
    .myth-text {
      font-family: 'Playfair Display', serif;
      font-size: 44px; font-weight: 700;
      line-height: 1.3; max-width: 850px;
      padding: 40px 50px;
      background: rgba(231, 76, 60, 0.15);
      border-radius: 20px;
      border-left: 6px solid #E74C3C;
      text-decoration: line-through;
      text-decoration-color: #E74C3C;
      text-decoration-thickness: 3px;
    }
    .subtext {
      font-size: 24px; opacity: 0.6;
      margin-top: 40px; font-style: italic;
    }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .handle { font-size: 18px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="slide-num">1 / 4</div>

  <div class="myth-badge">❌ The Myth</div>

  <div class="myth-icon">🧠</div>

  <div class="myth-text">
    "Your child is too smart for an IEP."
  </div>

  <div class="subtext">
    Sound familiar? You're not alone. Let's bust this...
  </div>

  <div class="footer">
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
