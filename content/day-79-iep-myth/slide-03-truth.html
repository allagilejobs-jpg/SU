<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 40%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.06; }
    .bg-shape-1 { width: 400px; height: 400px; background: #18A8F1; top: -100px; right: -100px; }
    .slide-num { position: absolute; top: 40px; right: 50px; font-size: 16px; opacity: 0.4; letter-spacing: 2px; }
    .truth-badge {
      background: #18A8F1;
      padding: 15px 40px; border-radius: 35px;
      font-size: 20px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 4px;
      margin-bottom: 40px;
    }
    .truth-icon { font-size: 100px; margin-bottom: 40px; }
    .truth-text {
      font-family: 'Playfair Display', serif;
      font-size: 44px; font-weight: 700;
      line-height: 1.3; max-width: 850px;
      padding: 40px 50px;
      background: rgba(24, 168, 241, 0.12);
      border-radius: 20px;
      border-left: 6px solid #18A8F1;
      margin-bottom: 40px;
    }
    .truth-text .gold { color: #FDB03E; }
    .explanation {
      font-size: 24px; line-height: 1.5;
      opacity: 0.9; max-width: 850px;
    }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .handle { font-size: 18px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="slide-num">2 / 4</div>

  <div class="truth-badge">✅ The Truth</div>

  <div class="truth-icon">💡</div>

  <div class="truth-text">
    IEPs are about <span class="gold">ACCESS</span>, not intelligence.
  </div>

  <div class="explanation">
    A child can be gifted AND need accommodations. Intelligence doesn't eliminate the need for sensory breaks, social skills support, executive function help, or communication tools.
  </div>

  <div class="footer">
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
