<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hook</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
.slide { width: 1080px; height: 1920px; background: linear-gradient(165deg, #2a004a 0%, #52008C 40%, #3a005f 100%); padding: 80px 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Poppins', sans-serif; color: white; text-align: center; position: relative; overflow: hidden; }
.slide::before { content: ''; position: absolute; top: -150px; right: -150px; width: 400px; height: 400px; background: #FDB03E; border-radius: 50%; opacity: 0.1; }
.slide::after { content: ''; position: absolute; bottom: -100px; left: -100px; width: 300px; height: 300px; background: #18A8F1; border-radius: 50%; opacity: 0.1; }
.emoji-top { font-size: 120px; margin-bottom: 40px; position: relative; z-index: 1; }
.hook { font-size: 72px; font-weight: 800; line-height: 1.1; margin-bottom: 40px; position: relative; z-index: 1; }
.hook span { color: #FDB03E; }
.subtext { font-size: 36px; opacity: 0.9; max-width: 800px; line-height: 1.4; position: relative; z-index: 1; }
.swipe { position: absolute; bottom: 100px; display: flex; align-items: center; gap: 15px; font-size: 28px; font-weight: 600; color: #18A8F1; }
.swipe::after { content: '→'; font-size: 36px; animation: bounce 1s infinite; }
@keyframes bounce { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(10px); } }
.brand { position: absolute; bottom: 40px; font-size: 24px; font-weight: 600; opacity: 0.6; }
</style>
</head>
<body>
<div class="slide">
<div class="emoji-top">📚⛅</div>
<div class="hook"><span>ESY:</span><br>Summer Services<br>Are FREE</div>
<div class="subtext">And your child might qualify</div>
<div class="swipe">SWIPE</div>
<div class="brand">@spectrum_unlocked</div>
</div>
</body>
</html>
