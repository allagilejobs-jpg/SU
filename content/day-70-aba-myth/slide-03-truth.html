<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide { width: 1080px; height: 1350px; background: linear-gradient(165deg, #2a004a 0%, #52008C 40%, #3a005f 100%); padding: 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Poppins', sans-serif; color: white; text-align: center; position: relative; }
    .slide-num { position: absolute; top: 30px; right: 30px; font-size: 16px; opacity: 0.4; }
    .label { font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; color: #18A8F1; margin-bottom: 30px; }
    .truth-box { background: rgba(24, 168, 241, 0.12); border: 3px solid #18A8F1; border-radius: 24px; padding: 50px 40px; max-width: 900px; width: 100%; }
    .truth-icon { font-size: 80px; margin-bottom: 20px; }
    .truth-text { font-family: 'Playfair Display', serif; font-size: 42px; font-weight: 800; line-height: 1.3; color: #18A8F1; margin-bottom: 25px; }
    .truth-detail { font-size: 24px; line-height: 1.6; opacity: 0.95; text-align: left; }
    .therapy-list { margin-top: 15px; }
    .therapy-item { padding: 8px 0; display: flex; gap: 12px; align-items: center; }
    .brand { position: absolute; bottom: 30px; font-size: 16px; font-weight: 600; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-num">3 / 5</div>
    <div class="label">✅ The Truth</div>
    <div class="truth-box">
      <div class="truth-icon">💚</div>
      <div class="truth-text">Multiple therapies are evidence-based.</div>
      <div class="truth-detail">
        Research supports MANY approaches:
        <div class="therapy-list">
          <div class="therapy-item">🗣️ Speech-Language Therapy</div>
          <div class="therapy-item">🤲 Occupational Therapy (OT)</div>
          <div class="therapy-item">🧩 DIR/Floortime</div>
          <div class="therapy-item">🎭 Social Skills Groups</div>
          <div class="therapy-item">🧠 CBT (Cognitive Behavioral Therapy)</div>
          <div class="therapy-item">🎵 Music &amp; Art Therapy</div>
        </div>
      </div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
