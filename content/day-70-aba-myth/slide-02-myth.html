<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide { width: 1080px; height: 1350px; background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%); padding: 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Poppins', sans-serif; color: white; text-align: center; position: relative; }
    .slide-num { position: absolute; top: 30px; right: 30px; font-size: 16px; opacity: 0.4; }
    .label { font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; color: #E74C3C; margin-bottom: 30px; }
    .myth-box { background: rgba(231, 76, 60, 0.12); border: 3px solid #E74C3C; border-radius: 24px; padding: 50px 40px; max-width: 900px; width: 100%; }
    .myth-icon { font-size: 80px; margin-bottom: 20px; }
    .myth-text { font-family: 'Playfair Display', serif; font-size: 44px; font-weight: 800; line-height: 1.3; text-decoration: line-through; text-decoration-color: #E74C3C; text-decoration-thickness: 4px; }
    .brand { position: absolute; bottom: 30px; font-size: 16px; font-weight: 600; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-num">2 / 5</div>
    <div class="label">❌ The Myth</div>
    <div class="myth-box">
      <div class="myth-icon">🚫</div>
      <div class="myth-text">"ABA is the only evidence-based therapy for autism."</div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
