<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 40%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 70px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 500px; height: 500px; background: #FDB03E; top: -150px; right: -150px; }
    .bg-shape-2 { width: 400px; height: 400px; background: #CC78CB; bottom: -120px; left: -120px; }
    .badge {
      background: linear-gradient(135deg, #FDB03E 0%, #FDB03E 100%);
      color: #2a004a;
      padding: 12px 30px; border-radius: 30px;
      font-size: 18px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 3px;
      margin-bottom: 40px;
      position: relative; z-index: 1;
    }
    .main-title {
      font-family: 'Playfair Display', serif;
      font-size: 76px; font-weight: 800;
      line-height: 1.05;
      margin-bottom: 30px;
      position: relative; z-index: 1;
    }
    .main-title .em { color: #FDB03E; font-style: italic; }
    .subtitle {
      font-size: 30px;
      line-height: 1.4;
      max-width: 850px;
      opacity: 0.9;
      margin-bottom: 40px;
      position: relative; z-index: 1;
    }
    .doc-tag {
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(253, 176, 62, 0.5);
      border-radius: 16px;
      padding: 20px 35px;
      font-size: 22px;
      position: relative; z-index: 1;
      max-width: 850px;
    }
    .doc-tag .show { color: #FDB03E; font-weight: 700; font-size: 24px; display: block; margin-bottom: 6px; }
    .doc-tag .producer { opacity: 0.75; font-size: 18px; }
    .swipe {
      position: absolute;
      bottom: 100px;
      font-size: 20px;
      color: #18A8F1;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .footer { position: absolute; bottom: 40px; }
    .handle { font-size: 18px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>

  <div class="badge">Must Watch</div>

  <div class="main-title">
    One Scene<br>
    <span class="em">I Can't Unsee.</span>
  </div>

  <div class="subtitle">
    This BBC documentary about autism in Africa shows what happens when there are no services, no support, and no understanding.
  </div>

  <div class="doc-tag">
    <span class="show">Life on the Spectrum</span>
    <span class="producer">BBC Africa Eye Documentary</span>
  </div>

  <div class="swipe">Swipe to read →</div>
  <div class="footer"><div class="handle">@spectrum_unlocked</div></div>
</body>
</html>
