<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 70px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 500px; height: 500px; background: #4A90A4; top: -150px; left: -150px; }
    .bg-shape-2 { width: 400px; height: 400px; background: #E8B86D; bottom: -120px; right: -120px; }
    .number {
      position: absolute; top: 40px; right: 40px;
      width: 70px; height: 70px;
      background: #E8B86D; color: #1a1a2e;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 800;
    }
    .label {
      font-size: 16px; font-weight: 700;
      color: #4A90A4;
      text-transform: uppercase; letter-spacing: 3px;
      margin-bottom: 25px;
    }
    .title {
      font-family: 'Playfair Display', serif;
      font-size: 58px; font-weight: 800;
      color: #E8B86D;
      margin-bottom: 40px;
      line-height: 1.1;
    }
    .yt-card {
      background: #0d0d14;
      border: 3px solid rgba(232, 184, 109, 0.4);
      border-radius: 18px;
      padding: 0;
      max-width: 820px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .yt-thumb {
      background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
      aspect-ratio: 16 / 9;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .yt-play {
      width: 90px; height: 90px;
      background: rgba(255, 0, 0, 0.9);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 30px rgba(255,0,0,0.4);
    }
    .yt-play::before {
      content: '';
      border-left: 30px solid white;
      border-top: 18px solid transparent;
      border-bottom: 18px solid transparent;
      margin-left: 8px;
    }
    .yt-brand {
      position: absolute; top: 20px; left: 20px;
      color: #ff0000; font-weight: 900; font-size: 22px;
      letter-spacing: 1px;
    }
    .yt-info { padding: 22px 26px; text-align: left; }
    .yt-title {
      font-size: 22px; font-weight: 700;
      color: white;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .yt-channel { font-size: 16px; color: #aaa; }
    .link {
      margin-top: 28px;
      font-size: 20px;
      color: #4A90A4;
      font-weight: 600;
    }
    .link strong { color: #E8B86D; }
    .footer { position: absolute; bottom: 30px; }
    .handle { font-size: 16px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  <div class="number">1</div>

  <div class="label">The Documentary</div>
  <div class="title">Watch It Here</div>

  <div class="yt-card">
    <div class="yt-thumb">
      <div class="yt-brand">▶ YouTube</div>
      <div class="yt-play"></div>
    </div>
    <div class="yt-info">
      <div class="yt-title">Life on the Spectrum — BBC Africa Eye Documentary</div>
      <div class="yt-channel">BBC News Africa</div>
    </div>
  </div>

  <div class="link">Link in bio <strong>→</strong> youtu.be/oWE5ZKv08gA</div>

  <div class="footer"><div class="handle">@spectrum_unlocked</div></div>
</body>
</html>
