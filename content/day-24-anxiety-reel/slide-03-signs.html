<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }
    
    .title {
      font-size: 56px;
      font-weight: 800;
      color: #E8B86D;
      margin-bottom: 50px;
    }
    
    .subtitle {
      font-size: 32px;
      color: #4A90A4;
      margin-bottom: 40px;
    }
    
    .list {
      text-align: left;
      font-size: 36px;
      line-height: 2;
    }
    
    .list-item {
      display: flex;
      align-items: flex-start;
      gap: 20px;
    }
    
    .check {
      color: #27AE60;
      font-weight: 700;
    }
    
    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">Signs of Anxiety in Autism</div>
    <div class="subtitle">(Often looks different!)</div>
    <div class="list">
      <div class="list-item"><span class="check">•</span> Increased stimming</div>
      <div class="list-item"><span class="check">•</span> More rigid/controlling</div>
      <div class="list-item"><span class="check">•</span> Meltdowns over "small" things</div>
      <div class="list-item"><span class="check">•</span> Avoiding activities they used to like</div>
      <div class="list-item"><span class="check">•</span> Sleep problems</div>
      <div class="list-item"><span class="check">•</span> Physical complaints (tummy aches)</div>
      <div class="list-item"><span class="check">•</span> Constant questions/reassurance seeking</div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
