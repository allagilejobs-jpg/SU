<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide { width: 1080px; height: 1920px; background: linear-gradient(165deg, #2a004a 0%, #52008C 40%, #3a005f 100%); padding: 80px 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Poppins', sans-serif; color: white; text-align: center; position: relative; }
    .title { font-size: 56px; font-weight: 800; color: #FDB03E; margin-bottom: 60px; }
    .list { text-align: left; font-size: 38px; line-height: 2.2; }
    .list-item { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 15px; }
    .emoji { font-size: 40px; }
    .note { margin-top: 50px; font-size: 32px; opacity: 0.8; font-style: italic; }
    .brand { position: absolute; bottom: 40px; font-size: 24px; font-weight: 600; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">Why Anxiety Is So Common</div>
    <div class="list">
      <div class="list-item"><span class="emoji">🌍</span> World feels unpredictable</div>
      <div class="list-item"><span class="emoji">👥</span> Social situations are exhausting</div>
      <div class="list-item"><span class="emoji">🔊</span> Sensory overload is constant</div>
      <div class="list-item"><span class="emoji">🎭</span> Masking takes huge energy</div>
      <div class="list-item"><span class="emoji">❓</span> Change = threat response</div>
    </div>
    <div class="note">It's not weakness. It's how the brain is wired.</div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
