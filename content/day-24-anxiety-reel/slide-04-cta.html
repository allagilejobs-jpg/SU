<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
    }
    .emoji { font-size: 100px; margin-bottom: 40px; }
    .message { font-size: 48px; font-weight: 700; line-height: 1.3; margin-bottom: 50px; }
    .message span { color: #27AE60; }
    .cta-box { background: linear-gradient(135deg, #4A90A4 0%, #3a7a8e 100%); padding: 40px 60px; border-radius: 25px; font-size: 38px; font-weight: 700; margin-bottom: 50px; }
    .actions { display: flex; gap: 50px; font-size: 32px; font-weight: 600; }
    .action { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .action-icon { font-size: 50px; }
    .brand { position: absolute; bottom: 40px; font-size: 28px; font-weight: 700; color: #E8B86D; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="emoji">💙🫂</div>
    <div class="message">It's not overreacting.<br>Their nervous system <span>perceives more threats.</span></div>
    <div class="cta-box">What helps YOUR child with anxiety? 💬</div>
    <div class="actions">
      <div class="action"><span class="action-icon">💾</span><span>Save</span></div>
      <div class="action"><span class="action-icon">📤</span><span>Share</span></div>
      <div class="action"><span class="action-icon">➕</span><span>Follow</span></div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
