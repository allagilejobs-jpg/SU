<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide { width: 1080px; height: 1920px; background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%); padding: 80px 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Poppins', sans-serif; color: white; text-align: center; position: relative; }
    .label { font-size: 28px; font-weight: 600; color: #4A90A4; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 30px; }
    .title { font-size: 52px; font-weight: 800; color: #E8B86D; margin-bottom: 50px; }
    .technique { background: rgba(232, 184, 109, 0.15); border: 3px solid #E8B86D; border-radius: 25px; padding: 40px 50px; margin-bottom: 40px; max-width: 900px; }
    .technique-desc { font-size: 34px; line-height: 1.5; }
    .steps { text-align: left; font-size: 32px; line-height: 2; }
    .brand { position: absolute; bottom: 40px; font-size: 24px; font-weight: 600; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">Try This</div>
    <div class="title">5-4-3-2-1 Grounding</div>
    <div class="technique"><div class="technique-desc">Adapted for sensory-sensitive kids:</div></div>
    <div class="steps">
      <div>👀 5 things you can see</div>
      <div>✋ 4 things you can touch</div>
      <div>👂 3 things you can hear</div>
      <div>👃 2 things you can smell</div>
      <div>👅 1 thing you can taste</div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
