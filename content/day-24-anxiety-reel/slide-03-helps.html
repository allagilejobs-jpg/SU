<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: white;
    }
    .title { font-size: 48px; font-weight: 800; color: #27AE60; margin-bottom: 40px; }
    .helps { display: flex; flex-direction: column; gap: 20px; }
    .help { background: rgba(39,174,96,0.1); padding: 25px 35px; border-radius: 15px; font-size: 34px; display: flex; align-items: center; gap: 20px; border-left: 4px solid #27AE60; }
    .icon { font-size: 40px; }
    .brand { position: absolute; bottom: 40px; left: 60px; font-size: 24px; font-weight: 600; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">What Actually Helps</div>
    <div class="helps">
      <div class="help"><span class="icon">📅</span> Predictability - visual schedules</div>
      <div class="help"><span class="icon">🏠</span> Sensory safe spaces</div>
      <div class="help"><span class="icon">🌀</span> Allow stimming - it regulates!</div>
      <div class="help"><span class="icon">🎯</span> Special interests - reduce cortisol</div>
      <div class="help"><span class="icon">📝</span> Scripts and preparation</div>
      <div class="help"><span class="icon">⚡</span> Reduce demands when stressed</div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
