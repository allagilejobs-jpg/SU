<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: white;
    }
    .title { font-size: 48px; font-weight: 800; color: #E8B86D; margin-bottom: 40px; }
    .triggers { display: flex; flex-direction: column; gap: 20px; }
    .trigger { background: rgba(231,76,60,0.1); padding: 25px 35px; border-radius: 15px; font-size: 34px; display: flex; align-items: center; gap: 20px; border-left: 4px solid #E74C3C; }
    .icon { font-size: 40px; }
    .brand { position: absolute; bottom: 40px; left: 60px; font-size: 24px; font-weight: 600; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">Common Anxiety Triggers</div>
    <div class="triggers">
      <div class="trigger"><span class="icon">🔊</span> Sensory overload</div>
      <div class="trigger"><span class="icon">🔄</span> Unexpected changes</div>
      <div class="trigger"><span class="icon">👥</span> Social uncertainty</div>
      <div class="trigger"><span class="icon">🎭</span> Masking exhaustion</div>
      <div class="trigger"><span class="icon">❓</span> Ambiguity and uncertainty</div>
      <div class="trigger"><span class="icon">⏰</span> Transitions between activities</div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
