<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 80px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 500px; height: 500px; background: #E8B86D; top: -150px; left: -150px; }
    .bg-shape-2 { width: 400px; height: 400px; background: #E74C3C; bottom: -100px; right: -100px; }
    .stat-number {
      font-family: 'Playfair Display', serif;
      font-size: 160px;
      font-weight: 900;
      color: #E8B86D;
      line-height: 1;
      margin-bottom: 20px;
    }
    .stat-suffix {
      font-family: 'Playfair Display', serif;
      font-size: 80px;
      font-weight: 800;
      color: #E74C3C;
      margin-bottom: 50px;
    }
    .stat-description {
      font-size: 36px;
      line-height: 1.4;
      max-width: 850px;
      margin-bottom: 50px;
      opacity: 0.95;
    }
    .stat-description strong { color: #E8B86D; }
    .source {
      font-size: 18px;
      opacity: 0.4;
      font-style: italic;
    }
    .divider {
      width: 120px; height: 4px;
      background: linear-gradient(90deg, #E8B86D, #E74C3C);
      border-radius: 2px;
      margin-bottom: 50px;
    }
    .validation {
      background: rgba(232, 184, 109, 0.1);
      border: 2px solid rgba(232, 184, 109, 0.2);
      border-radius: 20px;
      padding: 30px 40px;
      font-size: 26px;
      line-height: 1.4;
      max-width: 850px;
    }
    .validation strong { color: #E8B86D; }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .handle { font-size: 20px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>

  <div class="stat-number">3x</div>
  <div class="stat-suffix">higher</div>

  <div class="divider"></div>

  <div class="stat-description">
    Parents of autistic children report <strong>3x higher stress levels</strong> than other parents.
  </div>

  <div class="validation">
    <strong>If you're exhausted, you're not failing. You're carrying more than most people will ever understand.</strong>
  </div>

  <div class="source">Source: Journal of Autism and Developmental Disorders</div>

  <div class="footer">
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
