<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 40%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 80px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 500px; height: 500px; background: #FDB03E; top: -150px; right: -150px; }
    .bg-shape-2 { width: 350px; height: 350px; background: #18A8F1; bottom: -100px; left: -100px; }
    .number {
      position: absolute; top: 50px; right: 50px;
      width: 80px; height: 80px;
      background: #FDB03E; color: #2a004a;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; font-weight: 800;
    }
    .emoji { font-size: 110px; margin-bottom: 30px; }
    .title {
      font-family: 'Playfair Display', serif;
      font-size: 56px; font-weight: 800;
      color: #FDB03E;
      margin-bottom: 30px;
      line-height: 1.1;
    }
    .reasons {
      text-align: left;
      max-width: 850px;
      margin-bottom: 30px;
    }
    .reason {
      display: flex; align-items: flex-start; gap: 20px;
      font-size: 28px;
      line-height: 1.4;
      margin-bottom: 22px;
    }
    .reason-icon {
      font-size: 32px;
      flex-shrink: 0;
    }
    .footer { position: absolute; bottom: 35px; }
    .handle { font-size: 18px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  <div class="number">1</div>

  <div class="emoji">🧠</div>
  <div class="title">Why The Stress<br>Is So High</div>

  <div class="reasons">
    <div class="reason"><span class="reason-icon">⏰</span><span>Constant advocacy in IEP meetings, doctor visits, therapy</span></div>
    <div class="reason"><span class="reason-icon">💸</span><span>Financial strain from out-of-pocket therapies and services</span></div>
    <div class="reason"><span class="reason-icon">😴</span><span>Sleep deprivation that often lasts for years</span></div>
    <div class="reason"><span class="reason-icon">🚪</span><span>Social isolation from a world that doesn't understand</span></div>
  </div>

  <div class="footer">
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
