<!DOCTYPE html>
<html lang="en">
<head>

<title>Day 90 - IEP vs 504 Myth | The Truth</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; }
  .slide {
    width: 1080px; height: 1350px;
    background: linear-gradient(165deg, #2a004a 0%, #52008C 40%, #3a005f 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden; font-family: 'Poppins', sans-serif;
    padding: 80px 70px;
  }
  .slide-num {
    position: absolute; top: 40px; right: 50px;
    color: rgba(255,255,255,0.2); font-size: 18px; font-weight: 700;
  }
  .label-tag {
    background: rgba(24, 168, 241, 0.2); border: 1px solid #18A8F1;
    padding: 8px 24px; border-radius: 50px; color: #18A8F1;
    font-size: 18px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 40px;
  }
  .emoji { font-size: 100px; margin-bottom: 30px; }
  .truth-box {
    background: rgba(24, 168, 241, 0.15); border: 2px solid #18A8F1;
    border-radius: 24px; padding: 50px 50px; max-width: 880px; width: 100%;
    text-align: center;
  }
  .truth-label {
    font-size: 22px; font-weight: 700; color: #18A8F1;
    text-transform: uppercase; letter-spacing: 3px; margin-bottom: 20px;
  }
  .truth-text {
    font-family: 'Playfair Display', serif; font-size: 40px; font-weight: 700;
    color: rgba(255,255,255,0.9); line-height: 1.4;
  }
  .truth-text span { color: #18A8F1; }
  .brand {
    position: absolute; bottom: 40px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,0.3); font-size: 16px; font-weight: 600; letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="slide-num">2 / 4</div>
  <div class="label-tag">Truth</div>
  <div class="emoji">✅</div>
  <div class="truth-box">
    <div class="truth-label">The Truth</div>
    <div class="truth-text"><span>IEP</span> = specialized instruction + legal protections under IDEA.<br><br><span>504</span> = accommodations only under Section 504.<br><br>Different eligibility. Different protections.</div>
  </div>
  <div class="brand">@spectrum_unlocked</div>
</div>
