<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 90 - IEP vs 504 Myth | The Myth</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; }
  .slide {
    width: 1080px; height: 1350px;
    background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden; font-family: 'Poppins', sans-serif;
    padding: 80px 70px;
  }
  .slide-num {
    position: absolute; top: 40px; right: 50px;
    color: rgba(255,255,255,0.2); font-size: 18px; font-weight: 700;
  }
  .label-tag {
    background: rgba(231, 76, 60, 0.2); border: 1px solid #E74C3C;
    padding: 8px 24px; border-radius: 50px; color: #E74C3C;
    font-size: 18px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 40px;
  }
  .emoji { font-size: 100px; margin-bottom: 30px; }
  .myth-box {
    background: rgba(231, 76, 60, 0.15); border: 2px solid #E74C3C;
    border-radius: 24px; padding: 50px 50px; max-width: 880px; width: 100%;
    text-align: center;
  }
  .myth-label {
    font-size: 22px; font-weight: 700; color: #E74C3C;
    text-transform: uppercase; letter-spacing: 3px; margin-bottom: 20px;
  }
  .myth-text {
    font-family: 'Playfair Display', serif; font-size: 44px; font-weight: 700;
    color: rgba(255,255,255,0.85); line-height: 1.3;
    text-decoration: line-through; text-decoration-color: #E74C3C;
    text-decoration-thickness: 3px;
  }
  .brand {
    position: absolute; bottom: 40px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,0.3); font-size: 16px; font-weight: 600; letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="slide-num">1 / 4</div>
  <div class="label-tag">Myth</div>
  <div class="emoji">🚫</div>
  <div class="myth-box">
    <div class="myth-label">The Myth</div>
    <div class="myth-text">"An IEP and a 504 are basically the same thing."</div>
  </div>
  <div class="brand">@spectrum_unlocked</div>
</div>
</body>
</html>
