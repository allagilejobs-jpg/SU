<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }
    
    .title {
      font-size: 52px;
      font-weight: 800;
      color: #E8B86D;
      margin-bottom: 50px;
    }
    
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      max-width: 950px;
    }
    
    .box {
      background: rgba(74, 144, 164, 0.2);
      border: 2px solid #4A90A4;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
    }
    
    .box-emoji {
      font-size: 50px;
      margin-bottom: 15px;
    }
    
    .box-text {
      font-size: 28px;
      font-weight: 600;
      line-height: 1.3;
    }
    
    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">Areas to Build</div>
    <div class="grid">
      <div class="box">
        <div class="box-emoji">🚿</div>
        <div class="box-text">Self-care routines</div>
      </div>
      <div class="box">
        <div class="box-emoji">🏠</div>
        <div class="box-text">Household tasks</div>
      </div>
      <div class="box">
        <div class="box-emoji">💰</div>
        <div class="box-text">Money basics</div>
      </div>
      <div class="box">
        <div class="box-emoji">🚌</div>
        <div class="box-text">Transportation</div>
      </div>
      <div class="box">
        <div class="box-emoji">🗣️</div>
        <div class="box-text">Self-advocacy</div>
      </div>
      <div class="box">
        <div class="box-emoji">📱</div>
        <div class="box-text">Tech/safety skills</div>
      </div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
