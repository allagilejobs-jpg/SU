<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }
    
    .title {
      font-size: 52px;
      font-weight: 800;
      color: #E8B86D;
      margin-bottom: 50px;
    }
    
    .subtitle {
      font-size: 32px;
      color: #4A90A4;
      margin-bottom: 40px;
    }
    
    .idea-list {
      text-align: left;
      font-size: 34px;
      line-height: 2.2;
    }
    
    .idea {
      display: flex;
      align-items: flex-start;
      gap: 20px;
    }
    
    .emoji {
      font-size: 34px;
    }
    
    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">Start Small Today</div>
    <div class="subtitle">Pick ONE to work on this week:</div>
    <div class="idea-list">
      <div class="idea"><span class="emoji">🪥</span> Brushing teeth independently</div>
      <div class="idea"><span class="emoji">👕</span> Choosing their own clothes</div>
      <div class="idea"><span class="emoji">🍽️</span> Putting dishes in the sink</div>
      <div class="idea"><span class="emoji">🎒</span> Packing their own bag</div>
      <div class="idea"><span class="emoji">📞</span> Ordering food (with support)</div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
