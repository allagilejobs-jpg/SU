<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }
    
    .title {
      font-size: 52px;
      font-weight: 800;
      color: #E8B86D;
      margin-bottom: 50px;
    }
    
    .content {
      font-size: 42px;
      line-height: 1.6;
      max-width: 900px;
      margin-bottom: 50px;
    }
    
    .highlight-box {
      background: rgba(39, 174, 96, 0.2);
      border: 3px solid #27AE60;
      border-radius: 25px;
      padding: 40px 50px;
      font-size: 36px;
      line-height: 1.5;
      max-width: 900px;
    }
    
    .highlight-box span {
      color: #27AE60;
      font-weight: 700;
    }
    
    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">The Mindset Shift</div>
    <div class="content">
      Independence isn't about doing everything alone. It's about having the skills to navigate life with support when needed.
    </div>
    <div class="highlight-box">
      <span>Progress over perfection</span>. Every small step counts.
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
