<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }

    .number {
      position: absolute;
      top: 60px;
      right: 60px;
      width: 100px;
      height: 100px;
      background: #E8B86D;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 800;
      color: #1a1a2e;
    }

    .emoji {
      font-size: 150px;
      margin-bottom: 50px;
    }

    .title {
      font-size: 64px;
      font-weight: 800;
      color: #E8B86D;
      margin-bottom: 30px;
      line-height: 1.2;
    }

    .description {
      font-size: 38px;
      line-height: 1.5;
      max-width: 900px;
      opacity: 0.95;
    }

    .tip-box {
      margin-top: 50px;
      background: rgba(74, 144, 164, 0.2);
      border: 3px solid #4A90A4;
      border-radius: 20px;
      padding: 30px 50px;
      font-size: 32px;
      font-weight: 600;
    }

    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="number">3</div>
    <div class="emoji">&#x1F6E0;&#xFE0F;</div>
    <div class="title">How to<br>Build Skills</div>
    <div class="description">
      Break tasks into tiny steps. Use visual checklists. Model, then guide, then step back. Celebrate every attempt, not just success. Be patient with regression.
    </div>
    <div class="tip-box">
      &#x1F4A1; Consistency matters more than speed
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
