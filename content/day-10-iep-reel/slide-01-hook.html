<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 40%, #3a005f 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }
    .emoji { font-size: 100px; margin-bottom: 40px; }
    .main {
      font-size: 64px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 40px;
    }
    .main span { color: #FDB03E; }
    .sub {
      font-size: 38px;
      opacity: 0.9;
      max-width: 850px;
      line-height: 1.4;
    }
    .badge {
      margin-top: 50px;
      background: rgba(24, 168, 241, 0.2);
      border: 2px solid #18A8F1;
      padding: 20px 40px;
      border-radius: 50px;
      font-size: 28px;
      font-weight: 600;
      color: #18A8F1;
    }
    .swipe {
      position: absolute;
      bottom: 120px;
      font-size: 28px;
      font-weight: 600;
      color: #18A8F1;
    }
    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="emoji">📋✨</div>
    <div class="main">
      <span>IEP Accommodations</span><br>
      That Actually Help
    </div>
    <div class="sub">
      Your child's IEP shouldn't teach them to mask
    </div>
    <div class="badge">Neurodiversity-Affirming</div>
    <div class="swipe">Swipe for the list →</div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
