<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }
    .emoji { font-size: 100px; margin-bottom: 40px; }
    .message {
      font-size: 52px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 50px;
    }
    .message span { color: #E8B86D; }
    .cta-box {
      background: linear-gradient(135deg, #E8B86D 0%, #d4a85d 100%);
      color: #1a1a2e;
      padding: 40px 70px;
      border-radius: 25px;
      margin-bottom: 50px;
    }
    .cta-box .main {
      font-size: 40px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .cta-box .sub {
      font-size: 28px;
    }
    .tip {
      background: rgba(74,144,164,0.2);
      border: 2px solid #4A90A4;
      padding: 30px 50px;
      border-radius: 20px;
      font-size: 32px;
      margin-bottom: 50px;
    }
    .actions {
      display: flex;
      gap: 50px;
      font-size: 32px;
      font-weight: 600;
    }
    .action {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .action-icon { font-size: 50px; }
    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 28px;
      font-weight: 700;
      color: #E8B86D;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="emoji">💪📋</div>
    <div class="message">
      <span>Save this</span> for your<br>next IEP meeting!
    </div>
    <div class="cta-box">
      <div class="main">DM "IEP" for more tips</div>
      <div class="sub">We'll send you a free checklist</div>
    </div>
    <div class="tip">
      💡 You can ask for MORE than what's standard!
    </div>
    <div class="actions">
      <div class="action">
        <span class="action-icon">💾</span>
        <span>Save</span>
      </div>
      <div class="action">
        <span class="action-icon">📤</span>
        <span>Share</span>
      </div>
      <div class="action">
        <span class="action-icon">➕</span>
        <span>Follow</span>
      </div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
