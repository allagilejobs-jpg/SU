<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1000px; 
      height: 1500px; 
      font-family: 'Poppins', sans-serif; 
      color: white;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      text-align: center; 
      padding: 80px 60px;
      position: relative; 
      overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 600px; height: 600px; background: #E67E22; top: -200px; right: -200px; }
    .bg-shape-2 { width: 450px; height: 450px; background: #4A90A4; bottom: 150px; left: -150px; }
    .bg-shape-3 { width: 300px; height: 300px; background: #E8B86D; bottom: -100px; right: 50px; }
    
    .badge { 
      background: #E67E22; 
      padding: 14px 35px; 
      border-radius: 30px; 
      font-size: 18px; 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 3px;
      margin-bottom: 50px;
    }
    
    .emoji-row { 
      font-size: 80px; 
      margin-bottom: 50px; 
      letter-spacing: 25px; 
    }
    
    .main-title { 
      font-family: 'Playfair Display', serif; 
      font-size: 90px; 
      font-weight: 800; 
      line-height: 1.1; 
      margin-bottom: 50px;
      max-width: 850px;
      color: #4A90A4;
    }
    
    .subtitle {
      font-size: 32px;
      opacity: 0.9;
      margin-bottom: 50px;
      max-width: 800px;
      line-height: 1.6;
    }
    
    .features {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 50px;
    }
    
    .feature {
      background: rgba(255,255,255,0.08);
      padding: 20px 40px;
      border-radius: 15px;
      font-size: 24px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    .feature-icon {
      font-size: 28px;
    }
    
    .tagline {
      font-size: 28px;
      font-weight: 600;
      color: #E8B86D;
      margin-top: 30px;
    }
    
    .footer { 
      position: absolute; 
      bottom: 50px; 
      text-align: center; 
    }
    .handle { 
      font-size: 22px; 
      opacity: 0.5; 
    }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  <div class="bg-shape bg-shape-3"></div>
  
  <div class="badge">📌 Start Here</div>
  
  <div class="emoji-row">💙 🏮 ✨</div>
  
  <div class="main-title">Start Here</div>
  
  <div class="subtitle">
    Real resources for autism parents.
  </div>
  
  <div class="features">
    <div class="feature">
      <span class="feature-icon">📋</span>
      <span>Free IEP checklists</span>
    </div>
    <div class="feature">
      <span class="feature-icon">🧠</span>
      <span>Sensory strategies that work</span>
    </div>
    <div class="feature">
      <span class="feature-icon">💙</span>
      <span>A community that gets it</span>
    </div>
  </div>
  
  <div class="tagline">Save this pin. You'll need it at 2am.</div>
  
  <div class="footer">
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
