<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1350px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 500px; height: 500px; background: #E67E22; top: -150px; right: -150px; }
    .bg-shape-2 { width: 350px; height: 350px; background: #4A90A4; bottom: 100px; left: -100px; }
    .badge { 
      background: #E67E22; 
      padding: 12px 30px; 
      border-radius: 30px; 
      font-size: 18px; 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 3px;
      margin-bottom: 40px;
    }
    .emoji-row { font-size: 70px; margin-bottom: 30px; letter-spacing: 20px; }
    .main-title { 
      font-family: 'Playfair Display', serif; 
      font-size: 72px; 
      font-weight: 800; 
      line-height: 1.1; 
      margin-bottom: 30px;
      max-width: 950px;
    }
    .highlight { color: #4A90A4; }
    .highlight-gold { color: #E8B86D; }
    .subtitle {
      font-size: 28px;
      opacity: 0.9;
      margin-bottom: 40px;
      max-width: 850px;
      line-height: 1.5;
    }
    .tagline {
      font-size: 24px;
      font-weight: 600;
      color: #E8B86D;
      margin-top: 20px;
    }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .handle { font-size: 20px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  
  <div class="badge">📌 Start Here</div>
  
  <div class="emoji-row">💙 🏮 ✨</div>
  
  <div class="main-title">
    <span class="highlight">Start Here</span>
  </div>
  
  <div class="subtitle">
    Real resources for autism parents.<br>
    No judgment. No "have you tried essential oils?"<br>
    Just one parent helping another.
  </div>
  
  <div class="tagline">Save this post. You'll need it at 2am.</div>
  
  <div class="footer">
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
