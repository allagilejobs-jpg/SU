<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide { width: 1080px; height: 1350px; background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%); padding: 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Poppins', sans-serif; color: white; text-align: center; position: relative; overflow: hidden; }
    .slide::before { content: ''; position: absolute; top: -100px; right: -100px; width: 300px; height: 300px; background: #E8B86D; border-radius: 50%; opacity: 0.08; }
    .slide::after { content: ''; position: absolute; bottom: -80px; left: -80px; width: 200px; height: 200px; background: #4A90A4; border-radius: 50%; opacity: 0.06; }
    .badge { background: #E8B86D; color: #1a1a2e; padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; position: relative; z-index: 1; }
    .emoji-row { font-size: 60px; margin-bottom: 25px; position: relative; z-index: 1; }
    .main-title { font-family: 'Playfair Display', serif; font-size: 62px; font-weight: 800; line-height: 1.1; margin-bottom: 20px; position: relative; z-index: 1; }
    .main-title span { color: #E8B86D; }
    .subtitle { font-size: 24px; opacity: 0.9; max-width: 800px; line-height: 1.4; margin-bottom: 30px; position: relative; z-index: 1; }
    .swipe { font-size: 18px; color: #4A90A4; font-weight: 600; position: relative; z-index: 1; }
    .brand { position: absolute; bottom: 30px; font-size: 16px; font-weight: 600; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="badge">Day 69 · Real Talk</div>
    <div class="emoji-row">💛🫂😔</div>
    <div class="main-title"><span>Parent</span><br>Self-Care</div>
    <div class="subtitle">This one's for you, not your child</div>
    <div class="swipe">Swipe to read →</div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
