<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1350px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.06; }
    .bg-shape-1 { width: 400px; height: 400px; background: #E8B86D; top: -100px; right: -100px; }
    .label { 
      font-size: 16px; 
      text-transform: uppercase; 
      letter-spacing: 4px; 
      opacity: 0.5;
      margin-bottom: 20px;
      margin-top: 20px;
    }
    .title { 
      font-family: 'Playfair Display', serif;
      font-size: 44px; 
      font-weight: 800; 
      color: #E8B86D;
      margin-bottom: 40px;
    }
    .initiatives-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      max-width: 950px;
    }
    .initiative-card {
      background: rgba(232, 184, 109, 0.12);
      border: 2px solid rgba(232, 184, 109, 0.25);
      border-radius: 20px;
      padding: 30px;
      text-align: left;
    }
    .initiative-emoji { font-size: 40px; margin-bottom: 15px; }
    .initiative-title { font-size: 22px; font-weight: 700; color: #E8B86D; margin-bottom: 10px; }
    .initiative-text { font-size: 17px; opacity: 0.85; line-height: 1.4; }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .slide-num { font-size: 16px; opacity: 0.4; letter-spacing: 2px; margin-bottom: 8px; }
    .handle { font-size: 18px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  
  <div class="label">Get Involved</div>
  
  <div class="title">Community Initiatives</div>
  
  <div class="initiatives-grid">
    <div class="initiative-card">
      <div class="initiative-emoji">💬</div>
      <div class="initiative-title">Q&A Sessions</div>
      <div class="initiative-text">Drop your questions! We'll answer in weekly posts.</div>
    </div>
    
    <div class="initiative-card">
      <div class="initiative-emoji">📸</div>
      <div class="initiative-title">Community Features</div>
      <div class="initiative-text">Share your wins! DM to be featured.</div>
    </div>
    
    <div class="initiative-card">
      <div class="initiative-emoji">📊</div>
      <div class="initiative-title">Topic Polls</div>
      <div class="initiative-text">Vote on what content you want to see next.</div>
    </div>
    
    <div class="initiative-card">
      <div class="initiative-emoji">🤝</div>
      <div class="initiative-title">Resource Sharing</div>
      <div class="initiative-text">Recommend what worked for your family.</div>
    </div>
  </div>
  
  <div class="footer">
    <div class="slide-num">3 of 6</div>
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
