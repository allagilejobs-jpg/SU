<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Day 13 - CTA</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
.slide { width: 1080px; height: 1920px; background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%); padding: 80px 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Poppins', sans-serif; color: white; text-align: center; position: relative; }
.recap { font-size: 32px; font-weight: 600; color: #4A90A4; margin-bottom: 40px; letter-spacing: 3px; text-transform: uppercase; }
.list { text-align: left; font-size: 36px; line-height: 1.8; margin-bottom: 60px; }
.list-item { display: flex; align-items: center; gap: 20px; }
.check { color: #27AE60; font-weight: 700; }
.cta-box { background: linear-gradient(135deg, #E8B86D 0%, #d4a85d 100%); color: #1a1a2e; padding: 50px 80px; border-radius: 30px; margin-bottom: 50px; }
.cta-box .main { font-size: 48px; font-weight: 800; margin-bottom: 15px; }
.cta-box .sub { font-size: 32px; font-weight: 600; opacity: 0.9; }
.actions { display: flex; gap: 60px; font-size: 36px; font-weight: 600; }
.action { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.action-icon { font-size: 60px; }
.brand { position: absolute; bottom: 40px; font-size: 28px; font-weight: 700; color: #E8B86D; }
</style>
</head>
<body>
<div class="slide">
<div class="recap">Quick Recap</div>
<div class="list">
<div class="list-item"><span class="check">✓</span> What ABA is</div>
<div class="list-item"><span class="check">✓</span> The concerns</div>
<div class="list-item"><span class="check">✓</span> The other side</div>
<div class="list-item"><span class="check">✓</span> Questions to ask</div>
<div class="list-item"><span class="check">✓</span> Trust your gut</div>
</div>
<div class="cta-box">
<div class="main">What's your experience with ABA?</div>
<div class="sub">Share respectfully below 👇</div>
</div>
<div class="actions">
<div class="action"><div class="action-icon">❤️</div>Like</div>
<div class="action"><div class="action-icon">💬</div>Comment</div>
<div class="action"><div class="action-icon">🔖</div>Save</div>
</div>
<div class="brand">@spectrum_unlocked</div>
</div>
</body>
</html>
