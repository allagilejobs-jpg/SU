<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 92 - IEP Legal Win | Quote</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; }
  .slide {
    width: 1080px; height: 1350px;
    background: linear-gradient(165deg, #2a004a 0%, #52008C 40%, #3a005f 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden; font-family: 'Poppins', sans-serif;
    padding: 80px 80px;
  }
  .slide::before {
    content: ''; position: absolute; top: -80px; right: -80px;
    width: 300px; height: 300px; border-radius: 50%;
    background: #FDB03E; opacity: 0.08;
  }
  .slide::after {
    content: ''; position: absolute; bottom: -60px; left: -60px;
    width: 200px; height: 200px; border-radius: 50%;
    background: #18A8F1; opacity: 0.06;
  }
  .quote-mark {
    font-size: 120px; color: #FDB03E; opacity: 0.3;
    font-family: 'Playfair Display', serif; line-height: 1;
    margin-bottom: -20px; position: relative; z-index: 1;
  }
  .quote-text {
    font-family: 'Playfair Display', serif; font-size: 52px; font-weight: 700;
    font-style: italic; color: #FFFFFF; text-align: center;
    line-height: 1.4; max-width: 850px; position: relative; z-index: 1;
    margin-bottom: 40px;
  }
  .quote-text span { color: #FDB03E; }
  .attribution {
    font-size: 20px; color: rgba(255,255,255,0.5); font-weight: 600;
    letter-spacing: 1px; position: relative; z-index: 1;
  }
  .brand {
    position: absolute; bottom: 40px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,0.3); font-size: 16px; font-weight: 600; letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="quote-mark">"</div>
  <div class="quote-text">The IEP is not a <span>suggestion.</span><br>It's a <span>legal document.</span></div>
  <div class="attribution">-- @spectrum_unlocked</div>
  <div class="brand">@spectrum_unlocked</div>
</div>
</body>
</html>
