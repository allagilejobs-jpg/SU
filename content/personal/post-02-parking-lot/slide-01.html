<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 40%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 90px 80px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.07; }
    .bg-shape-1 { width: 550px; height: 550px; background: #FDB03E; top: -180px; right: -180px; }
    .bg-shape-2 { width: 400px; height: 400px; background: #18A8F1; bottom: -130px; left: -130px; }
    .quote-mark {
      font-family: 'Playfair Display', serif;
      font-size: 200px;
      color: #FDB03E;
      opacity: 0.4;
      line-height: 0.8;
      margin-bottom: 10px;
      position: relative; z-index: 1;
    }
    .quote-text {
      font-family: 'Playfair Display', serif;
      font-size: 56px;
      font-weight: 700;
      font-style: italic;
      line-height: 1.35;
      max-width: 920px;
      position: relative; z-index: 1;
      white-space: pre-line;
    }
    .divider {
      width: 100px; height: 3px;
      background: #FDB03E;
      margin: 50px auto 30px;
      opacity: 0.6;
      position: relative; z-index: 1;
    }
    .attribution {
      font-size: 22px;
      color: #18A8F1;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      position: relative; z-index: 1;
    }
    .footer { position: absolute; bottom: 40px; }
    .handle { font-size: 22px; opacity: 0.55; font-weight: 600; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>

  <div class="quote-mark">"</div>
  <div class="quote-text">I sat in the parking lot
for 20 minutes after
the evaluation.

I didn't cry.
I didn't call anyone.
I just sat there.</div>

  <div class="divider"></div>
  <div class="attribution">— FJ's Dad</div>

  <div class="footer"><div class="handle">@spectrum_unlocked</div></div>
</body>
</html>
