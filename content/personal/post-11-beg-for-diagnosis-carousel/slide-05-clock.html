<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #0a0a15 0%, #16213e 40%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 80px;
      position: relative; overflow: hidden;
    }
    body::before { content: ''; position: absolute; top: -150px; right: -150px; width: 400px; height: 400px; background: #E8B86D; border-radius: 50%; opacity: 0.08; }
    body::after { content: ''; position: absolute; bottom: -100px; left: -100px; width: 350px; height: 350px; background: #4A90A4; border-radius: 50%; opacity: 0.08; }
    .label { font-size: 24px; font-weight: 600; color: #E8B86D; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 40px; }
    .main-text { font-family: 'Playfair Display', serif; font-size: 60px; font-weight: 800; line-height: 1.3; max-width: 900px; }
    .highlight { color: #E8B86D; }
    .sub-text { font-size: 34px; font-weight: 500; margin-top: 50px; opacity: 0.8; max-width: 850px; line-height: 1.5; }
    .footer { position: absolute; bottom: 50px; font-size: 20px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="label">The Problem</div>
  <div class="main-text">Early intervention has a <span class="highlight">deadline</span>.</div>
  <div class="sub-text">To access services, I needed a diagnosis before he turned 3. Time was running out.</div>
  <div class="footer">@spectrum_unlocked</div>
</body>
</html>
