<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #0a0a15 0%, #52008C 40%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 80px;
      position: relative; overflow: hidden;
    }
    body::before { content: ''; position: absolute; top: -150px; right: -150px; width: 400px; height: 400px; background: #FDB03E; border-radius: 50%; opacity: 0.08; }
    body::after { content: ''; position: absolute; bottom: -100px; left: -100px; width: 350px; height: 350px; background: #18A8F1; border-radius: 50%; opacity: 0.08; }
    .main-text { font-family: 'Playfair Display', serif; font-size: 64px; font-weight: 800; line-height: 1.3; max-width: 900px; }
    .highlight { color: #FDB03E; }
    .sub-text { font-family: 'Playfair Display', serif; font-size: 48px; font-weight: 700; font-style: italic; margin-top: 50px; opacity: 0.85; max-width: 850px; line-height: 1.4; }
    .footer { position: absolute; bottom: 50px; font-size: 20px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="main-text">By the time he was <span class="highlight">two</span>, I already knew.</div>
  <div class="sub-text">I had three other kids. I knew what milestones looked like.</div>
  <div class="footer">@spectrum_unlocked</div>
</body>
</html>
