<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: transparent;
      font-family: 'Poppins', sans-serif;
      position: relative;
    }
    .top-brand {
      position: absolute;
      top: 60px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      color: #18A8F1;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .bottom-handle {
      position: absolute;
      bottom: 50px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>
  <div class="top-brand">SPECTRUM UNLOCKED</div>
  <div class="bottom-handle">@spectrum_unlocked</div>
</body>
</html>
