<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720px;
      height: 900px;
      background: #00ff00;
      font-family: 'Poppins', sans-serif;
      position: relative;
    }
    .brand {
      position: absolute;
      top: 30px;
      left: 30px;
    }
    .brand-main {
      font-size: 22px;
      font-weight: 900;
      color: white;
      letter-spacing: 1px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    }
    .brand-sub {
      font-size: 18px;
      font-weight: 700;
      color: #4A90A4;
      letter-spacing: 1px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    }
    .headline-box {
      position: absolute;
      top: 260px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 18px 30px;
      border-radius: 6px;
      max-width: 650px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .headline {
      font-size: 24px;
      font-weight: 800;
      color: #1a1a2e;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="brand">
    <div class="brand-main">SPECTRUM</div>
    <div class="brand-sub">UNLOCKED</div>
  </div>
  <div class="headline-box">
    <div class="headline">
      Parent Opens Up About Having to<br>
      BEG for an Autism Diagnosis
    </div>
  </div>
</body>
</html>
