<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }
    
    .label {
      font-size: 28px;
      font-weight: 600;
      color: #E8B86D;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }
    
    .myth-box {
      background: rgba(231, 76, 60, 0.2);
      border: 3px solid #e74c3c;
      border-radius: 25px;
      padding: 40px 50px;
      margin-bottom: 40px;
      max-width: 900px;
    }
    
    .myth-text {
      font-size: 38px;
      text-decoration: line-through;
      opacity: 0.8;
    }
    
    .truth-box {
      background: rgba(39, 174, 96, 0.2);
      border: 3px solid #27AE60;
      border-radius: 25px;
      padding: 40px 50px;
      max-width: 900px;
    }
    
    .truth-text {
      font-size: 42px;
      font-weight: 700;
      line-height: 1.4;
    }
    
    .truth-text span {
      color: #27AE60;
    }
    
    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">Common Misconception</div>
    <div class="myth-box">
      <div class="myth-text">❌ "Speech therapy is only for kids who can't talk"</div>
    </div>
    <div class="truth-box">
      <div class="truth-text">✓ SLPs help with <span>ALL communication</span>: verbal, nonverbal, AAC, social skills, and more!</div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
