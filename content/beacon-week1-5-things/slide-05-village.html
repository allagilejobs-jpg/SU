<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1350px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 400px; height: 400px; background: #E8B86D; bottom: -100px; left: -100px; }
    .number-badge {
      width: 100px; height: 100px;
      background: #E8B86D;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 48px; font-weight: 800;
      margin-bottom: 40px;
    }
    .main-title { 
      font-family: 'Playfair Display', serif; 
      font-size: 52px; 
      font-weight: 800; 
      line-height: 1.2; 
      margin-bottom: 40px;
      max-width: 900px;
    }
    .highlight { color: #4A90A4; }
    .highlight-gold { color: #E8B86D; }
    .content-box {
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 40px;
      max-width: 900px;
    }
    .content-text {
      font-size: 28px;
      line-height: 1.6;
      opacity: 0.9;
    }
    .highlight-box {
      background: rgba(232, 184, 109, 0.2);
      border-left: 5px solid #E8B86D;
      padding: 25px 30px;
      margin-top: 30px;
      border-radius: 0 15px 15px 0;
      text-align: left;
    }
    .highlight-box p {
      font-size: 24px;
      font-weight: 600;
      color: #E8B86D;
    }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .handle { font-size: 20px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  
  <div class="number-badge">4</div>
  
  <div class="main-title">
    Other autism parents will become your <span class="highlight">village</span>
  </div>
  
  <div class="content-box">
    <div class="content-text">
      The friends who "don't get it" will fade.
    </div>
    <div class="highlight-box">
      <p>That's okay. Your new tribe understands without explanation.</p>
    </div>
  </div>
  
  <div class="footer">
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
