<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }
    .stop {
      font-size: 48px;
      font-weight: 700;
      color: #E74C3C;
      background: rgba(231,76,60,0.15);
      padding: 20px 50px;
      border-radius: 15px;
      margin-bottom: 50px;
      letter-spacing: 5px;
    }
    .main-text {
      font-size: 68px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 50px;
    }
    .main-text .strike {
      text-decoration: line-through;
      color: #E74C3C;
      opacity: 0.7;
    }
    .main-text .highlight {
      color: #27AE60;
    }
    .subtext {
      font-size: 40px;
      opacity: 0.9;
    }
    .swipe {
      position: absolute;
      bottom: 120px;
      font-size: 28px;
      font-weight: 600;
      color: #4A90A4;
    }
    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="stop">🛑 STOP</div>
    <div class="main-text">
      saying<br>
      "<span class="strike">autism awareness</span>"<br><br>
      say<br>
      "<span class="highlight">autism acceptance</span>"
    </div>
    <div class="subtext">Here's why it matters 👇</div>
    <div class="swipe">Swipe to learn</div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
