<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 32px;
      font-weight: 700;
      color: #E8B86D;
      letter-spacing: 4px;
      margin-bottom: 60px;
    }
    .step {
      width: 100%;
      padding: 40px;
      border-radius: 20px;
      margin-bottom: 25px;
      font-size: 44px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 30px;
    }
    .step-num {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
    }
    .step-1 { background: rgba(231,76,60,0.2); }
    .step-1 .step-num { background: #E74C3C; }
    .step-2 { background: rgba(232,184,109,0.2); }
    .step-2 .step-num { background: #E8B86D; color: #1a1a2e; }
    .step-3 { background: rgba(74,144,164,0.2); }
    .step-3 .step-num { background: #4A90A4; }
    .step-4 { background: rgba(39,174,96,0.2); }
    .step-4 .step-num { background: #27AE60; }
    .arrow {
      font-size: 48px;
      color: #4A90A4;
      margin: 10px 0;
    }
    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">THE PROGRESSION</div>
    <div class="step step-1">
      <div class="step-num">1</div>
      Awareness
    </div>
    <div class="arrow">↓</div>
    <div class="step step-2">
      <div class="step-num">2</div>
      Acceptance
    </div>
    <div class="arrow">↓</div>
    <div class="step step-3">
      <div class="step-num">3</div>
      Inclusion
    </div>
    <div class="arrow">↓</div>
    <div class="step step-4">
      <div class="step-num">4</div>
      Appreciation
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
