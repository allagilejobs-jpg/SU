<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Day 2 - Acceptance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide { width: 1080px; height: 1920px; background: linear-gradient(165deg, #2a004a 0%, #52008C 40%, #3a005f 100%); padding: 80px 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Poppins', sans-serif; color: white; text-align: center; position: relative; }
        .number { position: absolute; top: 60px; right: 60px; width: 100px; height: 100px; background: #FDB03E; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 800; color: #2a004a; }
        .emoji { font-size: 150px; margin-bottom: 50px; }
        .title { font-size: 64px; font-weight: 800; color: #FDB03E; margin-bottom: 30px; line-height: 1.2; }
        .description { font-size: 38px; line-height: 1.5; max-width: 900px; opacity: 0.95; }
        .tip-box { margin-top: 50px; background: rgba(24, 168, 241, 0.2); border: 3px solid #18A8F1; border-radius: 20px; padding: 30px 50px; font-size: 32px; font-weight: 600; }
        .brand { position: absolute; bottom: 40px; font-size: 24px; font-weight: 600; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="slide">
        <div class="number">2</div>
        <div class="emoji">✅</div>
        <div class="title">Acceptance<br>Is Different</div>
        <div class="description">Embraces autistic people as whole. Centers autistic voices: nothing about us without us. Focuses on strengths AND needs. The infinity symbol means infinite possibilities.</div>
        <div class="tip-box">💡 Language shapes how we treat people</div>
        <div class="brand">@SpectrumUnfolded</div>
    </div>
</body>
</html>
