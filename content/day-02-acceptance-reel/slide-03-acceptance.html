<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      position: relative;
    }
    .label {
      font-size: 28px;
      font-weight: 700;
      color: #27AE60;
      letter-spacing: 4px;
      margin-bottom: 30px;
    }
    .title {
      font-size: 72px;
      font-weight: 800;
      margin-bottom: 50px;
    }
    .title span { color: #27AE60; }
    .points {
      font-size: 38px;
      line-height: 2;
    }
    .point {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 20px;
    }
    .check { color: #27AE60; font-weight: 700; font-size: 44px; }
    .brand {
      position: absolute;
      bottom: 40px;
      left: 60px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">THE POWER OF</div>
    <div class="title">"<span>Acceptance</span>"</div>
    <div class="points">
      <div class="point"><span class="check">✓</span> Recognizes autism as a natural neurotype</div>
      <div class="point"><span class="check">✓</span> Celebrates differences, not just tolerates</div>
      <div class="point"><span class="check">✓</span> Leads to inclusion and belonging</div>
      <div class="point"><span class="check">✓</span> Supported by the autistic community</div>
      <div class="point"><span class="check">✓</span> Demands action, not just "knowing"</div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
