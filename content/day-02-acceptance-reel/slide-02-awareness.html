<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      position: relative;
    }
    .label {
      font-size: 28px;
      font-weight: 700;
      color: #E74C3C;
      letter-spacing: 4px;
      margin-bottom: 30px;
    }
    .title {
      font-size: 72px;
      font-weight: 800;
      margin-bottom: 50px;
    }
    .title span { color: #E74C3C; }
    .points {
      font-size: 38px;
      line-height: 2;
    }
    .point {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 20px;
    }
    .x { color: #E74C3C; font-weight: 700; font-size: 44px; }
    .brand {
      position: absolute;
      bottom: 40px;
      left: 60px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">THE PROBLEM WITH</div>
    <div class="title">"<span>Awareness</span>"</div>
    <div class="points">
      <div class="point"><span class="x">✗</span> Implies autism is something to "warn" people about</div>
      <div class="point"><span class="x">✗</span> Focuses on deficits and challenges</div>
      <div class="point"><span class="x">✗</span> Often leads to fear, not understanding</div>
      <div class="point"><span class="x">✗</span> Historically tied to harmful organizations</div>
      <div class="point"><span class="x">✗</span> "Awareness" without action is just noise</div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
