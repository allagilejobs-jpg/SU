<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }
    
    .title {
      font-size: 52px;
      font-weight: 800;
      color: #E8B86D;
      margin-bottom: 50px;
    }
    
    .subtitle {
      font-size: 32px;
      color: #4A90A4;
      margin-bottom: 40px;
    }
    
    .list {
      text-align: left;
      font-size: 36px;
      line-height: 2;
    }
    
    .list-item {
      display: flex;
      align-items: flex-start;
      gap: 20px;
    }
    
    .emoji {
      font-size: 36px;
    }
    
    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">What Sessions Look Like</div>
    <div class="subtitle">(Yes, it looks like play. That's the point!)</div>
    <div class="list">
      <div class="list-item"><span class="emoji">🎢</span> Swings and movement activities</div>
      <div class="list-item"><span class="emoji">🧊</span> Sensory bins and textures</div>
      <div class="list-item"><span class="emoji">🧩</span> Puzzles and fine motor games</div>
      <div class="list-item"><span class="emoji">🎨</span> Art and crafts</div>
      <div class="list-item"><span class="emoji">🏃</span> Obstacle courses</div>
      <div class="list-item"><span class="emoji">🧘</span> Calming strategies</div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
