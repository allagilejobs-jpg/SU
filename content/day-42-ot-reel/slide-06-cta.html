<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }
    
    .emoji-top {
      font-size: 100px;
      margin-bottom: 40px;
    }
    
    .message {
      font-size: 48px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 50px;
      max-width: 900px;
    }
    
    .message span {
      color: #E8B86D;
    }
    
    .cta-box {
      background: linear-gradient(135deg, #E8B86D 0%, #d4a85d 100%);
      color: #1a1a2e;
      padding: 50px 80px;
      border-radius: 30px;
      margin-bottom: 50px;
    }
    
    .cta-box .main {
      font-size: 44px;
      font-weight: 800;
      margin-bottom: 15px;
    }
    
    .cta-box .sub {
      font-size: 32px;
      font-weight: 600;
      opacity: 0.9;
    }
    
    .actions {
      display: flex;
      gap: 60px;
      font-size: 36px;
      font-weight: 600;
    }
    
    .action {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    
    .action-icon {
      font-size: 60px;
    }
    
    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 28px;
      font-weight: 700;
      color: #E8B86D;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="emoji-top">🙌</div>
    <div class="message">
      Good OT can be <span>life-changing</span> for autistic kids
    </div>
    <div class="cta-box">
      <div class="main">Has OT helped your child?</div>
      <div class="sub">Share your experience below! 👇</div>
    </div>
    <div class="actions">
      <div class="action">
        <span class="action-icon">💾</span>
        <span>Save</span>
      </div>
      <div class="action">
        <span class="action-icon">📤</span>
        <span>Share</span>
      </div>
      <div class="action">
        <span class="action-icon">➕</span>
        <span>Follow</span>
      </div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
