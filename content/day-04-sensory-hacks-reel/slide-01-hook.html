<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .slide::before {
      content: '';
      position: absolute;
      top: -150px;
      right: -150px;
      width: 400px;
      height: 400px;
      background: #E8B86D;
      border-radius: 50%;
      opacity: 0.1;
    }
    
    .slide::after {
      content: '';
      position: absolute;
      bottom: -100px;
      left: -100px;
      width: 300px;
      height: 300px;
      background: #4A90A4;
      border-radius: 50%;
      opacity: 0.1;
    }
    
    .emoji-top {
      font-size: 120px;
      margin-bottom: 40px;
      position: relative;
      z-index: 1;
    }
    
    .hook {
      font-size: 72px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 40px;
      position: relative;
      z-index: 1;
    }
    
    .hook span {
      color: #E8B86D;
    }
    
    .subtext {
      font-size: 36px;
      opacity: 0.9;
      max-width: 800px;
      line-height: 1.4;
      position: relative;
      z-index: 1;
    }
    
    .swipe {
      position: absolute;
      bottom: 100px;
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 28px;
      font-weight: 600;
      color: #4A90A4;
    }
    
    .swipe::after {
      content: '→';
      font-size: 36px;
      animation: bounce 1s infinite;
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(10px); }
    }
    
    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="emoji-top">🧠✨</div>
    <div class="hook">
      <span>5 Sensory Hacks</span><br>
      That Actually Work
    </div>
    <div class="subtext">
      OT-approved tips for meltdown prevention
    </div>
    <div class="swipe">Swipe for the hacks</div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
