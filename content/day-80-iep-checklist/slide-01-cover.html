<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 500px; height: 500px; background: #27AE60; top: -150px; right: -150px; }
    .bg-shape-2 { width: 350px; height: 350px; background: #E8B86D; bottom: 100px; left: -100px; }
    .bg-shape-3 { width: 300px; height: 300px; background: #4A90A4; top: 200px; left: -80px; }
    .free-badge {
      background: #27AE60;
      color: white;
      padding: 14px 35px; border-radius: 30px;
      font-size: 20px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 4px;
      margin-bottom: 15px;
    }
    .day-badge {
      background: linear-gradient(135deg, #E8B86D 0%, #F39C12 100%);
      color: #1a1a2e;
      padding: 10px 25px; border-radius: 25px;
      font-size: 16px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 3px;
      margin-bottom: 40px;
    }
    .emoji-row { font-size: 70px; margin-bottom: 30px; }
    .main-title {
      font-family: 'Playfair Display', serif;
      font-size: 60px; font-weight: 800;
      line-height: 1.15; margin-bottom: 30px; max-width: 900px;
    }
    .highlight { color: #E8B86D; }
    .highlight-green { color: #27AE60; }
    .subtitle {
      font-size: 26px; opacity: 0.85;
      margin-bottom: 50px; max-width: 800px; line-height: 1.4;
    }
    .swipe-cta {
      display: flex; align-items: center; gap: 15px;
      font-size: 22px; font-weight: 600; opacity: 0.7; margin-top: 30px;
    }
    .arrow { font-size: 30px; }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .handle { font-size: 20px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  <div class="bg-shape bg-shape-3"></div>

  <div class="free-badge">FREE DOWNLOAD</div>
  <div class="day-badge">Day 80</div>
  <div class="emoji-row">📋 ✅ 🎯</div>

  <div class="main-title">
    IEP Meeting <span class="highlight">Prep</span> <span class="highlight-green">Checklist</span>
  </div>

  <div class="subtitle">
    Walk into your next IEP meeting prepared, confident, and organized.
  </div>

  <div class="swipe-cta">
    <span>Swipe to preview and download</span>
    <span class="arrow">→</span>
  </div>

  <div class="footer">
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
