<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 40%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 500px; height: 500px; background: #18A8F1; top: -150px; left: -150px; }
    .bg-shape-2 { width: 350px; height: 350px; background: #FDB03E; bottom: 50px; right: -100px; }
    .free-badge {
      background: #18A8F1;
      color: white;
      padding: 14px 35px; border-radius: 30px;
      font-size: 20px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 4px;
      margin-bottom: 30px;
    }
    .emoji { font-size: 100px; margin-bottom: 30px; }
    .main-title {
      font-family: 'Playfair Display', serif;
      font-size: 50px; font-weight: 800;
      line-height: 1.2; margin-bottom: 40px; max-width: 900px;
    }
    .highlight { color: #FDB03E; }
    .highlight-green { color: #18A8F1; }
    .cta-box {
      background: linear-gradient(135deg, #FDB03E 0%, #FDB03E 100%);
      color: #2a004a;
      padding: 35px 60px; border-radius: 20px; margin-bottom: 40px;
    }
    .cta-text { font-size: 28px; font-weight: 700; }
    .actions {
      display: flex; gap: 30px; flex-wrap: wrap; justify-content: center;
    }
    .action-item {
      display: flex; align-items: center; gap: 12px;
      font-size: 22px; font-weight: 600; opacity: 0.8;
    }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .handle { font-size: 22px; opacity: 0.6; }
    .follow-text { font-size: 16px; opacity: 0.4; margin-bottom: 8px; letter-spacing: 2px; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>

  <div class="free-badge">FREE DOWNLOAD</div>
  <div class="emoji">📋</div>

  <div class="main-title">
    Comment <span class="highlight">"CHECKLIST"</span> to Get Your <span class="highlight-green">Free Copy</span>!
  </div>

  <div class="cta-box">
    <div class="cta-text">💬 Comment "CHECKLIST" below!</div>
  </div>

  <div class="actions">
    <div class="action-item">💾 Save</div>
    <div class="action-item">📤 Share</div>
    <div class="action-item">➕ Follow</div>
  </div>

  <div class="footer">
    <div class="follow-text">FREE RESOURCES FOR INFORMED PARENTS</div>
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
