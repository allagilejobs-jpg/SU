<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1350px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 50%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.1; }
    .bg-shape-1 { width: 600px; height: 600px; background: #18A8F1; top: -200px; right: -200px; }
    .bg-shape-2 { width: 400px; height: 400px; background: #CC78CB; bottom: -150px; left: -150px; }
    .emoji-row { font-size: 80px; margin-bottom: 40px; letter-spacing: 20px; }
    .main-title { 
      font-family: 'Playfair Display', serif; 
      font-size: 52px; 
      font-weight: 800; 
      line-height: 1.2; 
      margin-bottom: 50px;
      max-width: 900px;
    }
    .highlight { color: #18A8F1; }
    .highlight-gold { color: #FDB03E; }
    .cta-box {
      background: rgba(24, 168, 241, 0.15);
      border: 2px solid #18A8F1;
      border-radius: 20px;
      padding: 40px 50px;
    }
    .cta-item {
      font-size: 26px;
      font-weight: 600;
      margin: 15px 0;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .cta-icon { font-size: 32px; }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .handle { font-size: 22px; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  
  <div class="emoji-row">💙 🧠 💙</div>
  
  <div class="main-title">
    Share this with someone who <span class="highlight-gold">needs to hear it</span>
  </div>
  
  <div class="cta-box">
    <div class="cta-item"><span class="cta-icon">💾</span> Save for when you need the reminder</div>
    <div class="cta-item"><span class="cta-icon">📤</span> Share with a family member</div>
    <div class="cta-item"><span class="cta-icon">💬</span> Tag someone who gets it</div>
  </div>
  
  <div class="footer">
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
