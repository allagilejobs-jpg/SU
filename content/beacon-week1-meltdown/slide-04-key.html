<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1350px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 50%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.1; }
    .bg-shape-1 { width: 500px; height: 500px; background: #FDB03E; top: -150px; left: -150px; }
    .bg-shape-2 { width: 400px; height: 400px; background: #18A8F1; bottom: -100px; right: -100px; }
    .emoji { font-size: 80px; margin-bottom: 40px; }
    .comparison {
      display: flex;
      gap: 40px;
      margin-bottom: 50px;
    }
    .compare-box {
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 35px;
      width: 420px;
    }
    .compare-box.tantrum {
      border-top: 5px solid #18A8F1;
    }
    .compare-box.meltdown {
      border-top: 5px solid #CC78CB;
    }
    .compare-label {
      font-size: 22px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }
    .compare-box.tantrum .compare-label { color: #18A8F1; }
    .compare-box.meltdown .compare-label { color: #CC78CB; }
    .compare-action {
      font-size: 28px;
      line-height: 1.4;
    }
    .main-insight {
      font-family: 'Playfair Display', serif;
      font-size: 44px;
      font-weight: 800;
      line-height: 1.3;
      max-width: 850px;
      color: #FDB03E;
    }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .handle { font-size: 20px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  
  <div class="emoji">💡</div>
  
  <div class="comparison">
    <div class="compare-box tantrum">
      <div class="compare-label">Tantrum</div>
      <div class="compare-action">You can discipline.</div>
    </div>
    <div class="compare-box meltdown">
      <div class="compare-label">Meltdown</div>
      <div class="compare-action">You can only support.</div>
    </div>
  </div>
  
  <div class="main-insight">
    Understanding this changed everything for our family.
  </div>
  
  <div class="footer">
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
