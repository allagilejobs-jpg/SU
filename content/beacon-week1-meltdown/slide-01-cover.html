<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1350px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 50%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 500px; height: 500px; background: #CC78CB; top: -150px; left: -150px; }
    .bg-shape-2 { width: 400px; height: 400px; background: #18A8F1; bottom: -100px; right: -100px; }
    .badge { 
      background: #CC78CB; 
      padding: 12px 30px; 
      border-radius: 30px; 
      font-size: 18px; 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 3px;
      margin-bottom: 40px;
    }
    .quote-text {
      font-size: 36px;
      font-style: italic;
      opacity: 0.7;
      margin-bottom: 40px;
      max-width: 800px;
    }
    .main-title { 
      font-family: 'Playfair Display', serif; 
      font-size: 56px; 
      font-weight: 800; 
      line-height: 1.15; 
      margin-bottom: 30px;
      max-width: 950px;
    }
    .highlight { color: #18A8F1; }
    .highlight-red { color: #CC78CB; }
    .vs {
      font-size: 48px;
      font-weight: 800;
      color: #FDB03E;
      margin: 0 20px;
    }
    .subtitle {
      font-size: 26px;
      opacity: 0.85;
      margin-bottom: 40px;
      max-width: 800px;
      line-height: 1.4;
    }
    .swipe-cta {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 22px;
      font-weight: 600;
      opacity: 0.7;
      margin-top: 30px;
    }
    .arrow { font-size: 30px; }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .handle { font-size: 20px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  
  <div class="badge">🧠 Education</div>
  
  <div class="quote-text">"They're just throwing a tantrum."</div>
  
  <div class="main-title">
    <span class="highlight-red">Meltdown</span> <span class="vs">vs</span> <span class="highlight">Tantrum</span>
  </div>
  
  <div class="subtitle">
    Here's the difference that changes everything.
  </div>
  
  <div class="swipe-cta">
    <span>Swipe to understand</span>
    <span class="arrow">→</span>
  </div>
  
  <div class="footer">
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
