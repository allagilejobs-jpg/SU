<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    /* 
     * CAROUSEL VIDEO TEMPLATE - 1080x1350
     * Replace: [CELEBRITY_NAME], [HEADLINE], [PERSON_NAME], [CONTEXT], [CREDIT]
     * 
     * Video area: 960x780 at position (60, 200)
     * Green (#00ff00) is chroma keyed out for video
     */
    
    body {
      width: 1080px;
      height: 1350px;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Poppins', sans-serif;
      position: relative;
      overflow: hidden;
    }
    
    /* Decorative circles */
    body::before {
      content: '';
      position: absolute;
      top: -150px;
      right: -150px;
      width: 400px;
      height: 400px;
      background: #E8B86D;
      border-radius: 50%;
      opacity: 0.1;
    }
    body::after {
      content: '';
      position: absolute;
      bottom: -100px;
      left: -100px;
      width: 300px;
      height: 300px;
      background: #4A90A4;
      border-radius: 50%;
      opacity: 0.1;
    }
    
    /* Top section - 200px */
    .top-section {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 200px;
      padding: 40px 60px;
      background: linear-gradient(180deg, #1a1a2e 0%, transparent 100%);
    }
    
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    
    .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #4A90A4 0%, #E8B86D 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    
    .brand-text .brand-main {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 800;
      color: white;
      letter-spacing: 2px;
    }
    
    .brand-text .brand-sub {
      font-size: 12px;
      font-weight: 600;
      color: #4A90A4;
      letter-spacing: 3px;
    }
    
    .headline {
      font-size: 26px;
      font-weight: 700;
      color: white;
      line-height: 1.25;
    }
    
    .headline .name {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      color: #E8B86D;
    }
    
    /* Video area - GREEN for chroma key */
    .video-area {
      position: absolute;
      top: 200px;
      left: 60px;
      right: 60px;
      height: 780px;
      background: #00ff00;
      border-radius: 16px;
    }
    
    /* Frame border */
    .video-frame {
      position: absolute;
      top: 196px;
      left: 56px;
      right: 56px;
      height: 788px;
      border: 2px solid rgba(74,144,164,0.4);
      border-radius: 20px;
      pointer-events: none;
    }
    
    /* Bottom section - 190px */
    .bottom-section {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 190px;
      padding: 25px 60px;
      background: linear-gradient(0deg, #1a1a2e 0%, transparent 100%);
    }
    
    .person-name {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 800;
      color: #E8B86D;
      margin-bottom: 6px;
    }
    
    .context {
      font-size: 16px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      margin-bottom: 15px;
    }
    
    .credit {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      margin-bottom: 8px;
    }
    
    .handle {
      font-size: 16px;
      font-weight: 600;
      color: #4A90A4;
    }
    
    .swipe {
      position: absolute;
      bottom: 30px;
      right: 60px;
      font-size: 14px;
      font-weight: 600;
      color: #4A90A4;
    }
  </style>
</head>
<body>
  <div class="top-section">
    <div class="brand">
      <div class="brand-icon">🧩</div>
      <div class="brand-text">
        <div class="brand-main">SPECTRUM</div>
        <div class="brand-sub">UNLOCKED</div>
      </div>
    </div>
    <div class="headline">
      <span class="name">[CELEBRITY_NAME]</span> [HEADLINE]
    </div>
  </div>
  
  <div class="video-frame"></div>
  <div class="video-area"></div>
  
  <div class="bottom-section">
    <div class="person-name">[PERSON_NAME]</div>
    <div class="context">[CONTEXT]</div>
    <div class="credit">🎥 [CREDIT]</div>
    <div class="handle">@spectrum_unlocked</div>
  </div>
  
  <div class="swipe">Swipe →</div>
</body>
</html>
