<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    /* 
     * CAROUSEL COVER TEMPLATE - 1080x1350
     * Replace: [PHOTO_PATH], [CELEBRITY_NAME], [HEADLINE]
     */
    
    body {
      width: 1080px;
      height: 1350px;
      background: #000;
      font-family: 'Poppins', sans-serif;
      position: relative;
      overflow: hidden;
    }
    
    /* Photo fills frame */
    .photo {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('[PHOTO_PATH]') center center / cover no-repeat;
    }
    
    /* Dark overlay for readability */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, 
        rgba(42, 0, 74, 0.5) 0%,
        rgba(42, 0, 74, 0.2) 30%,
        rgba(42, 0, 74, 0.2) 50%,
        rgba(42, 0, 74, 0.9) 100%);
    }
    
    /* Decorative circles */
    .overlay::before {
      content: '';
      position: absolute;
      top: -150px;
      right: -150px;
      width: 400px;
      height: 400px;
      background: #FDB03E;
      border-radius: 50%;
      opacity: 0.1;
    }
    .overlay::after {
      content: '';
      position: absolute;
      bottom: -100px;
      left: -100px;
      width: 300px;
      height: 300px;
      background: #18A8F1;
      border-radius: 50%;
      opacity: 0.1;
    }
    
    /* Brand - top left */
    .brand {
      position: absolute;
      top: 40px;
      left: 60px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #18A8F1 0%, #FDB03E 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    
    .brand-text .brand-main {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 800;
      color: white;
      letter-spacing: 2px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
    }
    
    .brand-text .brand-sub {
      font-size: 12px;
      font-weight: 600;
      color: #18A8F1;
      letter-spacing: 3px;
    }
    
    /* Content - bottom */
    .content {
      position: absolute;
      bottom: 60px;
      left: 60px;
      right: 60px;
    }
    
    .label {
      font-size: 14px;
      font-weight: 700;
      color: #18A8F1;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }
    
    .name {
      font-family: 'Playfair Display', serif;
      font-size: 52px;
      font-weight: 800;
      color: #FDB03E;
      line-height: 1.1;
      margin-bottom: 15px;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
    }
    
    .headline {
      font-size: 24px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      line-height: 1.4;
    }
    
    /* Swipe hint - bottom right */
    .swipe {
      position: absolute;
      bottom: 60px;
      right: 60px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #18A8F1;
    }
    
    .swipe-arrow {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(24, 168, 241, 0.6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="photo"></div>
  <div class="overlay"></div>
  
  <div class="brand">
    <div class="brand-icon">🧩</div>
    <div class="brand-text">
      <div class="brand-main">SPECTRUM</div>
      <div class="brand-sub">UNLOCKED</div>
    </div>
  </div>
  
  <div class="content">
    <div class="label">FEATURED STORY</div>
    <div class="name">[CELEBRITY_NAME]</div>
    <div class="headline">[HEADLINE]</div>
  </div>
  
  <div class="swipe">
    <span>WATCH</span>
    <div class="swipe-arrow">→</div>
  </div>
</body>
</html>
