<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    /* 
     * REEL VIDEO TEMPLATE - 1080x1920
     * Replace: [CELEBRITY_NAME], [HEADLINE], [PERSON_NAME], [CONTEXT], [CREDIT]
     * 
     * Video area: 960x1200 at position (60, 280)
     * Green (#00ff00) is chroma keyed out for video
     */
    
    body {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(180deg, #2a004a 0%, #52008C 50%, #3a005f 100%);
      font-family: 'Poppins', sans-serif;
      position: relative;
      overflow: hidden;
    }
    
    /* Decorative circles */
    body::before {
      content: '';
      position: absolute;
      top: -150px;
      right: -150px;
      width: 500px;
      height: 500px;
      background: #FDB03E;
      border-radius: 50%;
      opacity: 0.1;
    }
    body::after {
      content: '';
      position: absolute;
      bottom: -150px;
      left: -150px;
      width: 400px;
      height: 400px;
      background: #18A8F1;
      border-radius: 50%;
      opacity: 0.1;
    }
    
    /* Top section - 280px */
    .top-section {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 280px;
      padding: 50px 60px;
      background: linear-gradient(180deg, #2a004a 0%, transparent 100%);
    }
    
    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }
    
    .brand-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #18A8F1 0%, #FDB03E 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }
    
    .brand-text .brand-main {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 800;
      color: white;
      letter-spacing: 2px;
    }
    
    .brand-text .brand-sub {
      font-size: 14px;
      font-weight: 600;
      color: #18A8F1;
      letter-spacing: 3px;
    }
    
    .headline {
      font-size: 32px;
      font-weight: 700;
      color: white;
      line-height: 1.25;
    }
    
    .headline .name {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      color: #FDB03E;
    }
    
    /* Video area - GREEN for chroma key */
    .video-area {
      position: absolute;
      top: 280px;
      left: 60px;
      right: 60px;
      height: 1200px;
      background: #00ff00;
      border-radius: 20px;
    }
    
    /* Frame border */
    .video-frame {
      position: absolute;
      top: 276px;
      left: 56px;
      right: 56px;
      height: 1208px;
      border: 2px solid rgba(24, 168, 241, 0.4);
      border-radius: 24px;
      pointer-events: none;
    }
    
    /* Bottom section - 260px */
    .bottom-section {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 260px;
      padding: 35px 60px;
      background: linear-gradient(0deg, #2a004a 0%, transparent 100%);
    }
    
    .person-name {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 800;
      color: #FDB03E;
      margin-bottom: 8px;
    }
    
    .context {
      font-size: 18px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      margin-bottom: 20px;
    }
    
    .credit {
      font-size: 16px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      margin-bottom: 10px;
    }
    
    .handle {
      font-size: 18px;
      font-weight: 600;
      color: #18A8F1;
    }
  </style>
</head>
<body>
  <div class="top-section">
    <div class="brand">
      <div class="brand-icon">🧩</div>
      <div class="brand-text">
        <div class="brand-main">SPECTRUM</div>
        <div class="brand-sub">UNLOCKED</div>
      </div>
    </div>
    <div class="headline">
      <span class="name">[CELEBRITY_NAME]</span> [HEADLINE]
    </div>
  </div>
  
  <div class="video-frame"></div>
  <div class="video-area"></div>
  
  <div class="bottom-section">
    <div class="person-name">[PERSON_NAME]</div>
    <div class="context">[CONTEXT]</div>
    <div class="credit">🎥 [CREDIT]</div>
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
