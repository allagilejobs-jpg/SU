<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1920px;
      background: transparent;
      font-family: 'Poppins', sans-serif;
      position: relative;
    }
    .brand {
      position: absolute;
      top: 60px;
      left: 50px;
    }
    .brand-main {
      font-size: 32px;
      font-weight: 900;
      color: white;
      letter-spacing: 1px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.95);
    }
    .brand-sub {
      font-size: 22px;
      font-weight: 700;
      color: #4A90A4;
      letter-spacing: 1px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.95);
    }
    .headline-box {
      position: absolute;
      top: 200px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.96);
      padding: 22px 36px;
      border-radius: 12px;
      max-width: 950px;
      text-align: center;
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    }
    .headline {
      font-size: 30px;
      font-weight: 800;
      color: #1a1a2e;
      line-height: 1.32;
    }
    .credit {
      position: absolute;
      top: 380px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 22px;
      font-weight: 600;
      color: white;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.95);
    }
  </style>
</head>
<body>
  <div class="brand">
    <div class="brand-main">SPECTRUM</div>
    <div class="brand-sub">UNLOCKED</div>
  </div>
  <div class="headline-box">
    <div class="headline">
      Madden Orlovsky:<br>
      "Mom, I Love You."
    </div>
  </div>
  <div class="credit">via ESPN NFL Live</div>
</body>
</html>
