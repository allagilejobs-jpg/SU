<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(180deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
      font-family: 'Poppins', sans-serif;
      position: relative;
      overflow: hidden;
    }
    
    /* Decorative elements */
    .glow-circle {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(74,144,164,0.15) 0%, transparent 70%);
    }
    .glow-1 { top: -100px; left: -100px; }
    .glow-2 { bottom: -100px; right: -100px; }
    .glow-3 { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 800px; height: 800px; background: radial-gradient(circle, rgba(232,184,109,0.08) 0%, transparent 70%); }
    
    /* Top section with brand */
    .top-section {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 280px;
      padding: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .brand-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #4A90A4 0%, #E8B86D 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    
    .brand-text {
      display: flex;
      flex-direction: column;
    }
    
    .brand-main {
      font-size: 28px;
      font-weight: 900;
      color: white;
      letter-spacing: 2px;
    }
    
    .brand-sub {
      font-size: 16px;
      font-weight: 700;
      color: #4A90A4;
      letter-spacing: 3px;
    }
    
    .headline {
      font-size: 32px;
      font-weight: 800;
      color: white;
      line-height: 1.2;
    }
    
    .headline .name {
      color: #E8B86D;
    }
    
    /* Video placeholder area - green for chroma key */
    .video-area {
      position: absolute;
      top: 280px;
      left: 40px;
      right: 40px;
      height: 1120px;
      background: #00ff00;
      border-radius: 20px;
      overflow: hidden;
    }
    
    /* Frame border effect */
    .video-frame {
      position: absolute;
      top: 275px;
      left: 35px;
      right: 35px;
      height: 1130px;
      border: 3px solid rgba(74,144,164,0.5);
      border-radius: 25px;
      pointer-events: none;
    }
    
    /* Bottom section */
    .bottom-section {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 240px;
      padding: 40px 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .credit {
      font-size: 18px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      margin-bottom: 15px;
    }
    
    .cta {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    
    .cta-text {
      font-size: 20px;
      font-weight: 700;
      color: white;
    }
    
    .swipe-arrow {
      font-size: 24px;
      color: #E8B86D;
      padding: 10px 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 25px;
      border: 1px solid rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div class="glow-circle glow-1"></div>
  <div class="glow-circle glow-2"></div>
  <div class="glow-circle glow-3"></div>
  
  <div class="top-section">
    <div class="brand">
      <div class="brand-icon">🧩</div>
      <div class="brand-text">
        <div class="brand-main">SPECTRUM</div>
        <div class="brand-sub">UNLOCKED</div>
      </div>
    </div>
    <div class="headline">
      <span class="name">OT Genasis</span> Opens Up About<br>
      His Son's Autism Diagnosis
    </div>
  </div>
  
  <div class="video-frame"></div>
  <div class="video-area"></div>
  
  <div class="bottom-section">
    <div class="credit">🎥 @otgenasis via The Therapist</div>
    <div class="cta">
      <div class="cta-text">Swipe for the full clip</div>
      <div class="swipe-arrow">→</div>
    </div>
  </div>
</body>
</html>
