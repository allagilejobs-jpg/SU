<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900:ital@0;1&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:1080px; height:1350px;
  background:linear-gradient(165deg, #2a004a 0%, #52008C 40%, #3a005f 100%);
  font-family:'Poppins',sans-serif; color:white;
  padding:120px 80px;
  position:relative; overflow:hidden;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center;
}
body::before {
  content:''; position:absolute; top:-180px; right:-180px;
  width:580px; height:580px;
  background:#FDB03E; border-radius:50%; opacity:0.1;
}
body::after {
  content:''; position:absolute; bottom:-140px; left:-140px;
  width:440px; height:440px;
  background:#18A8F1; border-radius:50%; opacity:0.1;
}
.brand { position:absolute; top:60px; left:60px; }
.brand-main { font-size:36px; font-weight:900; color:white; letter-spacing:2px; }
.brand-sub { font-size:22px; font-weight:800; color:#18A8F1; letter-spacing:5px; margin-top:-4px; }
.label {
  font-size:24px; font-weight:700; color:#18A8F1;
  text-transform:uppercase; letter-spacing:5px;
  margin-bottom:40px;
  position:relative; z-index:1;
}
.main-msg {
  font-family:'Playfair Display', serif;
  font-size:92px; font-weight:900; line-height:1.03;
  margin-bottom:40px; max-width:900px;
  position:relative; z-index:1;
}
.main-msg em { color:#FDB03E; font-style:italic; }
.sub-msg {
  font-size:28px; font-weight:500; line-height:1.45;
  max-width:820px; opacity:0.92;
  margin-bottom:55px;
  position:relative; z-index:1;
}
.actions {
  display:flex; gap:70px;
  position:relative; z-index:1;
  margin-bottom:50px;
}
.action {
  display:flex; flex-direction:column; align-items:center; gap:8px;
  font-size:22px; font-weight:700;
}
.action-icon { font-size:56px; }
.cta-box {
  background:linear-gradient(135deg, #FDB03E 0%, #E59A2A 100%);
  color:#2a004a; padding:26px 56px;
  border-radius:18px;
  position:relative; z-index:1;
  box-shadow:0 10px 36px rgba(253, 176, 62, 0.35);
}
.cta-text { font-size:32px; font-weight:900; }
.handle {
  position:absolute; bottom:60px;
  font-size:26px; font-weight:700; color:#FDB03E; letter-spacing:1px;
}
</style></head>
<body>
  <div class="brand"><div class="brand-main">SPECTRUM</div><div class="brand-sub">UNLOCKED</div></div>
  <div class="label">OT'S TRUTH</div>
  <div class="main-msg">Maybe he <em>chose</em> you.</div>
  <div class="sub-msg">Every autism dad needs to hear this. You weren't given a burden. You were given a son.</div>
  <div class="actions">
    <div class="action"><span class="action-icon">&#0F7BB3;</span><span>Save</span></div>
    <div class="action"><span class="action-icon">&#0F7BB3;</span><span>Share</span></div>
    <div class="action"><span class="action-icon">&#10133;</span><span>Follow</span></div>
  </div>
  <div class="cta-box"><div class="cta-text">Tag an autism dad</div></div>
  <div class="handle">@spectrum_unlocked</div>
</body></html>
