<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1350px;
      background: #000;
      font-family: 'Poppins', sans-serif;
      position: relative;
      overflow: hidden;
    }
    
    /* Photo fills frame */
    .photo {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('cover-photo-web.jpg') center center / cover no-repeat;
    }
    
    /* Dark overlay for readability */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, 
        rgba(0,0,0,0.4) 0%,
        rgba(0,0,0,0.2) 30%,
        rgba(0,0,0,0.2) 50%,
        rgba(0,0,0,0.85) 100%);
    }
    
    /* Accent line */
    .accent-line {
      position: absolute;
      top: 50px;
      left: 50px;
      width: 60px;
      height: 4px;
      background: linear-gradient(90deg, #4A90A4, #E8B86D);
      border-radius: 2px;
    }
    
    /* Brand */
    .brand {
      position: absolute;
      top: 75px;
      left: 50px;
    }
    
    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 800;
      color: white;
      letter-spacing: 3px;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
    }
    
    .brand-tag {
      font-size: 12px;
      font-weight: 600;
      color: #4A90A4;
      letter-spacing: 4px;
      margin-top: 3px;
    }
    
    /* Bottom content */
    .content {
      position: absolute;
      bottom: 60px;
      left: 50px;
      right: 50px;
    }
    
    .label {
      font-size: 14px;
      font-weight: 700;
      color: #4A90A4;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }
    
    .name {
      font-family: 'Playfair Display', serif;
      font-size: 56px;
      font-weight: 800;
      color: white;
      line-height: 1.1;
      margin-bottom: 20px;
      text-shadow: 2px 2px 15px rgba(0,0,0,0.5);
    }
    
    .headline {
      font-size: 24px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      line-height: 1.4;
    }
    
    .headline em {
      color: #E8B86D;
      font-style: normal;
    }
    
    /* Swipe hint */
    .swipe {
      position: absolute;
      bottom: 60px;
      right: 50px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      font-weight: 600;
    }
    
    .swipe-arrow {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="photo"></div>
  <div class="overlay"></div>
  
  <div class="accent-line"></div>
  <div class="brand">
    <div class="brand-name">SPECTRUM</div>
    <div class="brand-tag">UNLOCKED</div>
  </div>
  
  <div class="content">
    <div class="label">FEATURED STORY</div>
    <div class="name">OT Genasis</div>
    <div class="headline">Opens up about his son's<br><em>autism diagnosis</em></div>
  </div>
  
  <div class="swipe">
    <span>WATCH</span>
    <div class="swipe-arrow">→</div>
  </div>
</body>
</html>
