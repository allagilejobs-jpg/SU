<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1350px;
      background: #000;
      font-family: 'Poppins', sans-serif;
      position: relative;
      overflow: hidden;
    }
    
    /* Video fills the frame */
    .video-area {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #00ff00;
    }
    
    /* Cinematic gradient overlays */
    .gradient-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 350px;
      background: linear-gradient(180deg, 
        rgba(0,0,0,0.85) 0%,
        rgba(0,0,0,0.6) 40%,
        transparent 100%);
    }
    
    .gradient-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 400px;
      background: linear-gradient(0deg, 
        rgba(0,0,0,0.9) 0%,
        rgba(0,0,0,0.7) 40%,
        transparent 100%);
    }
    
    /* Accent line */
    .accent-line {
      position: absolute;
      top: 45px;
      left: 50px;
      width: 60px;
      height: 4px;
      background: linear-gradient(90deg, #4A90A4, #E8B86D);
      border-radius: 2px;
    }
    
    /* Minimal brand */
    .brand {
      position: absolute;
      top: 65px;
      left: 50px;
    }
    
    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 800;
      color: white;
      letter-spacing: 3px;
    }
    
    .brand-tag {
      font-size: 12px;
      font-weight: 600;
      color: #4A90A4;
      letter-spacing: 4px;
      margin-top: 3px;
    }
    
    /* Quote */
    .quote-section {
      position: absolute;
      top: 140px;
      left: 50px;
      right: 50px;
    }
    
    .quote-mark {
      font-family: 'Playfair Display', serif;
      font-size: 80px;
      color: #E8B86D;
      opacity: 0.4;
      line-height: 0.5;
    }
    
    .quote-text {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 700;
      color: white;
      line-height: 1.3;
      margin-top: -10px;
    }
    
    /* Bottom content */
    .bottom-content {
      position: absolute;
      bottom: 45px;
      left: 50px;
      right: 50px;
    }
    
    .person-name {
      font-size: 22px;
      font-weight: 800;
      color: #E8B86D;
      margin-bottom: 5px;
    }
    
    .context {
      font-size: 15px;
      font-weight: 500;
      color: rgba(255,255,255,0.8);
      margin-bottom: 15px;
    }
    
    .divider {
      width: 50px;
      height: 2px;
      background: rgba(255,255,255,0.3);
      margin-bottom: 15px;
    }
    
    .credit {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="video-area"></div>
  
  <div class="gradient-top"></div>
  <div class="gradient-bottom"></div>
  
  <div class="accent-line"></div>
  <div class="brand">
    <div class="brand-name">SPECTRUM</div>
    <div class="brand-tag">UNLOCKED</div>
  </div>
  
  <div class="quote-section">
    <div class="quote-mark">"</div>
    <div class="quote-text">Maybe he chose you.<br>Maybe you were the<br>perfect father for him.</div>
  </div>
  
  <div class="bottom-content">
    <div class="person-name">OT GENASIS</div>
    <div class="context">On raising his son with autism</div>
    <div class="divider"></div>
    <div class="credit">📍 THE THERAPIST</div>
  </div>
</body>
</html>
