<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1350px;
      background: #0a0a0f;
      font-family: 'Poppins', sans-serif;
      position: relative;
    }
    
    /* TOP SECTION - 200px */
    .top-section {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 200px;
      padding: 40px 50px;
      background: linear-gradient(180deg, #0a0a0f 0%, #0a0a0f 100%);
    }
    
    .accent-line {
      width: 50px;
      height: 3px;
      background: linear-gradient(90deg, #4A90A4, #E8B86D);
      margin-bottom: 15px;
    }
    
    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 800;
      color: white;
      letter-spacing: 3px;
    }
    
    .brand-tag {
      font-size: 11px;
      font-weight: 600;
      color: #4A90A4;
      letter-spacing: 4px;
      margin-top: 3px;
    }
    
    .quote {
      position: absolute;
      top: 110px;
      left: 50px;
      right: 50px;
    }
    
    .quote-text {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: white;
      line-height: 1.25;
    }
    
    .quote-text em {
      color: #E8B86D;
      font-style: normal;
    }
    
    /* VIDEO AREA - 900px (green for chroma key) */
    .video-area {
      position: absolute;
      top: 200px;
      left: 0;
      right: 0;
      height: 900px;
      background: #00ff00;
    }
    
    /* BOTTOM SECTION - 250px */
    .bottom-section {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 250px;
      padding: 30px 50px;
      background: linear-gradient(0deg, #0a0a0f 0%, #0a0a0f 100%);
    }
    
    .person-name {
      font-size: 26px;
      font-weight: 800;
      color: #E8B86D;
      margin-bottom: 8px;
    }
    
    .context {
      font-size: 16px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      margin-bottom: 20px;
    }
    
    .divider {
      width: 40px;
      height: 2px;
      background: rgba(255,255,255,0.2);
      margin-bottom: 20px;
    }
    
    .credit {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.4);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="top-section">
    <div class="accent-line"></div>
    <div class="brand-name">SPECTRUM</div>
    <div class="brand-tag">UNLOCKED</div>
    <div class="quote">
      <div class="quote-text">"Maybe he <em>chose</em> you. Maybe you were the <em>perfect father</em> for him."</div>
    </div>
  </div>
  
  <div class="video-area"></div>
  
  <div class="bottom-section">
    <div class="person-name">OT GENASIS</div>
    <div class="context">On raising his son with autism</div>
    <div class="divider"></div>
    <div class="credit">🎥 THE THERAPIST</div>
  </div>
</body>
</html>
