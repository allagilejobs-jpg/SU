<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900:ital@0;1&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:1080px; height:1350px; font-family:'Poppins',sans-serif;
  position:relative; overflow:hidden;
  background:#0a0a12;
}
.bg-photo {
  position:absolute; inset:0; width:100%; height:100%;
  background-image:url('../cover-photo.png');
  background-size:cover; background-position:center 15%;
}
.gradient-top {
  position:absolute; top:0; left:0; right:0; height:30%;
  background:linear-gradient(180deg, rgba(10,10,18,0.85) 0%, rgba(10,10,18,0) 100%);
}
.gradient-bottom {
  position:absolute; bottom:0; left:0; right:0; height:65%;
  background:linear-gradient(180deg, rgba(10,10,18,0) 0%, rgba(10,10,18,0.55) 30%, rgba(10,10,18,0.95) 72%, rgba(10,10,18,1) 100%);
}
.brand { position:absolute; top:60px; left:50px; }
.brand-main { font-size:40px; font-weight:900; color:white; letter-spacing:2px; text-shadow:0 2px 12px rgba(0,0,0,0.8); }
.brand-sub { font-size:24px; font-weight:800; color:#18A8F1; letter-spacing:6px; margin-top:-4px; text-shadow:0 2px 12px rgba(0,0,0,0.8); }
.headline-block {
  position:absolute; left:60px; right:60px; bottom:200px;
}
.name { font-size:34px; font-weight:800; color:#FDB03E; letter-spacing:4px; margin-bottom:16px; text-shadow:0 4px 16px rgba(0,0,0,0.8); }
.headline {
  font-size:88px; font-weight:900; color:white; line-height:0.98;
  letter-spacing:-2px; text-shadow:0 6px 24px rgba(0,0,0,0.85);
}
.credit { position:absolute; bottom:90px; left:60px; font-size:22px; font-weight:600; color:rgba(255,255,255,0.75); text-shadow:0 2px 8px rgba(0,0,0,0.8); }
.swipe { position:absolute; bottom:90px; right:60px; font-size:22px; font-weight:700; color:#FDB03E; text-shadow:0 2px 8px rgba(0,0,0,0.8); }
.play-btn {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:140px; height:140px; border-radius:50%;
  background:rgba(255,255,255,0.18);
  border:4px solid rgba(255,255,255,0.95);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 40px rgba(0,0,0,0.4), 0 0 0 12px rgba(255,255,255,0.08);
  backdrop-filter:blur(8px);
}
.play-btn::after {
  content:''; width:0; height:0;
  border-left:42px solid white;
  border-top:28px solid transparent;
  border-bottom:28px solid transparent;
  margin-left:10px;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,0.4));
}
</style></head>
<body>
  <div class="bg-photo"></div>
  <div class="gradient-top"></div>
  <div class="gradient-bottom"></div>
  <div class="brand"><div class="brand-main">SPECTRUM</div><div class="brand-sub">UNLOCKED</div></div>
  <div class="play-btn"></div>
  <div class="headline-block">
    <div class="name">PETE WRIGHT, ESQ.</div>
    <div class="headline">"Best Is A<br>Four-Letter Word"</div>
  </div>
  <div class="credit">via Wrightslaw.com</div>
  <div class="swipe">SWIPE →</div>
</body></html>
