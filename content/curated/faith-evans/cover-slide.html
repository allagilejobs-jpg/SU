<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Playfair+Display:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1350px; background: #0a0a12; font-family: 'Poppins', sans-serif; position: relative; overflow: hidden; }
    .main-photo { position: absolute; top: 0; left: 0; right: 0; height: 850px; background: url('cover-photo.png') center center / cover no-repeat; }
    .photo-overlay { position: absolute; top: 0; left: 0; right: 0; height: 850px; background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 55%, rgba(10,10,18,1) 100%); }
    .brand { position: absolute; top: 40px; left: 40px; z-index: 10; }
    .brand-main { font-size: 28px; font-weight: 900; color: white; letter-spacing: 1px; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
    .brand-sub { font-size: 20px; font-weight: 700; color: #E8B86D; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
    .slide-num { position: absolute; top: 40px; right: 40px; background: rgba(232,184,109,0.95); color: #1a1a2e; padding: 8px 18px; border-radius: 20px; font-size: 16px; font-weight: 800; }
    .headline-section { position: absolute; bottom: 110px; left: 40px; right: 40px; }
    .name { font-size: 36px; font-weight: 800; color: #E8B86D; margin-bottom: 18px; text-shadow: 2px 2px 10px rgba(0,0,0,0.9); letter-spacing: 1px; }
    .headline { font-family: 'Playfair Display', serif; font-size: 56px; font-weight: 900; color: white; line-height: 1.1; text-shadow: 2px 2px 12px rgba(0,0,0,0.9); }
    .headline .em { color: #E8B86D; font-style: italic; }
    .swipe { position: absolute; bottom: 40px; right: 40px; background: rgba(232,184,109,0.2); border: 2px solid #E8B86D; padding: 10px 22px; border-radius: 30px; font-size: 18px; font-weight: 700; color: #E8B86D; }
  </style>
</head>
<body>
  <div class="main-photo"></div>
  <div class="photo-overlay"></div>
  <div class="brand">
    <div class="brand-main">SPECTRUM</div>
    <div class="brand-sub">UNLOCKED</div>
  </div>
  <div class="slide-num">1 / 4</div>
  <div class="headline-section">
    <div class="name">FAITH EVANS</div>
    <div class="headline">"I Begged for<br>My Son's <span class="em">Diagnosis"</span></div>
  </div>
  <div class="swipe">Swipe →</div>
</body>
</html>
