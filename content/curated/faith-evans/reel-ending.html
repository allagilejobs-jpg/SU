<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Playfair+Display:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: linear-gradient(165deg, #2a004a 0%, #52008C 40%, #3a005f 100%); font-family: 'Poppins', sans-serif; color: white; padding: 100px 70px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    body::before { content: ''; position: absolute; top: -180px; right: -180px; width: 550px; height: 550px; background: #FDB03E; border-radius: 50%; opacity: 0.1; }
    body::after { content: ''; position: absolute; bottom: -130px; left: -130px; width: 450px; height: 450px; background: #18A8F1; border-radius: 50%; opacity: 0.1; }
    .brand { position: absolute; top: 60px; left: 60px; }
    .brand-main { font-size: 32px; font-weight: 900; color: white; letter-spacing: 1px; }
    .brand-sub { font-size: 22px; font-weight: 700; color: #FDB03E; letter-spacing: 2px; }
    .label { font-size: 24px; font-weight: 700; color: #18A8F1; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 40px; position: relative; z-index: 1; }
    .main-msg { font-family: 'Playfair Display', serif; font-size: 88px; font-weight: 900; line-height: 1.05; margin-bottom: 35px; max-width: 950px; position: relative; z-index: 1; }
    .main-msg .em { color: #FDB03E; font-style: italic; }
    .sub-msg { font-size: 32px; line-height: 1.45; max-width: 900px; opacity: 0.92; margin-bottom: 60px; position: relative; z-index: 1; }
    .actions { display: flex; gap: 70px; position: relative; z-index: 1; margin-bottom: 50px; }
    .action { display: flex; flex-direction: column; align-items: center; gap: 12px; font-size: 26px; font-weight: 700; }
    .action-icon { font-size: 64px; }
    .cta-box { background: linear-gradient(135deg, #FDB03E 0%, #E59A2A 100%); color: #2a004a; padding: 24px 50px; border-radius: 18px; position: relative; z-index: 1; }
    .cta-text { font-size: 28px; font-weight: 800; }
    .footer { position: absolute; bottom: 70px; }
    .handle { font-size: 26px; font-weight: 700; color: #FDB03E; }
  </style>
</head>
<body>
  <div class="brand">
    <div class="brand-main">SPECTRUM</div>
    <div class="brand-sub">UNLOCKED</div>
  </div>

  <div class="label">Faith's Mission</div>
  <div class="main-msg">No parent should<br>have to <span class="em">beg</span><br>alone.</div>
  <div class="sub-msg">Faith built Ryder's Room so other autism families<br>have someone walking the journey with them.</div>

  <div class="actions">
    <div class="action"><span class="action-icon">💾</span><span>Save</span></div>
    <div class="action"><span class="action-icon">📤</span><span>Share</span></div>
    <div class="action"><span class="action-icon">➕</span><span>Follow</span></div>
  </div>

  <div class="cta-box">
    <div class="cta-text">Tag an autism parent</div>
  </div>

  <div class="footer"><div class="handle">@spectrum_unlocked</div></div>
</body>
</html>
