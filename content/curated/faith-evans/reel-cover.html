<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Playfair+Display:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0a0a12; font-family: 'Poppins', sans-serif; position: relative; overflow: hidden; }
    .main-photo { position: absolute; top: 0; left: 0; right: 0; height: 1200px; background: url('cover-photo.png') center top / cover no-repeat; }
    .photo-overlay { position: absolute; top: 0; left: 0; right: 0; height: 1200px; background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 25%, rgba(0,0,0,0) 60%, rgba(10,10,18,1) 100%); }
    .bottom-bg { position: absolute; bottom: 0; left: 0; right: 0; height: 720px; background: linear-gradient(180deg, #0a0a12 0%, #52008C 50%, #3a005f 100%); }
    .bottom-bg::before { content: ''; position: absolute; top: -180px; right: -150px; width: 450px; height: 450px; background: #FDB03E; border-radius: 50%; opacity: 0.08; }
    .bottom-bg::after { content: ''; position: absolute; bottom: -100px; left: -100px; width: 350px; height: 350px; background: #18A8F1; border-radius: 50%; opacity: 0.08; }
    .brand { position: absolute; top: 60px; left: 60px; z-index: 10; }
    .brand-main { font-size: 36px; font-weight: 900; color: white; letter-spacing: 1px; text-shadow: 2px 2px 12px rgba(0,0,0,0.95); }
    .brand-sub { font-size: 24px; font-weight: 700; color: #FDB03E; text-shadow: 2px 2px 12px rgba(0,0,0,0.95); letter-spacing: 2px; }
    .badge { position: absolute; top: 70px; right: 60px; background: rgba(253, 176, 62, 0.97); color: #2a004a; padding: 12px 24px; border-radius: 30px; font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; z-index: 10; }
    .text-section { position: absolute; bottom: 220px; left: 60px; right: 60px; z-index: 5; }
    .name { font-size: 38px; font-weight: 800; color: #FDB03E; margin-bottom: 22px; letter-spacing: 2px; text-shadow: 2px 2px 10px rgba(0,0,0,0.9); }
    .headline { font-family: 'Playfair Display', serif; font-size: 78px; font-weight: 900; color: white; line-height: 1.05; text-shadow: 2px 2px 14px rgba(0,0,0,0.95); }
    .headline .em { color: #FDB03E; font-style: italic; }
    .footer { position: absolute; bottom: 70px; left: 60px; right: 60px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .credit { font-size: 22px; font-weight: 600; color: white; opacity: 0.85; }
    .handle { font-size: 22px; font-weight: 700; color: #FDB03E; }
  </style>
</head>
<body>
  <div class="main-photo"></div>
  <div class="photo-overlay"></div>
  <div class="bottom-bg"></div>

  <div class="brand">
    <div class="brand-main">SPECTRUM</div>
    <div class="brand-sub">UNLOCKED</div>
  </div>
  <div class="badge">Watch</div>

  <div class="text-section">
    <div class="name">FAITH EVANS</div>
    <div class="headline">"I had to <span class="em">BEG</span><br>for my son's<br>diagnosis."</div>
  </div>

  <div class="footer">
    <div class="credit">🎥 Tamron Hall Show</div>
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
