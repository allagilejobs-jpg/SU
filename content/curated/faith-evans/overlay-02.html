<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #00ff00; font-family: 'Poppins', sans-serif; position: relative; }
    .brand { position: absolute; top: 60px; left: 50px; }
    .brand-main { font-size: 32px; font-weight: 900; color: white; letter-spacing: 1px; text-shadow: 2px 2px 8px rgba(0,0,0,0.9); }
    .brand-sub { font-size: 22px; font-weight: 700; color: #E8B86D; letter-spacing: 2px; text-shadow: 2px 2px 8px rgba(0,0,0,0.9); }
    .headline-box { position: absolute; top: 180px; left: 50%; transform: translateX(-50%); background: rgba(232, 184, 109, 0.97); padding: 22px 38px; border-radius: 12px; max-width: 960px; text-align: center; box-shadow: 0 6px 25px rgba(0,0,0,0.5); }
    .headline { font-size: 32px; font-weight: 800; color: #1a1a2e; line-height: 1.3; }
    .credit { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: 700; color: white; text-shadow: 2px 2px 8px rgba(0,0,0,0.9); }
    .handle { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 600; color: #E8B86D; text-shadow: 2px 2px 8px rgba(0,0,0,0.9); }
  </style>
</head>
<body>
  <div class="brand">
    <div class="brand-main">SPECTRUM</div>
    <div class="brand-sub">UNLOCKED</div>
  </div>
  <div class="headline-box">
    <div class="headline">"Why I started Ryder's Room"</div>
  </div>
  <div class="credit">🎥 Faith Evans on Tamron Hall</div>
  <div class="handle">@spectrum_unlocked</div>
</body>
</html>
