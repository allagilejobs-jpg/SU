<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #00ff00;
      font-family: 'Poppins', sans-serif;
      position: relative;
    }
    .brand {
      position: absolute;
      top: 60px;
      left: 50px;
    }
    .brand-main {
      font-size: 28px;
      font-weight: 900;
      color: white;
      letter-spacing: 1px;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
    }
    .brand-sub {
      font-size: 20px;
      font-weight: 700;
      color: #4A90A4;
      letter-spacing: 1px;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
    }
    .headline-box {
      position: absolute;
      top: 160px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 18px 30px;
      border-radius: 8px;
      max-width: 950px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .headline {
      font-size: 22px;
      font-weight: 800;
      color: #1a1a2e;
      line-height: 1.35;
    }
    .credit {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      font-weight: 600;
      color: white;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <div class="brand">
    <div class="brand-main">SPECTRUM</div>
    <div class="brand-sub">UNLOCKED</div>
  </div>
  <div class="headline-box">
    <div class="headline">
      RJ Peete Asks His Mom:<br>
      "Do I Have Autism Still?"
    </div>
  </div>
  <div class="credit">🎥 Holly Robinson Peete via OWN</div>
</body>
</html>
