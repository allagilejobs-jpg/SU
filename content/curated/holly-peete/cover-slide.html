<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1350px;
      background: #0a0a12;
      font-family: 'Poppins', sans-serif;
      position: relative;
      overflow: hidden;
    }
    
    .main-photo {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 850px;
      background: url('cover-photo.png') center center / cover no-repeat;
    }
    
    .photo-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 850px;
      background: linear-gradient(180deg, 
        rgba(0,0,0,0.3) 0%, 
        rgba(0,0,0,0) 30%,
        rgba(0,0,0,0) 60%,
        rgba(10,10,18,1) 100%);
    }
    
    .brand {
      position: absolute;
      top: 40px;
      left: 40px;
      z-index: 10;
    }
    .brand-main {
      font-size: 26px;
      font-weight: 900;
      color: white;
      letter-spacing: 1px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
    }
    .brand-sub {
      font-size: 18px;
      font-weight: 700;
      color: #18A8F1;
      background: rgba(0,0,0,0.4);
      padding: 2px 8px;
      display: inline-block;
    }
    
    .slide-num {
      position: absolute;
      top: 40px;
      right: 40px;
      background: rgba(0,0,0,0.6);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: 600;
      color: white;
    }
    
    .headline-section {
      position: absolute;
      bottom: 100px;
      left: 40px;
      right: 40px;
    }
    
    .name {
      font-size: 36px;
      font-weight: 800;
      color: #FDB03E;
      margin-bottom: 15px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
    }
    
    .headline {
      font-size: 44px;
      font-weight: 900;
      color: white;
      line-height: 1.15;
      text-transform: uppercase;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
    }
    
    .swipe {
      position: absolute;
      bottom: 40px;
      right: 40px;
      width: 70px;
      height: 35px;
      border: 2px solid rgba(255,255,255,0.6);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.6);
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="main-photo"></div>
  <div class="photo-overlay"></div>
  
  <div class="brand">
    <div class="brand-main">SPECTRUM</div>
    <div class="brand-sub">UNLOCKED</div>
  </div>
  
<div class="headline-section">
    <div class="name">RJ PEETE</div>
    <div class="headline">
      "DO I HAVE<br>
      AUTISM STILL?"
    </div>
  </div>
  
  <div class="swipe">→</div>
</body>
</html>
