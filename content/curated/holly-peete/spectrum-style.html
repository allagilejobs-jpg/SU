<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #000;
      font-family: 'Poppins', sans-serif;
      position: relative;
      overflow: hidden;
    }
    
    .video-area {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #00ff00;
    }
    
    .gradient-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 450px;
      background: linear-gradient(180deg, 
        rgba(0,0,0,0.9) 0%,
        rgba(0,0,0,0.7) 40%,
        transparent 100%);
    }
    
    .gradient-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 500px;
      background: linear-gradient(0deg, 
        rgba(0,0,0,0.95) 0%,
        rgba(0,0,0,0.8) 40%,
        transparent 100%);
    }
    
    .accent-line {
      position: absolute;
      top: 60px;
      left: 60px;
      width: 80px;
      height: 4px;
      background: linear-gradient(90deg, #4A90A4, #E8B86D);
      border-radius: 2px;
    }
    
    .brand {
      position: absolute;
      top: 85px;
      left: 60px;
    }
    
    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 800;
      color: white;
      letter-spacing: 3px;
    }
    
    .brand-tag {
      font-size: 14px;
      font-weight: 600;
      color: #4A90A4;
      letter-spacing: 4px;
      margin-top: 5px;
    }
    
    .quote-section {
      position: absolute;
      top: 200px;
      left: 60px;
      right: 60px;
    }
    
    .quote-mark {
      font-family: 'Playfair Display', serif;
      font-size: 120px;
      color: #E8B86D;
      opacity: 0.4;
      line-height: 0.5;
    }
    
    .quote-text {
      font-family: 'Playfair Display', serif;
      font-size: 44px;
      font-weight: 700;
      color: white;
      line-height: 1.3;
      margin-top: -20px;
    }
    
    .bottom-content {
      position: absolute;
      bottom: 60px;
      left: 60px;
      right: 60px;
    }
    
    .person-name {
      font-size: 28px;
      font-weight: 800;
      color: #E8B86D;
      margin-bottom: 8px;
    }
    
    .context {
      font-size: 18px;
      font-weight: 500;
      color: rgba(255,255,255,0.8);
      margin-bottom: 25px;
    }
    
    .divider {
      width: 60px;
      height: 2px;
      background: rgba(255,255,255,0.3);
      margin-bottom: 25px;
    }
    
    .credit {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="video-area"></div>
  
  <div class="gradient-top"></div>
  <div class="gradient-bottom"></div>
  
  <div class="accent-line"></div>
  <div class="brand">
    <div class="brand-name">SPECTRUM</div>
    <div class="brand-tag">UNLOCKED</div>
  </div>
  
  <div class="quote-section">
    <div class="quote-mark">"</div>
    <div class="quote-text">Do I have<br>autism still?</div>
  </div>
  
  <div class="bottom-content">
    <div class="person-name">RJ PEETE</div>
    <div class="context">A powerful conversation with his mom</div>
    <div class="divider"></div>
    <div class="credit">📍 HOLLY ROBINSON PEETE VIA OWN</div>
  </div>
</body>
</html>
