<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 180px;
      background: linear-gradient(180deg, #0d1117 0%, #0d1117 85%, transparent 100%);
      font-family: 'Poppins', sans-serif;
      position: relative;
      padding: 35px 40px;
    }
    
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }
    
    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #4A90A4 0%, #E8B86D 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    
    .brand-text .brand-main {
      font-size: 22px;
      font-weight: 900;
      color: white;
      letter-spacing: 2px;
    }
    
    .brand-text .brand-sub {
      font-size: 12px;
      font-weight: 700;
      color: #4A90A4;
      letter-spacing: 3px;
    }
    
    .headline {
      font-size: 24px;
      font-weight: 800;
      color: white;
      line-height: 1.2;
    }
    
    .headline .name { color: #E8B86D; }
  </style>
</head>
<body>
  <div class="brand">
    <div class="brand-icon">🧩</div>
    <div class="brand-text">
      <div class="brand-main">SPECTRUM</div>
      <div class="brand-sub">UNLOCKED</div>
    </div>
  </div>
  <div class="headline">
    <span class="name">RJ Peete</span> Asks His Mom:<br>"Do I Have Autism Still?"
  </div>
</body>
</html>
