<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1350px;
      background: linear-gradient(180deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
      font-family: 'Poppins', sans-serif;
      position: relative;
      overflow: hidden;
    }
    
    .glow-circle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(74,144,164,0.15) 0%, transparent 70%);
    }
    .glow-1 { width: 300px; height: 300px; top: -80px; left: -80px; }
    .glow-2 { width: 250px; height: 250px; bottom: -60px; right: -60px; }
    .glow-3 { top: 40%; left: 50%; transform: translate(-50%, -50%); width: 600px; height: 600px; background: radial-gradient(circle, rgba(232,184,109,0.06) 0%, transparent 70%); }
    
    .top-section {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 180px;
      padding: 35px 40px;
    }
    
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }
    
    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #4A90A4 0%, #E8B86D 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    
    .brand-text .brand-main {
      font-size: 22px;
      font-weight: 900;
      color: white;
      letter-spacing: 2px;
    }
    
    .brand-text .brand-sub {
      font-size: 12px;
      font-weight: 700;
      color: #4A90A4;
      letter-spacing: 3px;
    }
    
    .headline {
      font-size: 24px;
      font-weight: 800;
      color: white;
      line-height: 1.2;
    }
    
    .headline .name { color: #E8B86D; }
    
    .video-area {
      position: absolute;
      top: 180px;
      left: 30px;
      right: 30px;
      height: 800px;
      background: #00ff00;
      border-radius: 16px;
    }
    
    .video-frame {
      position: absolute;
      top: 176px;
      left: 26px;
      right: 26px;
      height: 808px;
      border: 2px solid rgba(74,144,164,0.4);
      border-radius: 20px;
      pointer-events: none;
    }
    
    .bottom-section {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 190px;
      padding: 30px 40px;
    }
    
    .credit {
      font-size: 15px;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
      margin-bottom: 15px;
    }
    
    .cta {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    .cta-text {
      font-size: 16px;
      font-weight: 700;
      color: white;
    }
    
    .swipe-arrow {
      font-size: 18px;
      color: #E8B86D;
      padding: 8px 16px;
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>
  <div class="glow-circle glow-1"></div>
  <div class="glow-circle glow-2"></div>
  <div class="glow-circle glow-3"></div>
  
  <div class="top-section">
    <div class="brand">
      <div class="brand-icon">🧩</div>
      <div class="brand-text">
        <div class="brand-main">SPECTRUM</div>
        <div class="brand-sub">UNLOCKED</div>
      </div>
    </div>
    <div class="headline">
      <span class="name">RJ Peete</span> Asks His Mom:<br>"Do I Have Autism Still?"
    </div>
  </div>
  
  <div class="video-frame"></div>
  <div class="video-area"></div>
  
  <div class="bottom-section">
    <div class="credit">🎥 Holly Robinson Peete via OWN</div>
    <div class="cta">
      <div class="cta-text">Swipe for the full clip</div>
      <div class="swipe-arrow">→</div>
    </div>
  </div>
</body>
</html>
