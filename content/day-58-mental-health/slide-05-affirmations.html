<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1350px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 50%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 500px; height: 500px; background: #52008C; top: -150px; left: -150px; }
    .bg-shape-2 { width: 350px; height: 350px; background: #18A8F1; bottom: 100px; right: -100px; }
    .label { 
      font-size: 16px; 
      text-transform: uppercase; 
      letter-spacing: 4px; 
      opacity: 0.5;
      margin-bottom: 30px;
    }
    .title { 
      font-family: 'Playfair Display', serif;
      font-size: 44px; 
      font-weight: 800; 
      color: #52008C;
      margin-bottom: 50px;
    }
    .affirmation {
      font-size: 30px;
      line-height: 1.6;
      max-width: 850px;
      margin-bottom: 22px;
      padding: 18px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .affirmation:last-of-type {
      border-bottom: none;
    }
    .affirmation .emoji {
      font-size: 34px;
      margin-right: 15px;
    }
    .highlight { color: #18A8F1; }
    .highlight-gold { color: #FDB03E; }
    .highlight-green { color: #18A8F1; }
    .highlight-purple { color: #52008C; }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .slide-num { font-size: 16px; opacity: 0.4; letter-spacing: 2px; margin-bottom: 8px; }
    .handle { font-size: 18px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  
  <div class="label">Remind Yourself</div>
  
  <div class="title">Mental Health Truths</div>
  
  <div class="affirmation">
    <span class="emoji">💜</span>My struggles are <span class="highlight-purple">real</span>, not excuses
  </div>
  
  <div class="affirmation">
    <span class="emoji">🔋</span>Needing rest is <span class="highlight">not weakness</span>
  </div>
  
  <div class="affirmation">
    <span class="emoji">🌧️</span>Hard days don't erase <span class="highlight-gold">progress</span>
  </div>
  
  <div class="affirmation">
    <span class="emoji">🧠</span>I deserve <span class="highlight-green">support</span> that fits my brain
  </div>
  
  <div class="affirmation">
    <span class="emoji">✨</span>Healing isn't linear. <span class="highlight-purple">Neither am I.</span>
  </div>
  
  <div class="footer">
    <div class="slide-num">4 of 5</div>
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
