<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #2a004a 0%, #0d1b2a 50%, #1f0033 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }
    .emoji { font-size: 120px; margin-bottom: 40px; }
    .main {
      font-size: 68px;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 40px;
    }
    .main span { color: #FDB03E; }
    .sub {
      font-size: 40px;
      opacity: 0.9;
      max-width: 850px;
    }
    .stat {
      margin-top: 50px;
      background: rgba(204, 120, 203, 0.15);
      border: 2px solid #CC78CB;
      padding: 25px 50px;
      border-radius: 20px;
      font-size: 32px;
      font-weight: 600;
    }
    .swipe {
      position: absolute;
      bottom: 120px;
      font-size: 28px;
      font-weight: 600;
      color: #18A8F1;
    }
    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="emoji">😴💤</div>
    <div class="main">
      Sleep Issues<br>in <span>Autism</span>
    </div>
    <div class="sub">
      Melatonin isn't the only answer
    </div>
    <div class="stat">
      ⚠️ 80% of autistic kids have sleep problems
    </div>
    <div class="swipe">Swipe for what actually helps →</div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
