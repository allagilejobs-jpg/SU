<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #2a004a 0%, #0d1b2a 50%, #0a1628 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }
    .emoji { font-size: 100px; margin-bottom: 40px; }
    .message {
      font-size: 52px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 50px;
    }
    .message span { color: #FDB03E; }
    .question {
      background: linear-gradient(135deg, #18A8F1 0%, #3a7a8e 100%);
      padding: 40px 60px;
      border-radius: 25px;
      font-size: 40px;
      font-weight: 700;
      margin-bottom: 40px;
    }
    .note {
      font-size: 32px;
      opacity: 0.8;
      margin-bottom: 50px;
    }
    .actions {
      display: flex;
      gap: 50px;
      font-size: 32px;
      font-weight: 600;
    }
    .action {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .action-icon { font-size: 50px; }
    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 28px;
      font-weight: 700;
      color: #FDB03E;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="emoji">🌙✨</div>
    <div class="message">
      Better sleep = <span>better days</span><br>for everyone
    </div>
    <div class="question">What helps YOUR child sleep? 💬</div>
    <div class="note">
      💡 If nothing works, talk to your pediatrician about a sleep study
    </div>
    <div class="actions">
      <div class="action">
        <span class="action-icon">💾</span>
        <span>Save</span>
      </div>
      <div class="action">
        <span class="action-icon">📤</span>
        <span>Share</span>
      </div>
      <div class="action">
        <span class="action-icon">➕</span>
        <span>Follow</span>
      </div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
