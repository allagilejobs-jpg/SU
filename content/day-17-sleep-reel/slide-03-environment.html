<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #0d1b2a 50%, #0a1628 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      position: relative;
    }
    .label {
      font-size: 28px;
      font-weight: 700;
      color: #27AE60;
      letter-spacing: 4px;
      margin-bottom: 20px;
    }
    .title {
      font-size: 56px;
      font-weight: 800;
      margin-bottom: 50px;
    }
    .title span { color: #E8B86D; }
    .tips {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }
    .tip {
      background: rgba(39,174,96,0.12);
      padding: 30px 40px;
      border-radius: 20px;
      font-size: 36px;
      display: flex;
      align-items: center;
      gap: 25px;
    }
    .tip-icon { font-size: 45px; }
    .brand {
      position: absolute;
      bottom: 40px;
      left: 60px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">TIP #1</div>
    <div class="title">Optimize the <span>Environment</span></div>
    <div class="tips">
      <div class="tip"><span class="tip-icon">🌑</span> Blackout curtains (complete dark)</div>
      <div class="tip"><span class="tip-icon">🔇</span> White noise machine</div>
      <div class="tip"><span class="tip-icon">❄️</span> Cool room (65-68°F)</div>
      <div class="tip"><span class="tip-icon">🛏️</span> Weighted blanket</div>
      <div class="tip"><span class="tip-icon">📵</span> No screens 1 hour before bed</div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
