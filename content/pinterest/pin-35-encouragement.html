<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1000px;
      height: 1500px;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, #2a004a 0%, #52008C 100%);
      color: white;
      padding: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    
    .badge {
      display: inline-block;
      background: #FDB03E;
      color: #2a004a;
      padding: 10px 25px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 50px;
    }
    
    .main-quote {
      font-family: 'Playfair Display', serif;
      font-size: 54px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 50px;
      max-width: 850px;
    }
    .main-quote span { color: #FDB03E; }
    
    .divider {
      width: 100px;
      height: 4px;
      background: linear-gradient(90deg, #18A8F1, #FDB03E);
      border-radius: 2px;
      margin-bottom: 50px;
    }
    
    .sub-text {
      font-size: 24px;
      color: #aaa;
      max-width: 700px;
      line-height: 1.6;
      margin-bottom: 60px;
    }
    
    .affirmations {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 60px;
    }
    .affirmation {
      font-size: 22px;
      color: #ddd;
    }
    .affirmation span {
      display: inline-block;
      width: 30px;
      height: 30px;
      background: #18A8F1;
      border-radius: 50%;
      margin-right: 15px;
      line-height: 30px;
      font-size: 16px;
    }
    
    .footer {
      margin-top: auto;
      padding-top: 40px;
      border-top: 1px solid rgba(255,255,255,0.1);
      width: 100%;
    }
    .cta {
      font-size: 20px;
      font-weight: 700;
      color: #FDB03E;
      margin-bottom: 15px;
    }
    .brand {
      font-size: 16px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="badge">💛 For You</div>
  
  <div class="main-quote">
    You're doing <span>better</span> than you think.
  </div>
  
  <div class="divider"></div>
  
  <div class="sub-text">
    The fact that you're here — searching, learning, advocating — that's love in action.
  </div>
  
  <div class="affirmations">
    <div class="affirmation"><span>✓</span> Your child is lucky to have you</div>
    <div class="affirmation"><span>✓</span> You don't have to be perfect</div>
    <div class="affirmation"><span>✓</span> Asking for help is strength</div>
    <div class="affirmation"><span>✓</span> You are not alone in this</div>
  </div>
  
  <div class="footer">
    <div class="cta">💾 Save for the hard days</div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
