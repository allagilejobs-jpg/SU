<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 80px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 500px; height: 500px; background: #27AE60; top: -150px; left: -150px; }
    .bg-shape-2 { width: 400px; height: 400px; background: #E8B86D; bottom: -100px; right: -100px; }
    .win-badge {
      background: #27AE60;
      padding: 12px 30px; border-radius: 30px;
      font-size: 18px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 3px;
      margin-bottom: 40px;
    }
    .quote-mark {
      font-size: 120px;
      color: #E8B86D;
      opacity: 0.3;
      font-family: 'Playfair Display', serif;
      line-height: 1;
      margin-bottom: 20px;
    }
    .quote-text {
      font-family: 'Playfair Display', serif;
      font-size: 50px;
      font-weight: 700;
      font-style: italic;
      line-height: 1.3;
      max-width: 900px;
      margin-bottom: 50px;
    }
    .quote-text .gold { color: #E8B86D; }
    .quote-text .green { color: #27AE60; }
    .attribution {
      font-size: 22px;
      opacity: 0.6;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .handle { font-size: 20px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>

  <div class="win-badge">🏆 THIS WEEK'S WIN</div>

  <div class="quote-mark">"</div>

  <div class="quote-text">
    A year ago I didn't know what an <span class="gold">IEP</span> was. Now I <span class="green">run the meeting</span>.
  </div>

  <div class="attribution">— Spectrum Unlocked Community Member</div>

  <div class="footer">
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
