<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #0a0a15 0%, #52008C 40%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 80px 60px;
      position: relative; overflow: hidden;
    }
    body::before {
      content: ''; position: absolute;
      top: -150px; left: -150px;
      width: 400px; height: 400px;
      background: #FDB03E; border-radius: 50%;
      opacity: 0.08;
    }
    body::after {
      content: ''; position: absolute;
      bottom: -100px; right: -100px;
      width: 350px; height: 350px;
      background: #18A8F1; border-radius: 50%;
      opacity: 0.08;
    }
    .label {
      font-size: 26px; font-weight: 700;
      color: #18A8F1;
      text-transform: uppercase; letter-spacing: 4px;
      margin-bottom: 35px;
      position: relative; z-index: 1;
    }
    .title {
      font-family: 'Playfair Display', serif;
      font-size: 76px; font-weight: 800;
      color: #FDB03E;
      margin-bottom: 55px;
      line-height: 1.05;
      position: relative; z-index: 1;
    }
    .list {
      max-width: 900px;
      width: 100%;
      position: relative; z-index: 1;
    }
    .item {
      display: flex; align-items: center; gap: 28px;
      background: rgba(24, 168, 241, 0.12);
      border-left: 6px solid #18A8F1;
      border-radius: 14px;
      padding: 28px 36px;
      margin-bottom: 22px;
      text-align: left;
    }
    .item-num {
      font-family: 'Playfair Display', serif;
      font-size: 52px;
      font-weight: 900;
      color: #FDB03E;
      line-height: 1;
      flex-shrink: 0;
      min-width: 60px;
    }
    .item-text {
      font-size: 36px;
      font-weight: 600;
      flex: 1;
    }
    .footer { position: absolute; bottom: 60px; }
    .handle { font-size: 24px; opacity: 0.5; font-weight: 600; }
  </style>
</head>
<body>
  <div class="label">Why It Happens</div>
  <div class="title">No Safety<br>Net.</div>

  <div class="list">
    <div class="item"><div class="item-num">01</div><div class="item-text">No diagnosis</div></div>
    <div class="item"><div class="item-num">02</div><div class="item-text">No services</div></div>
    <div class="item"><div class="item-num">03</div><div class="item-text">Deep stigma</div></div>
    <div class="item"><div class="item-num">04</div><div class="item-text">No one who understood</div></div>
  </div>

  <div class="footer"><div class="handle">@spectrum_unlocked</div></div>
</body>
</html>
