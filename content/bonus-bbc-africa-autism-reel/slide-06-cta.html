<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #0a0a15 0%, #52008C 40%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 80px 60px;
      position: relative; overflow: hidden;
    }
    body::before {
      content: ''; position: absolute;
      top: -150px; right: -150px;
      width: 400px; height: 400px;
      background: #FDB03E; border-radius: 50%;
      opacity: 0.1;
    }
    body::after {
      content: ''; position: absolute;
      bottom: -100px; left: -100px;
      width: 350px; height: 350px;
      background: #18A8F1; border-radius: 50%;
      opacity: 0.1;
    }
    .label {
      font-size: 26px; font-weight: 700;
      color: #18A8F1;
      text-transform: uppercase; letter-spacing: 4px;
      margin-bottom: 40px;
      position: relative; z-index: 1;
    }
    .commands {
      display: flex; flex-direction: column; gap: 28px;
      margin-bottom: 55px;
      position: relative; z-index: 1;
    }
    .cmd {
      font-family: 'Playfair Display', serif;
      font-size: 96px;
      font-weight: 900;
      color: #FDB03E;
      line-height: 1;
    }
    .cmd.red { color: #CC78CB; }
    .divider {
      width: 120px;
      height: 4px;
      background: linear-gradient(90deg, #FDB03E, #18A8F1);
      margin: 45px auto;
      border-radius: 2px;
      position: relative; z-index: 1;
    }
    .closing {
      font-size: 40px;
      line-height: 1.3;
      max-width: 900px;
      font-weight: 500;
      position: relative; z-index: 1;
      margin-bottom: 30px;
    }
    .closing strong { color: #FDB03E; font-weight: 800; }
    .action-row {
      display: flex; gap: 45px;
      position: relative; z-index: 1;
      margin-top: 30px;
    }
    .action {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      font-size: 24px; font-weight: 700;
    }
    .action-icon { font-size: 50px; }
    .footer { position: absolute; bottom: 55px; }
    .handle { font-size: 28px; opacity: 0.7; font-weight: 800; color: #FDB03E; }
  </style>
</head>
<body>
  <div class="label">Don't Look Away</div>

  <div class="commands">
    <div class="cmd">Watch.</div>
    <div class="cmd">Share.</div>
    <div class="cmd red">Speak up.</div>
  </div>

  <div class="divider"></div>

  <div class="closing">
    Every autistic child deserves to be seen.<br>
    <strong>Even the ones behind locked doors.</strong>
  </div>

  <div class="action-row">
    <div class="action"><span class="action-icon">💾</span><span>Save</span></div>
    <div class="action"><span class="action-icon">📤</span><span>Share</span></div>
    <div class="action"><span class="action-icon">➕</span><span>Follow</span></div>
  </div>

  <div class="footer"><div class="handle">@spectrum_unlocked</div></div>
</body>
</html>
