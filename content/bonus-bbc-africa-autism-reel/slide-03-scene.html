<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #0a0a15 0%, #16213e 40%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 80px 60px;
      position: relative; overflow: hidden;
    }
    body::before {
      content: ''; position: absolute;
      top: -150px; right: -150px;
      width: 400px; height: 400px;
      background: #E74C3C; border-radius: 50%;
      opacity: 0.08;
    }
    body::after {
      content: ''; position: absolute;
      bottom: -100px; left: -100px;
      width: 350px; height: 350px;
      background: #1a1a2e; border-radius: 50%;
      opacity: 0.15;
    }
    .label {
      font-size: 26px; font-weight: 700;
      color: #E74C3C;
      text-transform: uppercase; letter-spacing: 4px;
      margin-bottom: 45px;
      position: relative; z-index: 1;
    }
    .lines {
      font-family: 'Playfair Display', serif;
      font-size: 82px; font-weight: 800;
      line-height: 1.15;
      max-width: 950px;
      position: relative; z-index: 1;
      margin-bottom: 55px;
    }
    .lines .em { color: #E8B86D; font-style: italic; }
    .pause {
      display: block;
      height: 18px;
    }
    .tagline {
      font-size: 36px;
      font-style: italic;
      opacity: 0.9;
      position: relative; z-index: 1;
      max-width: 880px;
      line-height: 1.3;
    }
    .footer { position: absolute; bottom: 60px; }
    .handle { font-size: 24px; opacity: 0.5; font-weight: 600; }
  </style>
</head>
<body>
  <div class="label">The Scene</div>

  <div class="lines">
    A boy.<span class="pause"></span>
    A room.<span class="pause"></span>
    <span class="em">A locked door.</span>
  </div>

  <div class="tagline">I haven't stopped<br>thinking about him.</div>

  <div class="footer"><div class="handle">@spectrum_unlocked</div></div>
</body>
</html>
