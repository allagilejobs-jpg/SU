<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #0a0a15 0%, #52008C 40%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 80px 60px;
      position: relative; overflow: hidden;
    }
    .slide::before, body::before {
      content: ''; position: absolute;
      top: -150px; right: -150px;
      width: 400px; height: 400px;
      background: #FDB03E; border-radius: 50%;
      opacity: 0.08;
    }
    body::after {
      content: ''; position: absolute;
      bottom: -100px; left: -100px;
      width: 350px; height: 350px;
      background: #CC78CB; border-radius: 50%;
      opacity: 0.08;
    }
    .eyebrow {
      font-size: 26px; font-weight: 700;
      color: #18A8F1;
      text-transform: uppercase; letter-spacing: 4px;
      margin-bottom: 40px;
      position: relative; z-index: 1;
    }
    .hook {
      font-family: 'Playfair Display', serif;
      font-size: 110px; font-weight: 900;
      line-height: 1.0;
      margin-bottom: 50px;
      position: relative; z-index: 1;
    }
    .hook .em { color: #FDB03E; font-style: italic; }
    .sub {
      font-size: 38px;
      max-width: 850px;
      line-height: 1.35;
      opacity: 0.85;
      position: relative; z-index: 1;
    }
    .tag {
      position: absolute;
      top: 80px;
      background: rgba(253, 176, 62, 0.12);
      border: 2px solid rgba(253, 176, 62, 0.45);
      border-radius: 40px;
      padding: 14px 32px;
      font-size: 22px; font-weight: 700;
      letter-spacing: 2px;
      color: #FDB03E;
      text-transform: uppercase;
    }
    .footer { position: absolute; bottom: 60px; }
    .handle { font-size: 24px; opacity: 0.5; font-weight: 600; }
  </style>
</head>
<body>
  <div class="tag">BBC Africa Eye</div>

  <div class="eyebrow">A Documentary</div>
  <div class="hook">
    One Scene<br>
    <span class="em">I Can't</span><br>
    <span class="em">Unsee.</span>
  </div>
  <div class="sub">This is what autism looks like<br>when there's no help.</div>

  <div class="footer"><div class="handle">@spectrum_unlocked</div></div>
</body>
</html>
