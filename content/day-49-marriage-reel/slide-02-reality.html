<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }
    
    .label {
      font-size: 28px;
      font-weight: 600;
      color: #4A90A4;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }
    
    .title {
      font-size: 52px;
      font-weight: 800;
      color: #E8B86D;
      margin-bottom: 50px;
    }
    
    .list {
      text-align: left;
      font-size: 36px;
      line-height: 2;
    }
    
    .list-item {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 10px;
    }
    
    .emoji {
      font-size: 36px;
    }
    
    .note {
      margin-top: 50px;
      font-size: 32px;
      opacity: 0.8;
      font-style: italic;
    }
    
    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">Let's Be Honest</div>
    <div class="title">The Strain Is Real</div>
    <div class="list">
      <div class="list-item"><span class="emoji">😴</span> Chronic exhaustion</div>
      <div class="list-item"><span class="emoji">💰</span> Financial stress from therapies</div>
      <div class="list-item"><span class="emoji">🎯</span> Different parenting approaches</div>
      <div class="list-item"><span class="emoji">💔</span> Grief processed differently</div>
      <div class="list-item"><span class="emoji">⏰</span> No time left for each other</div>
    </div>
    <div class="note">This doesn't mean your marriage is failing.</div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
