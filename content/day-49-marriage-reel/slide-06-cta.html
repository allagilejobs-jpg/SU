<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .slide {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 40%, #3a005f 100%);
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }

    .recap {
      font-size: 32px;
      font-weight: 600;
      color: #18A8F1;
      margin-bottom: 40px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .list {
      text-align: left;
      font-size: 40px;
      line-height: 2;
      margin-bottom: 60px;
    }

    .list-item {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .check {
      color: #18A8F1;
      font-weight: 700;
    }

    .cta-box {
      background: linear-gradient(135deg, #FDB03E 0%, #E59A2A 100%);
      color: #2a004a;
      padding: 50px 80px;
      border-radius: 30px;
      margin-bottom: 50px;
    }

    .cta-box .main {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .cta-box .sub {
      font-size: 32px;
      font-weight: 600;
      opacity: 0.9;
    }

    .actions {
      display: flex;
      gap: 60px;
      font-size: 36px;
      font-weight: 600;
    }

    .action {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .action-icon {
      font-size: 60px;
    }

    .brand {
      position: absolute;
      bottom: 40px;
      font-size: 28px;
      font-weight: 700;
      color: #FDB03E;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="recap">Quick Recap</div>
    <div class="list">
      <div class="list-item"><span class="check">✓</span> The strain is real</div>
      <div class="list-item"><span class="check">✓</span> Schedule connection</div>
      <div class="list-item"><span class="check">✓</span> Get on the same team</div>
      <div class="list-item"><span class="check">✓</span> Consider therapy</div>
    </div>
    <div class="cta-box">
      <div class="main">What keeps your relationship strong?</div>
      <div class="sub">Share below! 👇</div>
    </div>
    <div class="actions">
      <div class="action">
        <span class="action-icon">💾</span>
        <span>Save</span>
      </div>
      <div class="action">
        <span class="action-icon">📤</span>
        <span>Share</span>
      </div>
      <div class="action">
        <span class="action-icon">➕</span>
        <span>Follow</span>
      </div>
    </div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
