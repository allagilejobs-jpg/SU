<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide { width: 1080px; height: 1350px; background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%); padding: 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Poppins', sans-serif; color: white; text-align: center; position: relative; overflow: hidden; }
    .slide::before { content: ''; position: absolute; top: -100px; right: -100px; width: 300px; height: 300px; background: #E8B86D; border-radius: 50%; opacity: 0.08; }
    .slide::after { content: ''; position: absolute; bottom: -80px; left: -80px; width: 200px; height: 200px; background: #4A90A4; border-radius: 50%; opacity: 0.06; }
    .quote-mark { font-size: 120px; color: #E8B86D; opacity: 0.3; line-height: 1; position: relative; z-index: 1; }
    .quote-text { font-family: 'Playfair Display', serif; font-size: 52px; font-weight: 700; font-style: italic; line-height: 1.3; max-width: 900px; position: relative; z-index: 1; margin: 20px 0 30px; }
    .attribution { font-size: 22px; opacity: 0.7; position: relative; z-index: 1; margin-bottom: 40px; }
    .context { font-size: 24px; opacity: 0.85; max-width: 850px; line-height: 1.6; position: relative; z-index: 1; }
    .brand { position: absolute; bottom: 30px; font-size: 16px; font-weight: 600; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="quote-mark">"</div>
    <div class="quote-text">The hardest transition isn't September.<br>It's June.</div>
    <div class="attribution">— @spectrum_unlocked</div>
    <div class="context">Losing routine. Losing services. Losing structure. June doesn't feel like freedom — it feels like freefall. And nobody talks about that.</div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
