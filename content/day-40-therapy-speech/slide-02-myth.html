<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1350px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 400px; height: 400px; background: #E8B86D; top: -100px; left: -100px; }
    .bg-shape-2 { width: 300px; height: 300px; background: #4A90A4; bottom: 150px; right: -80px; }
    .header { 
      font-family: 'Playfair Display', serif; 
      font-size: 46px; 
      font-weight: 800; 
      margin-bottom: 50px;
    }
    .highlight { color: #E8B86D; }
    .myth-box {
      background: rgba(255,255,255,0.05);
      border-radius: 30px;
      padding: 45px;
      max-width: 900px;
      border: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 40px;
    }
    .myth-label {
      background: rgba(231, 76, 60, 0.3);
      color: #fff;
      padding: 8px 25px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
      display: inline-block;
    }
    .myth-text {
      font-size: 28px;
      line-height: 1.4;
      margin-bottom: 30px;
      text-decoration: line-through;
      opacity: 0.6;
    }
    .truth-label {
      background: rgba(39, 174, 96, 0.3);
      color: #fff;
      padding: 8px 25px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
      display: inline-block;
    }
    .truth-text {
      font-size: 26px;
      line-height: 1.5;
    }
    .footer { position: absolute; bottom: 40px; }
    .handle { font-size: 20px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  
  <div class="header">Common <span class="highlight">Myth</span></div>
  
  <div class="myth-box">
    <div class="myth-label">❌ Myth</div>
    <div class="myth-text">"Speech therapy is only for kids who can't talk."</div>
    
    <div class="truth-label">✓ Truth</div>
    <div class="truth-text">
      Speech therapy addresses ALL communication, including understanding language, social skills, conversation, and alternative communication methods (like AAC).
    </div>
  </div>
  
  <div class="footer">
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
