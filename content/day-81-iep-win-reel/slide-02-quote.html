<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Day 81 - Quote</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
.slide { width: 1080px; height: 1920px; background: linear-gradient(165deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%); padding: 80px 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Poppins', sans-serif; color: white; text-align: center; position: relative; }
.quote-mark { font-family: 'Playfair Display', serif; font-size: 200px; color: #E8B86D; line-height: 0.8; margin-bottom: 30px; }
.quote { font-family: 'Playfair Display', serif; font-style: italic; font-size: 60px; line-height: 1.4; max-width: 900px; margin-bottom: 50px; }
.attribution { font-size: 36px; font-weight: 600; color: #E8B86D; opacity: 0.95; }
.brand { position: absolute; bottom: 40px; font-size: 24px; font-weight: 600; opacity: 0.6; }
</style>
</head>
<body>
<div class="slide">
  <div class="quote-mark">“</div>
  <div class="quote">A year ago I didn’t know what an IEP was. Now I run the meeting.</div>
  <div class="attribution">— You will get there too</div>
  <div class="brand">@spectrum_unlocked</div>
</div>
</body>
</html>
