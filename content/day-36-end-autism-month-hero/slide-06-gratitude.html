<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1350px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 50%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 450px; height: 450px; background: #FDB03E; top: -150px; left: -150px; }
    .bg-shape-2 { width: 350px; height: 350px; background: #18A8F1; bottom: 100px; right: -100px; }
    .emoji { font-size: 100px; margin-bottom: 40px; }
    .title { 
      font-family: 'Playfair Display', serif;
      font-size: 52px; 
      font-weight: 800; 
      margin-bottom: 40px;
      max-width: 850px;
      line-height: 1.2;
    }
    .highlight { color: #FDB03E; }
    .message {
      font-size: 26px;
      line-height: 1.6;
      opacity: 0.9;
      max-width: 800px;
      margin-bottom: 30px;
    }
    .small-text {
      font-size: 20px;
      opacity: 0.7;
    }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .slide-num { font-size: 16px; opacity: 0.4; letter-spacing: 2px; margin-bottom: 8px; }
    .handle { font-size: 18px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  
  <div class="emoji">🙏💙</div>
  
  <div class="title">
    <span class="highlight">Thank You</span> for This Month
  </div>
  
  <div class="message">
    To every parent who showed up tired but still engaged. To every advocate who shared our posts. To every person who learned something new. You made this month meaningful.
  </div>
  
  <div class="small-text">
    This is just the beginning.
  </div>
  
  <div class="footer">
    <div class="slide-num">6 of 7</div>
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
