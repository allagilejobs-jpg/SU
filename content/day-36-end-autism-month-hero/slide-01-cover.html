<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1350px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 50%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.1; }
    .bg-shape-1 { width: 600px; height: 600px; background: #18A8F1; top: -200px; right: -200px; }
    .bg-shape-2 { width: 450px; height: 450px; background: #FDB03E; bottom: -100px; left: -150px; }
    .bg-shape-3 { width: 300px; height: 300px; background: #18A8F1; top: 50%; left: -100px; }
    .badge { 
      background: linear-gradient(135deg, #18A8F1, #FDB03E); 
      color: #2a004a;
      padding: 15px 35px; 
      border-radius: 30px; 
      font-size: 20px; 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 3px;
      margin-bottom: 40px;
    }
    .emoji-row { font-size: 80px; margin-bottom: 30px; }
    .main-title { 
      font-family: 'Playfair Display', serif; 
      font-size: 62px; 
      font-weight: 800; 
      line-height: 1.15; 
      margin-bottom: 30px;
      max-width: 900px;
    }
    .highlight { color: #FDB03E; }
    .highlight-teal { color: #18A8F1; }
    .subtitle {
      font-size: 28px;
      opacity: 0.9;
      margin-bottom: 50px;
      max-width: 800px;
      line-height: 1.4;
    }
    .swipe-cta {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 22px;
      font-weight: 600;
      opacity: 0.8;
      margin-top: 30px;
    }
    .arrow { font-size: 30px; }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .handle { font-size: 20px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  <div class="bg-shape bg-shape-3"></div>
  
  <div class="badge">April 30, 2026</div>
  
  <div class="emoji-row">💙 🌟 💙</div>
  
  <div class="main-title">
    <span class="highlight">Every Life</span> Has <span class="highlight-teal">Value</span>
  </div>
  
  <div class="subtitle">
    Autism Acceptance Month ends, but our mission never stops. A celebration of humanity.
  </div>
  
  <div class="swipe-cta">
    <span>Swipe for our month in review</span>
    <span class="arrow">→</span>
  </div>
  
  <div class="footer">
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
