<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1350px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 50%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.06; }
    .bg-shape-1 { width: 400px; height: 400px; background: #FDB03E; top: -100px; right: -100px; }
    .label { 
      font-size: 16px; 
      text-transform: uppercase; 
      letter-spacing: 4px; 
      opacity: 0.5;
      margin-bottom: 20px;
      margin-top: 20px;
    }
    .title { 
      font-family: 'Playfair Display', serif;
      font-size: 44px; 
      font-weight: 800; 
      color: #FDB03E;
      margin-bottom: 40px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      max-width: 900px;
    }
    .stat-card {
      background: rgba(253, 176, 62, 0.12);
      border: 2px solid rgba(253, 176, 62, 0.25);
      border-radius: 25px;
      padding: 35px;
      text-align: center;
    }
    .stat-number { 
      font-family: 'Playfair Display', serif;
      font-size: 56px; 
      font-weight: 800; 
      color: #FDB03E; 
      margin-bottom: 10px;
    }
    .stat-label { font-size: 18px; opacity: 0.85; }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .slide-num { font-size: 16px; opacity: 0.4; letter-spacing: 2px; margin-bottom: 8px; }
    .handle { font-size: 18px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  
  <div class="label">This Month</div>
  
  <div class="title">What We Built Together</div>
  
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-number">30</div>
      <div class="stat-label">Days of Content</div>
    </div>
    
    <div class="stat-card">
      <div class="stat-number">100+</div>
      <div class="stat-label">Topics Covered</div>
    </div>
    
    <div class="stat-card">
      <div class="stat-number">∞</div>
      <div class="stat-label">Lives Touched</div>
    </div>
    
    <div class="stat-card">
      <div class="stat-number">1</div>
      <div class="stat-label">Amazing Community</div>
    </div>
  </div>
  
  <div class="footer">
    <div class="slide-num">3 of 7</div>
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
