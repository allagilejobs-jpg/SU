<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide { width: 1080px; height: 1350px; background: linear-gradient(165deg, #2a004a 0%, #52008C 40%, #3a005f 100%); padding: 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Poppins', sans-serif; color: white; text-align: center; position: relative; overflow: hidden; }
    .slide::before { content: ''; position: absolute; top: -100px; right: -100px; width: 300px; height: 300px; background: #FDB03E; border-radius: 50%; opacity: 0.08; }
    .slide::after { content: ''; position: absolute; bottom: -80px; left: -80px; width: 200px; height: 200px; background: #18A8F1; border-radius: 50%; opacity: 0.06; }
    .cta-box { background: linear-gradient(135deg, rgba(253, 176, 62, 0.2), rgba(253, 176, 62, 0.05)); border: 2px solid #FDB03E; border-radius: 24px; padding: 50px 40px; max-width: 900px; position: relative; z-index: 1; margin-bottom: 40px; }
    .cta-question { font-family: 'Playfair Display', serif; font-size: 44px; font-weight: 800; color: #FDB03E; margin-bottom: 20px; line-height: 1.2; }
    .cta-text { font-size: 24px; opacity: 0.9; line-height: 1.5; }
    .action-row { display: flex; gap: 40px; margin-bottom: 40px; position: relative; z-index: 1; }
    .action-item { font-size: 20px; font-weight: 700; color: #18A8F1; display: flex; align-items: center; gap: 8px; }
    .recap { font-size: 20px; opacity: 0.7; max-width: 800px; line-height: 1.5; position: relative; z-index: 1; }
    .brand { position: absolute; bottom: 30px; font-size: 16px; font-weight: 600; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="cta-box">
      <div class="cta-question">Where does your child use AAC most?</div>
      <div class="cta-text">Tell us in the comments! Your tips could help another family.</div>
    </div>
    <div class="action-row">
      <div class="action-item">💾 Save for summer</div>
      <div class="action-item">🔁 Share with a family</div>
      <div class="action-item">➕ Follow for more</div>
    </div>
    <div class="recap">Communication doesn't take a summer break. AAC goes everywhere your child goes.</div>
    <div class="brand">@spectrum_unlocked</div>
  </div>
</body>
</html>
