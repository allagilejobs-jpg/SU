<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 98 - 90-Day Recap | Stats</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; }
  .slide {
    width: 1080px; height: 1350px;
    background: linear-gradient(165deg, #2a004a 0%, #52008C 40%, #3a005f 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden; font-family: 'Poppins', sans-serif;
    padding: 60px 70px;
  }
  .slide-num {
    position: absolute; top: 40px; right: 50px;
    color: rgba(255,255,255,0.2); font-size: 18px; font-weight: 700;
  }
  .title {
    font-family: 'Playfair Display', serif; font-size: 48px; font-weight: 700;
    color: #FDB03E; text-align: center; margin-bottom: 50px; line-height: 1.2;
  }
  .stats-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 35px;
    max-width: 850px; width: 100%;
  }
  .stat-item { text-align: center; }
  .stat-number {
    font-family: 'Playfair Display', serif; font-size: 120px; font-weight: 700;
    color: #FDB03E; line-height: 1;
  }
  .stat-label {
    font-size: 24px; color: rgba(255,255,255,0.7); font-weight: 600;
    margin-top: 10px;
  }
  .divider {
    width: 80px; height: 3px; background: #FDB03E; margin: 15px auto 0;
    border-radius: 2px;
  }
  .brand {
    position: absolute; bottom: 40px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,0.3); font-size: 16px; font-weight: 600; letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="slide-num">1 / 4</div>
  <div class="title">By the Numbers</div>
  <div class="stats-grid">
    <div class="stat-item">
      <div class="stat-number">90</div>
      <div class="stat-label">Days of Content</div>
      <div class="divider"></div>
    </div>
    <div class="stat-item">
      <div class="stat-number">38</div>
      <div class="stat-label">Carousel Posts</div>
      <div class="divider"></div>
    </div>
    <div class="stat-item">
      <div class="stat-number">180+</div>
      <div class="stat-label">Individual Slides</div>
      <div class="divider"></div>
    </div>
    <div class="stat-item">
      <div class="stat-number">3</div>
      <div class="stat-label">Months of Growth</div>
      <div class="divider"></div>
    </div>
  </div>
  <div class="brand">@spectrum_unlocked</div>
</div>
</body>
</html>
