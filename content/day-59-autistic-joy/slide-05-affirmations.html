<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1350px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 500px; height: 500px; background: #E8B86D; top: -150px; left: -150px; }
    .bg-shape-2 { width: 350px; height: 350px; background: #27AE60; bottom: 100px; right: -100px; }
    .label { 
      font-size: 16px; 
      text-transform: uppercase; 
      letter-spacing: 4px; 
      opacity: 0.5;
      margin-bottom: 30px;
    }
    .title { 
      font-family: 'Playfair Display', serif;
      font-size: 46px; 
      font-weight: 800; 
      color: #E8B86D;
      margin-bottom: 50px;
    }
    .affirmation {
      font-size: 32px;
      line-height: 1.6;
      max-width: 850px;
      margin-bottom: 25px;
      padding: 20px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .affirmation:last-of-type {
      border-bottom: none;
    }
    .affirmation .emoji {
      font-size: 36px;
      margin-right: 15px;
    }
    .highlight { color: #4A90A4; }
    .highlight-gold { color: #E8B86D; }
    .highlight-green { color: #27AE60; }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .slide-num { font-size: 16px; opacity: 0.4; letter-spacing: 2px; margin-bottom: 8px; }
    .handle { font-size: 18px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  
  <div class="label">Celebrate Yourself</div>
  
  <div class="title">Joy Affirmations</div>
  
  <div class="affirmation">
    <span class="emoji">✨</span>My joy is <span class="highlight-gold">valid</span>
  </div>
  
  <div class="affirmation">
    <span class="emoji">🌟</span>My interests make life <span class="highlight-green">rich</span>
  </div>
  
  <div class="affirmation">
    <span class="emoji">🎉</span>I deserve to feel <span class="highlight">excitement</span>
  </div>
  
  <div class="affirmation">
    <span class="emoji">💃</span>My happy stims are <span class="highlight-gold">beautiful</span>
  </div>
  
  <div class="affirmation">
    <span class="emoji">🌈</span>Being autistic is a <span class="highlight-green">gift</span>
  </div>
  
  <div class="footer">
    <div class="slide-num">4 of 5</div>
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
