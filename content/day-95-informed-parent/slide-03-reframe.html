<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 40%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 70px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 500px; height: 500px; background: #CC78CB; top: -150px; left: -150px; }
    .bg-shape-2 { width: 400px; height: 400px; background: #18A8F1; bottom: -100px; right: -100px; }
    .number {
      position: absolute; top: 40px; right: 40px;
      width: 70px; height: 70px;
      background: #FDB03E; color: #2a004a;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 800;
    }
    .title {
      font-family: 'Playfair Display', serif;
      font-size: 52px; font-weight: 800;
      color: #FDB03E;
      margin-bottom: 35px;
      line-height: 1.1;
    }
    .compare {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 18px;
      max-width: 920px;
      align-items: stretch;
    }
    .col {
      border-radius: 16px;
      padding: 22px 18px;
      text-align: center;
    }
    .col-bad {
      background: rgba(204, 120, 203, 0.12);
      border: 2px solid rgba(204, 120, 203, 0.45);
    }
    .col-good {
      background: rgba(24, 168, 241, 0.12);
      border: 2px solid rgba(24, 168, 241, 0.45);
    }
    .col-label {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .col-bad .col-label { color: #CC78CB; }
    .col-good .col-label { color: #18A8F1; }
    .row { font-size: 19px; line-height: 1.35; padding: 12px 4px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .row:last-child { border-bottom: none; }
    .arrow {
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; color: #FDB03E;
      align-self: center;
    }
    .footer { position: absolute; bottom: 30px; }
    .handle { font-size: 16px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  <div class="number">1</div>

  <div class="title">The Reframe</div>

  <div class="compare">
    <div class="col col-bad">
      <div class="col-label">"Difficult"</div>
      <div class="row">Asks too many questions</div>
      <div class="row">Won't accept the first answer</div>
      <div class="row">Pushes back at meetings</div>
      <div class="row">Brings notes and data</div>
    </div>
    <div class="arrow">→</div>
    <div class="col col-good">
      <div class="col-label">Informed</div>
      <div class="row">Wants the best for their child</div>
      <div class="row">Knows their child's rights</div>
      <div class="row">Advocates effectively</div>
      <div class="row">Holds the team accountable</div>
    </div>
  </div>

  <div class="footer">
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
