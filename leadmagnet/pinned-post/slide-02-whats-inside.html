<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column; justify-content: center;
      padding: 80px; color: white;
    }
    .title { font-size: 52px; font-weight: 700; color: #E8B86D; margin-bottom: 50px; }
    .item { display: flex; align-items: center; margin-bottom: 35px; }
    .check { font-size: 36px; color: #27AE60; margin-right: 20px; }
    .text { font-size: 40px; line-height: 1.3; }
    .brand { position: absolute; bottom: 60px; left: 80px; font-size: 28px; color: rgba(255,255,255,0.6); }
    .slide-num { position: absolute; top: 50px; right: 60px; font-size: 24px; color: rgba(255,255,255,0.4); }
  </style>
</head>
<body>
  <div class="slide-num">2/3</div>
  <div class="title">What's inside:</div>
  <div class="item"><span class="check">✓</span><span class="text">Hour-by-hour action plan</span></div>
  <div class="item"><span class="check">✓</span><span class="text">Scripts for calling doctors & schools</span></div>
  <div class="item"><span class="check">✓</span><span class="text">Insurance checklist</span></div>
  <div class="item"><span class="check">✓</span><span class="text">What NOT to do</span></div>
  <div class="item"><span class="check">✓</span><span class="text">Resource directory</span></div>
  <div class="brand">@spectrum_unlocked</div>
</body>
</html>
