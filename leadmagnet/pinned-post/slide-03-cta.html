<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 80px; color: white; text-align: center;
    }
    .emoji { font-size: 80px; margin-bottom: 40px; }
    .main-text { font-size: 46px; line-height: 1.6; margin-bottom: 60px; max-width: 900px; }
    .highlight { color: #E8B86D; font-weight: 700; }
    .cta { background: #E8B86D; color: #1a1a2e; padding: 30px 60px; border-radius: 20px; font-size: 42px; font-weight: 700; margin-bottom: 40px; }
    .free-text { font-size: 36px; color: #27AE60; font-weight: 600; }
    .brand { position: absolute; bottom: 60px; font-size: 28px; color: rgba(255,255,255,0.6); }
    .slide-num { position: absolute; top: 50px; right: 60px; font-size: 24px; color: rgba(255,255,255,0.4); }
  </style>
</head>
<body>
  <div class="slide-num">3/3</div>
  <div class="emoji">💙</div>
  <div class="main-text">Built by an autism dad who couldn't find this when he needed it.</div>
  <div class="cta">Link in bio 👆</div>
  <div class="free-text">Free forever.</div>
  <div class="brand">@spectrum_unlocked</div>
</body>
</html>
