<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 80px; color: white; text-align: center;
    }
    .free-badge { background: #27AE60; padding: 20px 60px; border-radius: 50px; font-size: 42px; font-weight: 700; margin-bottom: 60px; }
    .main-text { font-size: 58px; font-weight: 700; line-height: 1.4; margin-bottom: 40px; }
    .highlight { color: #E8B86D; }
    .subtitle { font-size: 38px; color: rgba(255,255,255,0.8); }
    .brand { position: absolute; bottom: 60px; font-size: 28px; color: rgba(255,255,255,0.6); }
    .slide-num { position: absolute; top: 50px; right: 60px; font-size: 24px; color: rgba(255,255,255,0.4); }
  </style>
</head>
<body>
  <div class="slide-num">1/3</div>
  <div class="free-badge">FREE</div>
  <div class="main-text">The First <span class="highlight">48 Hours</span> Post-Diagnosis Guide</div>
  <div class="subtitle">For newly diagnosed autism parents</div>
  <div class="brand">@spectrum_unlocked</div>
</body>
</html>
