<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      background: #1a365d;
      font-family: 'Georgia', serif;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 100px; color: white; text-align: center;
    }
    .quote-mark { font-size: 200px; color: rgba(255,255,255,0.15); line-height: 0.5; margin-bottom: 40px; }
    .main-text { font-size: 56px; font-weight: 400; line-height: 1.6; font-style: italic; max-width: 900px; }
    .divider { width: 100px; height: 4px; background: #E8B86D; margin: 60px 0; }
    .brand { font-family: 'Segoe UI', sans-serif; font-size: 32px; color: rgba(255,255,255,0.7); font-style: normal; }
  </style>
</head>
<body>
  <div class="quote-mark">"</div>
  <div class="main-text">The diagnosis doesn't change who your child is. It gives you better tools to support who they've always been.</div>
  <div class="divider"></div>
  <div class="brand">@spectrum_unlocked</div>
</body>
</html>
