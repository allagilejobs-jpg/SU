<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 80px; color: white; text-align: center;
    }
    .emoji { font-size: 100px; margin-bottom: 40px; }
    .main-text { font-size: 48px; font-weight: 600; line-height: 1.5; margin-bottom: 50px; max-width: 900px; }
    .highlight { color: #E8B86D; }
    .features { font-size: 36px; color: rgba(255,255,255,0.8); margin-bottom: 50px; }
    .cta { background: #E8B86D; color: #1a1a2e; padding: 25px 50px; border-radius: 15px; font-size: 38px; font-weight: 700; }
    .brand { position: absolute; bottom: 60px; font-size: 28px; color: rgba(255,255,255,0.6); }
    .slide-num { position: absolute; top: 50px; right: 60px; font-size: 24px; color: rgba(255,255,255,0.4); }
  </style>
</head>
<body>
  <div class="slide-num">7/7</div>
  <div class="emoji">📚</div>
  <div class="main-text">I cover all of this (and more) in my <span class="highlight">free diagnosis guide</span></div>
  <div class="features">Step-by-step. No jargon. No paywall.</div>
  <div class="cta">Link in bio 👆</div>
  <div class="brand">@spectrum_unlocked</div>
</body>
</html>
