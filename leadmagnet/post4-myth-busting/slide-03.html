<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1350px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 50%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 400px; height: 400px; background: #FDB03E; top: -100px; right: -100px; }
    .bg-shape-2 { width: 300px; height: 300px; background: #18A8F1; bottom: 150px; left: -80px; }
    .num {
      font-family: 'Playfair Display', serif;
      font-size: 180px;
      font-weight: 800;
      color: #FDB03E;
      line-height: 1;
      margin-bottom: 30px;
      opacity: 0.9;
    }
    .main-title { 
      font-size: 42px; 
      font-weight: 700; 
      line-height: 1.3; 
      margin-bottom: 40px;
      max-width: 850px;
      text-align: center;
    }
    .highlight { color: #FDB03E; }
    .detail-box {
      background: rgba(24, 168, 241, 0.15);
      border: 1px solid rgba(24, 168, 241, 0.3);
      border-radius: 16px;
      padding: 30px 40px;
      max-width: 800px;
    }
    .detail {
      font-size: 26px;
      opacity: 0.85;
      line-height: 1.5;
      text-align: center;
    }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .handle { font-size: 22px; opacity: 0.5; }
    .slide-num { position: absolute; top: 40px; right: 50px; font-size: 18px; opacity: 0.4; font-weight: 600; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  <div class="slide-num">3/7</div>
  
  <div class="num">2</div>
  
  <div class="main-title">An IEP meeting when <span class="highlight">YOU</span> request one</div>
  
  <div class="detail-box">
    <div class="detail">You don't have to wait for the annual review.</div>
  </div>
  
  <div class="footer">
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
