<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column; justify-content: center;
      padding: 80px; color: white;
    }
    .num { font-size: 100px; color: #E8B86D; font-weight: 800; margin-bottom: 30px; }
    .title { font-size: 52px; font-weight: 700; line-height: 1.3; margin-bottom: 40px; }
    .detail { font-size: 38px; color: rgba(255,255,255,0.8); line-height: 1.5; }
    .brand { position: absolute; bottom: 60px; left: 80px; font-size: 28px; color: rgba(255,255,255,0.6); }
    .slide-num { position: absolute; top: 50px; right: 60px; font-size: 24px; color: rgba(255,255,255,0.4); }
  </style>
</head>
<body>
  <div class="slide-num">3/7</div>
  <div class="num">2</div>
  <div class="title">An IEP meeting when YOU request one</div>
  <div class="detail">You don't have to wait for the annual review.</div>
  <div class="brand">@spectrum_unlocked</div>
</body>
</html>
