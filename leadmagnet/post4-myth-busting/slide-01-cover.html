<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 80px; color: white; text-align: center;
    }
    .num { font-size: 180px; color: #E8B86D; font-weight: 800; margin-bottom: 30px; }
    .main-text { font-size: 62px; font-weight: 700; line-height: 1.3; }
    .highlight { color: #E74C3C; }
    .brand { position: absolute; bottom: 60px; font-size: 28px; color: rgba(255,255,255,0.6); }
    .slide-num { position: absolute; top: 50px; right: 60px; font-size: 24px; color: rgba(255,255,255,0.4); }
  </style>
</head>
<body>
  <div class="slide-num">1/7</div>
  <div class="num">5</div>
  <div class="main-text">things your child's school <span class="highlight">can't legally refuse</span></div>
  <div class="brand">@spectrum_unlocked</div>
</body>
</html>
