<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1350px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 50%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 500px; height: 500px; background: #18A8F1; top: -150px; right: -150px; }
    .bg-shape-2 { width: 400px; height: 400px; background: #FDB03E; bottom: 80px; left: -120px; }
    .emoji { font-size: 100px; margin-bottom: 40px; }
    .quote-icon {
      font-size: 100px;
      color: #FDB03E;
      opacity: 0.3;
      margin-bottom: 20px;
      line-height: 0.5;
    }
    .main-title { 
      font-family: 'Playfair Display', serif; 
      font-size: 50px; 
      font-weight: 700; 
      line-height: 1.4; 
      max-width: 850px;
      margin-bottom: 50px;
    }
    .highlight { color: #FDB03E; }
    .name-tag {
      background: rgba(24, 168, 241, 0.2);
      padding: 20px 40px;
      border-radius: 16px;
      border: 1px solid rgba(24, 168, 241, 0.3);
    }
    .name {
      font-size: 24px;
      font-weight: 600;
      color: #18A8F1;
    }
    .role {
      font-size: 18px;
      opacity: 0.7;
      margin-top: 5px;
    }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .handle { font-size: 22px; opacity: 0.5; }
    .slide-num { position: absolute; top: 40px; right: 50px; font-size: 18px; opacity: 0.4; font-weight: 600; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  <div class="slide-num">4/5</div>
  
  <div class="quote-icon">"</div>
  
  <div class="main-title">
    When my son <span class="highlight">FJ</span> was diagnosed at 3, I searched everywhere for something like this.
    <br><br>
    <span class="highlight">It didn't exist.</span>
    <br><br>
    So I made it.
  </div>
  
  <div class="name-tag">
    <div class="name">Built by an autism dad</div>
    <div class="role">who couldn't find this when he needed it</div>
  </div>
  
  <div class="footer">
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
