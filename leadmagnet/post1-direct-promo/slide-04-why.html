<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1350px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px;
      color: white;
      text-align: center;
    }
    .quote-mark {
      font-size: 150px;
      color: #4A90A4;
      opacity: 0.3;
      line-height: 0.5;
      margin-bottom: 40px;
    }
    .main-text {
      font-size: 52px;
      line-height: 1.5;
      max-width: 900px;
    }
    .highlight {
      color: #E8B86D;
      font-weight: 700;
    }
    .brand {
      position: absolute;
      bottom: 60px;
      font-size: 28px;
      color: rgba(255,255,255,0.6);
    }
    .slide-num {
      position: absolute;
      top: 50px;
      right: 60px;
      font-size: 24px;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <div class="slide-num">4/5</div>
  <div class="quote-mark">"</div>
  <div class="main-text">
    I built this because when my son <span class="highlight">FJ</span> was diagnosed at 3, I searched everywhere for something like this.
    <br><br>
    <span class="highlight">It didn't exist.</span>
    <br><br>
    So I made it.
  </div>
  <div class="brand">@spectrum_unlocked</div>
</body>
</html>
