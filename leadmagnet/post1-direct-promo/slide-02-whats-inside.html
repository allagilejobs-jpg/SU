<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1350px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px;
      color: white;
    }
    .title {
      font-size: 56px;
      font-weight: 700;
      color: #E8B86D;
      margin-bottom: 60px;
    }
    .item {
      display: flex;
      align-items: flex-start;
      margin-bottom: 40px;
    }
    .arrow {
      font-size: 42px;
      color: #4A90A4;
      margin-right: 25px;
      flex-shrink: 0;
    }
    .text {
      font-size: 42px;
      line-height: 1.4;
    }
    .brand {
      position: absolute;
      bottom: 60px;
      left: 80px;
      font-size: 28px;
      color: rgba(255,255,255,0.6);
    }
    .slide-num {
      position: absolute;
      top: 50px;
      right: 60px;
      font-size: 24px;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <div class="slide-num">2/5</div>
  <div class="title">What's inside:</div>
  
  <div class="item">
    <span class="arrow">→</span>
    <span class="text">Hour-by-hour plan for the first 48 hours</span>
  </div>
  
  <div class="item">
    <span class="arrow">→</span>
    <span class="text">Exact script to say when you call the school district</span>
  </div>
  
  <div class="item">
    <span class="arrow">→</span>
    <span class="text">Insurance call checklist (what to ask, word for word)</span>
  </div>
  
  <div class="item">
    <span class="arrow">→</span>
    <span class="text">The 3 calls to make before anything else</span>
  </div>
  
  <div class="brand">@spectrum_unlocked</div>
</body>
</html>
