<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1350px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 50%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 500px; height: 500px; background: #18A8F1; top: -150px; right: -150px; }
    .bg-shape-2 { width: 400px; height: 400px; background: #FDB03E; bottom: 80px; left: -120px; }
    .badge { 
      background: linear-gradient(135deg, #18A8F1 0%, #0F7BB3 100%);
      padding: 16px 45px; 
      border-radius: 50px; 
      font-size: 24px; 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 3px;
      margin-bottom: 50px;
      box-shadow: 0 8px 30px rgba(24, 168, 241, 0.3);
    }
    .main-title { 
      font-family: 'Playfair Display', serif; 
      font-size: 58px; 
      font-weight: 800; 
      line-height: 1.2; 
      margin-bottom: 20px;
      max-width: 800px;
    }
    .subtitle {
      font-size: 26px;
      opacity: 0.8;
      margin-bottom: 50px;
    }
    .cta-box {
      background: linear-gradient(135deg, #FDB03E 0%, #E59A2A 100%);
      color: #2a004a;
      padding: 30px 60px;
      border-radius: 20px;
      margin-bottom: 50px;
      box-shadow: 0 12px 40px rgba(253, 176, 62, 0.3);
    }
    .cta-text {
      font-size: 32px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .share-text {
      font-size: 24px;
      opacity: 0.8;
      max-width: 700px;
      line-height: 1.5;
      margin-bottom: 40px;
    }
    .actions {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .action-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 600;
      opacity: 0.7;
      background: rgba(255,255,255,0.05);
      padding: 12px 25px;
      border-radius: 30px;
    }
    .footer { position: absolute; bottom: 40px; text-align: center; }
    .follow-text { font-size: 14px; opacity: 0.4; margin-bottom: 8px; letter-spacing: 2px; text-transform: uppercase; }
    .handle { font-size: 22px; opacity: 0.6; }
    .slide-num { position: absolute; top: 40px; right: 50px; font-size: 18px; opacity: 0.4; font-weight: 600; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  <div class="slide-num">5/5</div>
  
  <div class="badge">100% Free</div>
  
  <div class="main-title">No catch. No upsell.</div>
  
  <div class="subtitle">Just the guide I wish I had.</div>
  
  <div class="cta-box">
    <div class="cta-text">📥 Link in bio to download</div>
  </div>
  
  <div class="share-text">Know a parent who just got a diagnosis?<br>Send them this post.</div>
  
  <div class="actions">
    <div class="action-item">💾 Save</div>
    <div class="action-item">📤 Share</div>
    <div class="action-item">➕ Follow</div>
  </div>
  
  <div class="footer">
    <div class="follow-text">Free resources for autism parents</div>
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
