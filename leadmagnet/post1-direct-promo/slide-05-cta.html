<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1350px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px;
      color: white;
      text-align: center;
    }
    .free-badge {
      background: #27AE60;
      color: white;
      padding: 15px 50px;
      border-radius: 50px;
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 50px;
    }
    .main-text {
      font-size: 56px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 30px;
    }
    .subtext {
      font-size: 38px;
      color: rgba(255,255,255,0.8);
      margin-bottom: 60px;
    }
    .cta-box {
      background: #E8B86D;
      color: #1a1a2e;
      padding: 30px 60px;
      border-radius: 20px;
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 60px;
    }
    .share-text {
      font-size: 34px;
      color: rgba(255,255,255,0.7);
      max-width: 800px;
      line-height: 1.5;
    }
    .brand {
      position: absolute;
      bottom: 60px;
      font-size: 28px;
      color: rgba(255,255,255,0.6);
    }
    .slide-num {
      position: absolute;
      top: 50px;
      right: 60px;
      font-size: 24px;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <div class="slide-num">5/5</div>
  <div class="free-badge">100% FREE</div>
  <div class="main-text">No catch. No upsell.</div>
  <div class="subtext">Link in bio</div>
  <div class="cta-box">📥 Download Now</div>
  <div class="share-text">Know a parent who just got a diagnosis? Send them this post.</div>
  <div class="brand">@spectrum_unlocked</div>
</body>
</html>
