<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1350px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px;
      color: white;
    }
    .quote-mark {
      font-size: 200px;
      color: #4A90A4;
      opacity: 0.3;
      line-height: 0.5;
      margin-bottom: 40px;
    }
    .main-text {
      font-size: 72px;
      font-weight: 700;
      text-align: center;
      line-height: 1.3;
      max-width: 900px;
    }
    .highlight {
      color: #E8B86D;
    }
    .brand {
      position: absolute;
      bottom: 60px;
      font-size: 28px;
      color: rgba(255,255,255,0.6);
    }
    .slide-num {
      position: absolute;
      top: 50px;
      right: 60px;
      font-size: 24px;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <div class="slide-num">1/5</div>
  <div class="quote-mark">"</div>
  <div class="main-text">
    I made the <span class="highlight">free guide</span> I needed the day my son was diagnosed.
  </div>
  <div class="brand">@spectrum_unlocked</div>
</body>
</html>
