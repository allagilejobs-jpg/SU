<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 50%, #3a005f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 80px; position: relative; overflow: hidden; }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 600px; height: 600px; background: #FDB03E; top: -150px; left: -200px; }
    .bg-shape-2 { width: 500px; height: 500px; background: #18A8F1; bottom: 200px; right: -200px; }
    .arrow { font-size: 150px; margin-bottom: 50px; }
    .main-title { font-family: 'Playfair Display', serif; font-size: 80px; font-weight: 800; }
    .highlight { color: #FDB03E; }
    .footer { position: absolute; bottom: 80px; }
    .handle { font-size: 28px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  <div class="arrow">👆</div>
  <div class="main-title"><span class="highlight">Link in bio</span></div>
  <div class="footer"><div class="handle">@spectrum_unlocked</div></div>
</body>
</html>
