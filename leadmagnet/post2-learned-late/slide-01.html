<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1920px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 80px;
      position: relative; overflow: hidden;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 600px; height: 600px; background: #E8B86D; top: -150px; right: -200px; }
    .bg-shape-2 { width: 500px; height: 500px; background: #4A90A4; bottom: 200px; left: -200px; }
    .main-title { 
      font-family: 'Playfair Display', serif; 
      font-size: 72px; 
      font-weight: 800; 
      line-height: 1.2; 
      max-width: 900px;
    }
    .highlight { color: #E8B86D; }
    .footer { position: absolute; bottom: 80px; text-align: center; }
    .handle { font-size: 28px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  
  <div class="main-title">
    Things I learned <span class="highlight">too late</span> after my son's diagnosis
  </div>
  
  <div class="footer">
    <div class="handle">@spectrum_unlocked</div>
  </div>
</body>
</html>
