<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px;
      color: white;
      text-align: center;
    }
    .main-text {
      font-size: 72px;
      font-weight: 700;
      line-height: 1.3;
    }
    .highlight {
      color: #E8B86D;
    }
    .brand {
      position: absolute;
      bottom: 100px;
      font-size: 32px;
      color: rgba(255,255,255,0.6);
    }
  </style>
</head>
<body>
  <div class="main-text">
    Things I learned <span class="highlight">too late</span> after my son's diagnosis
  </div>
  <div class="brand">@spectrum_unlocked</div>
</body>
</html>
