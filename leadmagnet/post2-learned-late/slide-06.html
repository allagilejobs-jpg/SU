<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 80px; position: relative; overflow: hidden; }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.08; }
    .bg-shape-1 { width: 500px; height: 500px; background: #27AE60; top: -100px; left: -150px; }
    .bg-shape-2 { width: 400px; height: 400px; background: #E8B86D; bottom: 300px; right: -100px; }
    .num { font-family: 'Playfair Display', serif; font-size: 180px; font-weight: 800; color: #E8B86D; margin-bottom: 40px; }
    .main-title { font-size: 52px; font-weight: 700; line-height: 1.3; max-width: 850px; }
    .highlight { color: #27AE60; }
    .footer { position: absolute; bottom: 80px; }
    .handle { font-size: 28px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  <div class="num">5</div>
  <div class="main-title">You are an <span class="highlight">EQUAL member</span> of the IEP team</div>
  <div class="footer"><div class="handle">@spectrum_unlocked</div></div>
</body>
</html>
