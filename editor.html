<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spectrum Unlocked — Template Editor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #0f0f1a;
      color: #fff;
      min-height: 100vh;
    }
    
    /* Layout */
    .app {
      display: grid;
      grid-template-columns: 280px 1fr 300px;
      grid-template-rows: 56px 1fr;
      height: 100vh;
    }
    
    /* Header */
    .header {
      grid-column: 1 / -1;
      background: #1a1a2e;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
    }
    .header h1 span { color: #E8B86D; }
    .header-actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      background: #E8B86D;
      color: #1a1a2e;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { background: #d4a85d; }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.2); }
    
    /* Left Sidebar */
    .sidebar-left {
      background: #1a1a2e;
      border-right: 1px solid rgba(255,255,255,0.1);
      overflow-y: auto;
      padding: 16px;
    }
    .sidebar-section {
      margin-bottom: 24px;
    }
    .sidebar-section h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 12px;
    }
    
    /* Day Selector */
    .day-search {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .day-search::placeholder { color: rgba(255,255,255,0.4); }
    .day-list {
      max-height: 200px;
      overflow-y: auto;
    }
    .day-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      margin-bottom: 4px;
      background: rgba(255,255,255,0.03);
    }
    .day-item:hover { background: rgba(255,255,255,0.08); }
    .day-item.active { background: #E8B86D; color: #1a1a2e; }
    
    /* Templates */
    .template-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .template-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 12px 8px;
      color: #fff;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
    }
    .template-btn:hover { background: rgba(255,255,255,0.1); border-color: #E8B86D; }
    .template-btn .icon { font-size: 20px; display: block; margin-bottom: 4px; }
    
    /* Add Elements */
    .add-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .add-btn {
      background: rgba(74,144,164,0.2);
      border: 1px solid rgba(74,144,164,0.3);
      border-radius: 8px;
      padding: 8px 12px;
      color: #4A90A4;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .add-btn:hover { background: rgba(74,144,164,0.3); }
    
    /* Canvas Area */
    .canvas-area {
      background: #12121f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: auto;
    }
    .canvas-container {
      background: #1a1a2e;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    
    /* Slide Tabs */
    .slide-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .slide-tab {
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .slide-tab:hover { background: rgba(255,255,255,0.2); }
    .slide-tab.active { background: #E8B86D; color: #1a1a2e; }
    .slide-tab-add {
      background: rgba(39,174,96,0.2);
      color: #27AE60;
    }
    
    /* Right Sidebar - Properties */
    .sidebar-right {
      background: #1a1a2e;
      border-left: 1px solid rgba(255,255,255,0.1);
      overflow-y: auto;
      padding: 16px;
    }
    .prop-group {
      margin-bottom: 20px;
    }
    .prop-group h4 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 10px;
    }
    .prop-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .prop-row label {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      min-width: 60px;
    }
    .prop-input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 8px 10px;
      color: #fff;
      font-size: 13px;
      font-family: inherit;
    }
    .prop-input:focus {
      outline: none;
      border-color: #E8B86D;
    }
    select.prop-input {
      cursor: pointer;
    }
    .color-picker {
      width: 40px;
      height: 36px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }
    .prop-colors {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .color-swatch:hover { border-color: #fff; }
    .color-swatch.active { border-color: #E8B86D; }
    
    /* Canvas Size Selector */
    .size-btns {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }
    .size-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 6px 12px;
      color: #fff;
      font-size: 11px;
      cursor: pointer;
    }
    .size-btn:hover { background: rgba(255,255,255,0.1); }
    .size-btn.active { background: #E8B86D; color: #1a1a2e; }
    
    /* Delete Button */
    .delete-btn {
      background: rgba(231,76,60,0.2);
      border: 1px solid rgba(231,76,60,0.3);
      color: #E74C3C;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      margin-top: 10px;
    }
    .delete-btn:hover { background: rgba(231,76,60,0.3); }
    
    /* No Selection */
    .no-selection {
      text-align: center;
      padding: 40px 20px;
      color: rgba(255,255,255,0.4);
      font-size: 13px;
    }
    .no-selection .icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.3;
    }
    
    /* Instructions */
    .instructions {
      background: rgba(74,144,164,0.1);
      border: 1px solid rgba(74,144,164,0.2);
      border-radius: 8px;
      padding: 12px;
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      line-height: 1.6;
      margin-top: 20px;
    }
    .instructions strong { color: #4A90A4; }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <h1>Spectrum <span>Unlocked</span> Editor</h1>
      <div class="header-actions">
        <button class="btn btn-secondary" onclick="exportSlide()">📥 Export PNG</button>
        <button class="btn btn-secondary" onclick="exportAllSlides()">📦 Export All</button>
        <button class="btn" onclick="saveProject()">💾 Save</button>
      </div>
    </header>
    
    <!-- Left Sidebar -->
    <aside class="sidebar-left">
      <div class="sidebar-section">
        <h3>📅 Load Day</h3>
        <input type="text" class="day-search" placeholder="Search days..." id="daySearch" oninput="filterDays()">
        <div class="day-list" id="dayList"></div>
      </div>
      
      <div class="sidebar-section">
        <h3>📐 Templates</h3>
        <div class="template-grid">
          <button class="template-btn" onclick="loadTemplate('cover')"><span class="icon">🎬</span>Cover</button>
          <button class="template-btn" onclick="loadTemplate('myth')"><span class="icon">❌</span>Myth</button>
          <button class="template-btn" onclick="loadTemplate('checklist')"><span class="icon">✓</span>List</button>
          <button class="template-btn" onclick="loadTemplate('vs')"><span class="icon">⚔️</span>VS</button>
          <button class="template-btn" onclick="loadTemplate('grid')"><span class="icon">🔲</span>Grid</button>
          <button class="template-btn" onclick="loadTemplate('cta')"><span class="icon">📢</span>CTA</button>
          <button class="template-btn" onclick="loadTemplate('stats')"><span class="icon">📊</span>Stats</button>
          <button class="template-btn" onclick="loadTemplate('quote')"><span class="icon">💬</span>Quote</button>
        </div>
      </div>
      
      <div class="sidebar-section">
        <h3>➕ Add Elements</h3>
        <div class="add-btns">
          <button class="add-btn" onclick="addText()">📝 Text</button>
          <button class="add-btn" onclick="addHeading()">🔤 Heading</button>
          <button class="add-btn" onclick="addBadge()">🏷️ Badge</button>
          <button class="add-btn" onclick="addRect()">⬜ Rect</button>
          <button class="add-btn" onclick="addCircle()">⭕ Circle</button>
          <button class="add-btn" onclick="addEmoji()">😀 Emoji</button>
        </div>
      </div>
      
      <div class="sidebar-section">
        <h3>📏 Canvas Size</h3>
        <div class="size-btns">
          <button class="size-btn active" onclick="setCanvasSize(1080,1350)" data-size="1080x1350">4:5</button>
          <button class="size-btn" onclick="setCanvasSize(1080,1920)" data-size="1080x1920">9:16</button>
          <button class="size-btn" onclick="setCanvasSize(1080,1080)" data-size="1080x1080">1:1</button>
        </div>
      </div>
    </aside>
    
    <!-- Canvas Area -->
    <main class="canvas-area">
      <div class="slide-tabs" id="slideTabs"></div>
      <div class="canvas-container">
        <canvas id="canvas"></canvas>
      </div>
    </main>
    
    <!-- Right Sidebar - Properties -->
    <aside class="sidebar-right">
      <div id="propertiesPanel">
        <div class="no-selection">
          <div class="icon">🎨</div>
          <p>Select an element on the canvas to edit its properties</p>
        </div>
      </div>
      
      <div class="instructions">
        <strong>Keyboard Shortcuts:</strong><br>
        • <strong>Delete/Backspace</strong> — Remove selected<br>
        • <strong>Ctrl+C / Ctrl+V</strong> — Copy/Paste<br>
        • <strong>Double-click text</strong> — Edit inline<br>
        • <strong>Drag corners</strong> — Resize
      </div>
    </aside>
  </div>

  <script>
    // ============ GLOBAL STATE ============
    let canvas;
    let slides = [{ json: null, name: 'Slide 1' }];
    let currentSlide = 0;
    let canvasWidth = 1080;
    let canvasHeight = 1350;
    let clipboard = null;
    
    // Brand Colors
    const COLORS = {
      gold: '#E8B86D',
      teal: '#4A90A4',
      green: '#27AE60',
      red: '#E74C3C',
      white: '#FFFFFF',
      bgPrimary: '#1a1a2e',
      bgSecondary: '#16213e',
      bgTertiary: '#0f3460'
    };
    
    // 60-Day Calendar Data
    const calendarData = [
      { day: 1, title: "TikTok Autism Myths", topic: "myth-busting" },
      { day: 2, title: "What is Autism?", topic: "education" },
      { day: 3, title: "Stimming Explained", topic: "education" },
      { day: 4, title: "Sensory Processing", topic: "education" },
      { day: 5, title: "Communication Styles", topic: "education" },
      { day: 6, title: "Eye Contact Myths", topic: "myth-busting" },
      { day: 7, title: "Autism Acceptance Month", topic: "awareness" },
      { day: 8, title: "WAAD Introduction", topic: "awareness" },
      { day: 9, title: "Identity-First Language", topic: "education" },
      { day: 10, title: "IEP Accommodations", topic: "practical" },
      { day: 11, title: "Masking & Burnout", topic: "education" },
      { day: 12, title: "Special Interests", topic: "celebration" },
      { day: 13, title: "Autism in Girls", topic: "education" },
      { day: 14, title: "Late Diagnosis", topic: "stories" },
      { day: 15, title: "Meltdown vs Tantrum", topic: "education" },
      { day: 16, title: "Sensory-Friendly Spaces", topic: "practical" },
      { day: 17, title: "Executive Function", topic: "education" },
      { day: 18, title: "Autism & Anxiety", topic: "mental-health" },
      { day: 19, title: "Neurodiversity Movement", topic: "awareness" },
      { day: 20, title: "Workplace Accommodations", topic: "practical" },
      { day: 21, title: "AuDHD Explained", topic: "education" },
      { day: 22, title: "Rejection Sensitivity", topic: "mental-health" },
      { day: 23, title: "Autistic Parenting", topic: "stories" },
      { day: 24, title: "Routine & Transitions", topic: "practical" },
      { day: 25, title: "Autism & Sleep", topic: "health" },
      { day: 26, title: "Social Scripts", topic: "practical" },
      { day: 27, title: "Interoception", topic: "education" },
      { day: 28, title: "Autism & Eating", topic: "health" },
      { day: 29, title: "Pathological Demand Avoidance", topic: "education" },
      { day: 30, title: "Month Reflection", topic: "awareness" },
      { day: 31, title: "Advocacy Tips", topic: "practical" },
      { day: 32, title: "Self-Care for Parents", topic: "wellness" },
      { day: 33, title: "Autism & Creativity", topic: "celebration" },
      { day: 34, title: "Accommodations at School", topic: "practical" },
      { day: 35, title: "Understanding Shutdowns", topic: "education" },
      { day: 36, title: "Autism & Friendship", topic: "social" },
      { day: 37, title: "Therapy Options", topic: "practical" },
      { day: 38, title: "Autism Strengths", topic: "celebration" },
      { day: 39, title: "Sensory Diet", topic: "practical" },
      { day: 40, title: "Nonverbal Communication", topic: "education" },
      { day: 41, title: "AAC Devices", topic: "practical" },
      { day: 42, title: "Autism & Puberty", topic: "health" },
      { day: 43, title: "Dating & Relationships", topic: "social" },
      { day: 44, title: "Employment Statistics", topic: "awareness" },
      { day: 45, title: "Interview Tips", topic: "practical" },
      { day: 46, title: "Disclosure Decisions", topic: "practical" },
      { day: 47, title: "Autism & College", topic: "education" },
      { day: 48, title: "Independent Living", topic: "practical" },
      { day: 49, title: "Autism & Aging", topic: "health" },
      { day: 50, title: "Family Dynamics", topic: "stories" },
      { day: 51, title: "Sibling Perspectives", topic: "stories" },
      { day: 52, title: "Building Support Networks", topic: "practical" },
      { day: 53, title: "Autism Acceptance vs Awareness", topic: "awareness" },
      { day: 54, title: "Harmful Therapies to Avoid", topic: "education" },
      { day: 55, title: "Autistic-Led Organizations", topic: "resources" },
      { day: 56, title: "Books by Autistic Authors", topic: "resources" },
      { day: 57, title: "Creating Inclusive Spaces", topic: "practical" },
      { day: 58, title: "Celebrating Differences", topic: "celebration" },
      { day: 59, title: "Autistic Joy", topic: "celebration" },
      { day: 60, title: "Thank You & Next Steps", topic: "closing" }
    ];
    
    // ============ INITIALIZATION ============
    document.addEventListener('DOMContentLoaded', () => {
      initCanvas();
      renderDayList();
      renderSlideTabs();
      loadTemplate('cover');
    });
    
    function initCanvas() {
      // Calculate display scale (fit in viewport)
      const maxDisplayHeight = window.innerHeight - 180;
      const maxDisplayWidth = window.innerWidth - 620;
      const scale = Math.min(maxDisplayWidth / canvasWidth, maxDisplayHeight / canvasHeight, 0.6);
      
      canvas = new fabric.Canvas('canvas', {
        width: canvasWidth * scale,
        height: canvasHeight * scale,
        backgroundColor: '#1a1a2e',
        preserveObjectStacking: true
      });
      
      // Set zoom to match display scale
      canvas.setZoom(scale);
      
      // Draw gradient background
      drawBackground();
      
      // Event listeners
      canvas.on('selection:created', updatePropertiesPanel);
      canvas.on('selection:updated', updatePropertiesPanel);
      canvas.on('selection:cleared', clearPropertiesPanel);
      canvas.on('object:modified', saveCurrentSlide);
      canvas.on('object:added', saveCurrentSlide);
      
      // Keyboard events
      document.addEventListener('keydown', handleKeyDown);
    }
    
    function drawBackground() {
      // Create gradient background
      const gradient = new fabric.Gradient({
        type: 'linear',
        coords: { x1: 0, y1: 0, x2: canvasWidth, y2: canvasHeight },
        colorStops: [
          { offset: 0, color: COLORS.bgPrimary },
          { offset: 0.5, color: COLORS.bgSecondary },
          { offset: 1, color: COLORS.bgTertiary }
        ]
      });
      
      const bg = new fabric.Rect({
        left: 0,
        top: 0,
        width: canvasWidth,
        height: canvasHeight,
        fill: gradient,
        selectable: false,
        evented: false,
        excludeFromExport: false
      });
      bg.isBackground = true;
      canvas.add(bg);
      canvas.sendToBack(bg);
      
      // Add decorative circles
      const goldCircle = new fabric.Circle({
        left: canvasWidth - 150,
        top: -100,
        radius: 200,
        fill: COLORS.gold,
        opacity: 0.08,
        selectable: false,
        evented: false
      });
      goldCircle.isDecoration = true;
      canvas.add(goldCircle);
      
      const tealCircle = new fabric.Circle({
        left: -100,
        top: canvasHeight - 150,
        radius: 150,
        fill: COLORS.teal,
        opacity: 0.06,
        selectable: false,
        evented: false
      });
      tealCircle.isDecoration = true;
      canvas.add(tealCircle);
    }
    
    // ============ KEYBOARD HANDLING ============
    function handleKeyDown(e) {
      const active = canvas.getActiveObject();
      
      // Delete/Backspace - remove object (unless editing text)
      if ((e.key === 'Delete' || e.key === 'Backspace') && active && !active.isEditing) {
        if (!active.isBackground && !active.isDecoration) {
          canvas.remove(active);
          canvas.discardActiveObject();
          canvas.renderAll();
          clearPropertiesPanel();
        }
        e.preventDefault();
      }
      
      // Ctrl+C - copy
      if (e.ctrlKey && e.key === 'c' && active) {
        active.clone(cloned => { clipboard = cloned; });
      }
      
      // Ctrl+V - paste
      if (e.ctrlKey && e.key === 'v' && clipboard) {
        clipboard.clone(cloned => {
          cloned.set({ left: cloned.left + 20, top: cloned.top + 20 });
          canvas.add(cloned);
          canvas.setActiveObject(cloned);
          canvas.renderAll();
        });
      }
    }
    
    // ============ ADD ELEMENTS ============
    function addText() {
      const text = new fabric.IText('Click to edit', {
        left: canvasWidth / 2,
        top: canvasHeight / 2,
        fontFamily: 'Poppins',
        fontSize: 24,
        fill: COLORS.white,
        originX: 'center',
        originY: 'center'
      });
      canvas.add(text);
      canvas.setActiveObject(text);
      canvas.renderAll();
    }
    
    function addHeading() {
      const text = new fabric.IText('Heading', {
        left: canvasWidth / 2,
        top: canvasHeight / 2,
        fontFamily: 'Playfair Display',
        fontSize: 64,
        fontWeight: '800',
        fill: COLORS.white,
        originX: 'center',
        originY: 'center'
      });
      canvas.add(text);
      canvas.setActiveObject(text);
      canvas.renderAll();
    }
    
    function addBadge() {
      const group = new fabric.Group([], {
        left: canvasWidth / 2,
        top: 100,
        originX: 'center'
      });
      
      const rect = new fabric.Rect({
        width: 200,
        height: 40,
        rx: 20,
        ry: 20,
        fill: COLORS.gold,
        originX: 'center',
        originY: 'center'
      });
      
      const text = new fabric.Text('🚨 BADGE TEXT', {
        fontFamily: 'Poppins',
        fontSize: 14,
        fontWeight: '700',
        fill: COLORS.bgPrimary,
        originX: 'center',
        originY: 'center'
      });
      
      group.addWithUpdate(rect);
      group.addWithUpdate(text);
      canvas.add(group);
      canvas.setActiveObject(group);
      canvas.renderAll();
    }
    
    function addRect() {
      const rect = new fabric.Rect({
        left: canvasWidth / 2,
        top: canvasHeight / 2,
        width: 300,
        height: 200,
        fill: 'rgba(74, 144, 164, 0.15)',
        stroke: 'rgba(74, 144, 164, 0.3)',
        strokeWidth: 2,
        rx: 16,
        ry: 16,
        originX: 'center',
        originY: 'center'
      });
      canvas.add(rect);
      canvas.setActiveObject(rect);
      canvas.renderAll();
    }
    
    function addCircle() {
      const circle = new fabric.Circle({
        left: canvasWidth / 2,
        top: canvasHeight / 2,
        radius: 80,
        fill: COLORS.gold,
        originX: 'center',
        originY: 'center'
      });
      canvas.add(circle);
      canvas.setActiveObject(circle);
      canvas.renderAll();
    }
    
    function addEmoji() {
      const emoji = prompt('Enter emoji:', '✨');
      if (emoji) {
        const text = new fabric.Text(emoji, {
          left: canvasWidth / 2,
          top: canvasHeight / 2,
          fontSize: 80,
          originX: 'center',
          originY: 'center'
        });
        canvas.add(text);
        canvas.setActiveObject(text);
        canvas.renderAll();
      }
    }
    
    // ============ TEMPLATES ============
    function loadTemplate(type) {
      clearCanvas();
      drawBackground();
      
      switch(type) {

    // Property setters
    function setFont(value) {
      const active = canvas.getActiveObject();
      if (active) {
        active.set('fontFamily', value);
        canvas.renderAll();
        saveCurrentSlide();
      }
    }
    
    function setFontSize(value) {
      const active = canvas.getActiveObject();
      if (active) {
        active.set('fontSize', parseInt(value));
        canvas.renderAll();
        saveCurrentSlide();
      }
    }
    
    function setFontWeight(value) {
      const active = canvas.getActiveObject();
      if (active) {
        active.set('fontWeight', value);
        canvas.renderAll();
        saveCurrentSlide();
      }
    }
    
    function setFill(value) {
      const active = canvas.getActiveObject();
      if (active) {
        active.set('fill', value);
        canvas.renderAll();
        updatePropertiesPanel();
        saveCurrentSlide();
      }
    }
    
    function setOpacity(value) {
      const active = canvas.getActiveObject();
      if (active) {
        active.set('opacity', value / 100);
        canvas.renderAll();
        saveCurrentSlide();
      }
    }
    
    function setRadius(value) {
      const active = canvas.getActiveObject();
      if (active) {
        active.set({ rx: parseInt(value), ry: parseInt(value) });
        canvas.renderAll();
        saveCurrentSlide();
      }
    }
    
    function setPosition(prop, value) {
      const active = canvas.getActiveObject();
      if (active) {
        active.set(prop, parseInt(value));
        canvas.renderAll();
        saveCurrentSlide();
      }
    }
    
    function deleteSelected() {
      const active = canvas.getActiveObject();
      if (active && !active.isBackground && !active.isDecoration) {
        canvas.remove(active);
        canvas.discardActiveObject();
        canvas.renderAll();
        clearPropertiesPanel();
        saveCurrentSlide();
      }
    }
    
    // ============ SLIDES ============
    function renderSlideTabs() {
      const container = document.getElementById('slideTabs');
      let html = '';
      
      slides.forEach((slide, i) => {
        html += `<button class="slide-tab ${i === currentSlide ? 'active' : ''}" onclick="switchSlide(${i})">${slide.name}</button>`;
      });
      
      html += `<button class="slide-tab slide-tab-add" onclick="addSlide()">+ Add Slide</button>`;
      container.innerHTML = html;
    }
    
    function saveCurrentSlide() {
      slides[currentSlide].json = canvas.toJSON(['isBackground', 'isDecoration']);
    }
    
    function switchSlide(index) {
      saveCurrentSlide();
      currentSlide = index;
      
      if (slides[index].json) {
        canvas.loadFromJSON(slides[index].json, () => {
          canvas.renderAll();
        });
      } else {
        clearCanvas();
        drawBackground();
      }
      
      renderSlideTabs();
      clearPropertiesPanel();
    }
    
    function addSlide() {
      saveCurrentSlide();
      slides.push({ json: null, name: `Slide ${slides.length + 1}` });
      currentSlide = slides.length - 1;
      clearCanvas();
      drawBackground();
      renderSlideTabs();
    }
    
    // ============ DAY SELECTOR ============
    function renderDayList() {
      const container = document.getElementById('dayList');
      container.innerHTML = calendarData.map(day => 
        `<div class="day-item" onclick="loadDay(${day.day})">Day ${day.day}: ${day.title}</div>`
      ).join('');
    }
    
    function filterDays() {
      const search = document.getElementById('daySearch').value.toLowerCase();
      const items = document.querySelectorAll('.day-item');
      items.forEach(item => {
        item.style.display = item.textContent.toLowerCase().includes(search) ? 'block' : 'none';
      });
    }
    
    function loadDay(dayNum) {
      const day = calendarData.find(d => d.day === dayNum);
      if (day) {
        // For now, load a cover template with the day's title
        loadTemplate('cover');
        
        // Find and update the title text
        const objects = canvas.getObjects();
        const titleObj = objects.find(o => o.type === 'i-text' && o.fontSize > 50);
        if (titleObj) {
          titleObj.set('text', day.title.replace(/ /g, '\n'));
          canvas.renderAll();
          saveCurrentSlide();
        }
        
        // Update day list active state
        document.querySelectorAll('.day-item').forEach((item, i) => {
          item.classList.toggle('active', i === dayNum - 1);
        });
      }
    }
    
    // ============ CANVAS SIZE ============
    function setCanvasSize(width, height) {
      canvasWidth = width;
      canvasHeight = height;
      
      // Update button states
      document.querySelectorAll('.size-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.size === `${width}x${height}`);
      });
      
      // Recalculate scale
      const maxDisplayHeight = window.innerHeight - 180;
      const maxDisplayWidth = window.innerWidth - 620;
      const scale = Math.min(maxDisplayWidth / canvasWidth, maxDisplayHeight / canvasHeight, 0.6);
      
      canvas.setWidth(canvasWidth * scale);
      canvas.setHeight(canvasHeight * scale);
      canvas.setZoom(scale);
      
      // Redraw background
      clearCanvas();
      drawBackground();
      loadTemplate('cover');
    }
    
    // ============ EXPORT ============
    function exportSlide() {
      // Reset zoom for export
      const originalZoom = canvas.getZoom();
      canvas.setZoom(1);
      canvas.setWidth(canvasWidth);
      canvas.setHeight(canvasHeight);
      
      const dataURL = canvas.toDataURL({
        format: 'png',
        quality: 1,
        multiplier: 1
      });
      
      // Restore zoom
      canvas.setZoom(originalZoom);
      canvas.setWidth(canvasWidth * originalZoom);
      canvas.setHeight(canvasHeight * originalZoom);
      
      // Download
      const link = document.createElement('a');
      link.download = `spectrum-slide-${currentSlide + 1}.png`;
      link.href = dataURL;
      link.click();
    }
    
    function exportAllSlides() {
      saveCurrentSlide();
      
      slides.forEach((slide, i) => {
        if (slide.json) {
          // Load slide
          canvas.loadFromJSON(slide.json, () => {
            // Export after load
            setTimeout(() => {
              const originalZoom = canvas.getZoom();
              canvas.setZoom(1);
              canvas.setWidth(canvasWidth);
              canvas.setHeight(canvasHeight);
              
              const dataURL = canvas.toDataURL({ format: 'png', quality: 1 });
              
              canvas.setZoom(originalZoom);
              canvas.setWidth(canvasWidth * originalZoom);
              canvas.setHeight(canvasHeight * originalZoom);
              
              const link = document.createElement('a');
              link.download = `spectrum-slide-${i + 1}.png`;
              link.href = dataURL;
              link.click();
            }, 100);
          });
        }
      });
    }
    
    function saveProject() {
      saveCurrentSlide();
      const data = JSON.stringify({ slides, canvasWidth, canvasHeight });
      const blob = new Blob([data], { type: 'application/json' });
      const link = document.createElement('a');
      link.download = 'spectrum-project.json';
      link.href = URL.createObjectURL(blob);
      link.click();
    }
    
    // ============ UTILITIES ============
    function rgbToHex(color) {
      if (!color) return '#ffffff';
      if (color.startsWith('#')) return color;
      if (color.startsWith('rgba')) {
        const match = color.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
        if (match) {
          return '#' + [match[1], match[2], match[3]].map(x => parseInt(x).toString(16).padStart(2, '0')).join('');
        }
      }
      return '#ffffff';
    }
  </script>
</body>
</html>
