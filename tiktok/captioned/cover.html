<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1080px; height: 1920px; 
      font-family: 'Poppins', sans-serif; color: white;
      background: linear-gradient(165deg, #2a004a 0%, #52008C 50%, #3a005f 100%);
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .bg-shape { position: absolute; border-radius: 50%; }
    .bg-shape-1 { width: 500px; height: 500px; background: rgba(24, 168, 241, 0.08); top: -150px; right: -150px; }
    .bg-shape-2 { width: 500px; height: 500px; background: rgba(24, 168, 241, 0.08); bottom: -150px; left: -150px; }
    .content { text-align: center; padding: 0 50px; z-index: 1; }
    .number { font-size: 180px; font-weight: 900; color: #FDB03E; line-height: 1; margin-bottom: 20px; }
    .main-title { font-family: 'Playfair Display', serif; font-size: 90px; font-weight: 800; line-height: 1.1; margin-bottom: 40px; }
    .highlight { color: #FDB03E; }
    .subtitle { font-size: 36px; opacity: 0.8; font-weight: 500; margin-bottom: 60px; }
    .emojis { font-size: 80px; margin-bottom: 40px; display: flex; justify-content: center; gap: 30px; }
    .cta { font-size: 32px; font-weight: 700; color: #FDB03E; text-transform: uppercase; letter-spacing: 4px; }
    .footer { position: absolute; bottom: 100px; left: 0; right: 0; text-align: center; }
    .handle { font-size: 28px; opacity: 0.6; }
    /* Caption bar */
    .caption-bar {
      position: absolute; bottom: 250px; left: 0; right: 0;
      background: rgba(0,0,0,0.7); padding: 20px 40px;
      text-align: center;
    }
    .caption-text {
      font-size: 38px; font-weight: 600; line-height: 1.4;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  <div class="content">
    <div class="number">4</div>
    <div class="main-title"><span class="highlight">Sensory</span> Hacks</div>
    <div class="subtitle">That Actually Work</div>
    <div class="emojis">🎧 🕶️ 🌀 🍬</div>
    <div class="cta">Watch Now →</div>
  </div>
  <div class="caption-bar">
    <div class="caption-text">Sensory hacks that actually work.</div>
  </div>
  <div class="footer"><div class="handle">@spectrum_unlocked</div></div>
</body>
</html>
