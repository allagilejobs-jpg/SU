    // Render content
    function renderContent(filter = 'all') {
      const grid = document.getElementById('content-grid');
      grid.innerHTML = '';
      
      let filtered = pinterestData;
      if (filter !== 'all') {
        if (filter === 'has-image') {
          filtered = pinterestData.filter(p => p.hasImage);
        } else {
          filtered = pinterestData.filter(p => p.category === filter);
        }
      }
      
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="no-results">No pins found for this filter.</div>';
        return;
      }
      
      // Group by category
      const categories = {
        'beacon': { label: '🧭 Beacon Launch', items: [] },
        'day-60': { label: '📅 60-Day Calendar', items: [] },
        'reel': { label: '🎬 Reels', items: [] },
        'personal': { label: '💛 Personal Stories', items: [] }
      };
      
      filtered.forEach(pin => {
        if (categories[pin.category]) {
          categories[pin.category].items.push(pin);
        }
      });
      
      // Render each category
      for (const [key, cat] of Object.entries(categories)) {
        if (cat.items.length === 0) continue;
        
        // Section header
        const header = document.createElement('div');
        header.className = 'section-header';
        header.innerHTML = `<h2>${cat.label} (${cat.items.length})</h2>`;
        grid.appendChild(header);
        
        // Cards
        cat.items.forEach(pin => {
          const card = createPinCard(pin);
          grid.appendChild(card);
        });
      }
      
      // Update stats
      updateStats();
    }
    
    function createPinCard(pin) {
      const card = document.createElement('div');
      card.className = 'pin-card';
      card.dataset.category = pin.category;
      
      // Determine image path
      let imgPath = '';
      if (pin.imageType === 'pinterest') {
        imgPath = `content/${pin.folder}/slide-01-cover-pinterest.png`;
      } else {
        imgPath = `content/${pin.folder}/slide-01-cover.png`;
      }
      
      // Badge class
      let badgeClass = pin.category;
      let badgeText = pin.category === 'beacon' ? 'Beacon' : 
                      pin.category === 'day-60' ? `Day ${pin.day}` :
                      pin.category === 'reel' ? 'Reel' : 'Personal';
      
      card.innerHTML = `
        <div class="pin-image">
          ${pin.hasImage ? 
            `<img src="${imgPath}" alt="${pin.title}" onerror="this.parentElement.innerHTML='<div class=placeholder>📌</div>'">` :
            '<div class="placeholder">📌</div>'
          }
          <span class="pin-badge ${badgeClass}">${badgeText}</span>
        </div>
        <div class="pin-content">
          <div class="pin-title">${pin.title}</div>
          <div class="pin-desc">${pin.desc}</div>
          <div class="pin-board">📍 ${pin.board}</div>
          <div class="pin-actions">
            <button class="pin-btn copy" onclick="copyPin('${pin.id}')">📋 Copy All</button>
            ${pin.hasImage ? `<a href="${imgPath}" download class="pin-btn download">⬇️ Download</a>` : ''}
          </div>
        </div>
      `;
      
      // Store data for copy
      card.dataset.title = pin.title;
      card.dataset.desc = pin.desc;
      card.dataset.board = pin.board;
      card.id = `pin-${pin.id}`;
      
      return card;
    }
    
    function copyPin(id) {
      const card = document.getElementById(`pin-${id}`);
      const text = `Title: ${card.dataset.title}\n\nDescription: ${card.dataset.desc}\n\nBoard: ${card.dataset.board}`;
      
      navigator.clipboard.writeText(text).then(() => {
        showToast('✓ Copied title, description & board!');
      });
    }
    
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    
    function updateStats() {
      document.getElementById('stat-total').textContent = pinterestData.length;
      document.getElementById('stat-ready').textContent = pinterestData.filter(p => p.hasImage).length;
      document.getElementById('stat-beacon').textContent = pinterestData.filter(p => p.category === 'beacon').length;
      document.getElementById('stat-60day').textContent = pinterestData.filter(p => p.category === 'day-60').length;
    }
    
    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderContent(btn.dataset.filter);
      });
    });
    
    // Initial render
    renderContent();
  </script>
</body>
</html>
